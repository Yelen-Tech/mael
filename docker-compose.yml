services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinelle
      POSTGRES_USER: sentinelle
      POSTGRES_PASSWORD: sentinelle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # ---- outils embarques : un conteneur par outil, aucun binaire sur l'hote ----
  # Ils ne tournent pas en permanence : les adaptateurs les lancent a la demande
  # (docker run --rm). Declares ici pour figer les versions et permettre
  # « docker compose pull » puis « docker save » pour le paquet hors ligne.
  tool-nuclei:
    image: projectdiscovery/nuclei:latest
    profiles: ["tools"]
    entrypoint: ["true"]

  tool-nmap:
    image: instrumentisto/nmap:latest
    profiles: ["tools"]
    entrypoint: ["true"]

  tool-trivy:
    image: aquasec/trivy:latest
    profiles: ["tools"]
    entrypoint: ["true"]

  tool-testssl:
    image: drwetter/testssl.sh:latest
    profiles: ["tools"]
    entrypoint: ["true"]

volumes:
  pgdata:
