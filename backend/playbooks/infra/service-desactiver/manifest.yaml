id: infra.service-desactiver
titre: "Service systemd : arreter, desactiver et masquer"
description: >
  Arrete, desactive et masque le service (et sa socket si elle existe), comme la source.
  L'etat precedent (enabled/masked/active) est garde pour le retour arriere.
risque: moyen
parametres:
  - {nom: service, type: string, requis: true, motif: '^[A-Za-z0-9@_.-]+$'}
racine_requise: true
reversible: true
simulation: true
idempotent: true
redemarrage: false
indisponibilite: "arret immediat du service"
source:
  origine: complianceascode
  version: 0.1.82
  gabarit: shared/templates/service_disabled/bash.template
  ecarts: "etat precedent garde et restaure"
references: [ANSSI-BP-028, CIS Benchmarks]
