      titre: "GNOME : execution automatique des supports interdite (autorun-never=true)"
      paquet: gdm3
      fichiers: [/etc/dconf/db/]
      cle: autorun-never
      attendu: "true"
      controle: "autorun-never=true"
      bon: "autorun-never=true"
      action: "Ecrire autorun-never=true dans /etc/dconf/db/local.d/00-security-settings, verrouiller, puis dconf update."
      mots_cles: [gnome, autorun, supports, usb]
  dconf_gnome_screensaver_idle_delay:
    gabarit: cle_valeur
    theme: sessions
    vars:
      titre: "GNOME : mise en veille apres {var:inactivity_timeout_value} s d'inactivite au plus (idle-delay)"
      paquet: gdm3
      fichiers: [/etc/dconf/db/]
      cle: idle-delay
      comparateur: entre
      attendu: [1, "{var:inactivity_timeout_value}"]
      controle: "idle-delay entre 1 et {var:inactivity_timeout_value}"
      bon: "idle-delay=uint32 {var:inactivity_timeout_value}"
      action: "Ecrire idle-delay=uint32 {var:inactivity_timeout_value} (section [org/gnome/desktop/session]), verrouiller, puis dconf update."
      mots_cles: [gnome, veille, inactivite, ecran, verrouillage]
  dconf_gnome_screensaver_lock_delay:
    gabarit: cle_valeur
    theme: sessions
    vars:
      titre: "GNOME : verrouillage au plus {var:var_screensaver_lock_delay} s apres la mise en veille (lock-delay)"
      paquet: gdm3
      fichiers: [/etc/dconf/db/]
      cle: lock-delay
      comparateur: entre
      attendu: [0, "{var:var_screensaver_lock_delay}"]
      controle: "lock-delay entre 0 et {var:var_screensaver_lock_delay}"
      bon: "lock-delay=uint32 {var:var_screensaver_lock_delay}"
      action: "Ecrire lock-delay=uint32 {var:var_screensaver_lock_delay} (section [org/gnome/desktop/screensaver]), puis dconf update."
      mots_cles: [gnome, verrouillage, ecran, veille]
  dconf_gnome_screensaver_lock_enabled:
    gabarit: cle_valeur
    theme: sessions
    vars:
      titre: "GNOME : ecran verrouille a la mise en veille (lock-enabled=true)"
      paquet: gdm3
      fichiers: [/etc/dconf/db/]
      cle: lock-enabled
      attendu: "true"
      controle: "lock-enabled=true"
      bon: "lock-enabled=true"
      action: "Ecrire lock-enabled=true (section [org/gnome/desktop/screensaver]), verrouiller, puis dconf update."
      mots_cles: [gnome, verrouillage, ecran]
  dconf_gnome_banner_enabled:
    gabarit: cle_valeur
    theme: sessions
    vars:
      titre: "GNOME : banniere d'avertissement a la connexion (banner-message-enable=true)"
      paquet: gdm3
      fichiers: [/etc/dconf/db/, /etc/gdm3/greeter.dconf-defaults]
      cle: banner-message-enable
      attendu: "true"
      controle: "banner-message-enable=true"
      bon: "banner-message-enable=true"
      action: "Ecrire banner-message-enable=true (section [org/gnome/login-screen]), verrouiller, puis dconf update."
      mots_cles: [gnome, banniere, connexion, avertissement]
  dconf_gnome_login_banner_text:
    gabarit: detecteur
    theme: sessions
    vars:
      titre: "GNOME : texte de la banniere de connexion defini"
      paquet: gdm3
      commande: |-
        grep -Rhs "^[[:space:]]*banner-message-text[[:space:]]*=[[:space:]]*'..*'" /etc/dconf/db/ /etc/gdm3/greeter.dconf-defaults
      attendu: presente
      but: "Lire le texte de la banniere de connexion"
      controle: "banner-message-text renseigne"
      bon: "une ligne"
      mauvais: "texte absent"
      action: "Ecrire banner-message-text='TEXTE APPROUVE' dans /etc/gdm3/greeter.dconf-defaults, puis dconf update."
      mots_cles: [gnome, banniere, texte, connexion]
  dconf_gnome_disable_user_list:
    gabarit: cle_valeur
    theme: sessions
    vars:
      titre: "GNOME : liste des utilisateurs masquee a la connexion (disable-user-list=true)"
      paquet: gdm3
      fichiers: [/etc/dconf/db/, /etc/gdm3/greeter.dconf-defaults]
      cle: disable-user-list
      attendu: "true"
      controle: "disable-user-list=true"
      bon: "disable-user-list=true"
      action: "Ecrire disable-user-list=true (section [org/gnome/login-screen]), verrouiller, puis dconf update."
      mots_cles: [gnome, utilisateurs, liste, connexion]
  gnome_gdm_disable_xdmcp:
    gabarit: detecteur
    theme: services-inutiles
    vars:
      titre: "GDM : XDMCP desactive (Enable=false dans [xdmcp])"
      paquet: gdm3
      commande: |-
        awk '/^\[xdmcp\]/{s = 1; next} /^\[/{s = 0} s && /^[[:space:]]*Enable[[:space:]]*=[[:space:]]*false/{print FILENAME}' /etc/gdm3/custom.conf /etc/gdm3/daemon.conf 2>/dev/null
      attendu: presente
      but: "Lire la section [xdmcp] de GDM (Ubuntu custom.conf, Debian daemon.conf)"
      controle: "Enable=false dans [xdmcp]"
      bon: "une ligne"
      mauvais: "Enable absent ou true"
      action: "Ecrire « [xdmcp] » puis « Enable=false » dans /etc/gdm3/custom.conf (Debian : daemon.conf)."
      mots_cles: [gdm, xdmcp, gnome, "acces distant"]

  # ======================================================== mises a jour
  security_patches_up_to_date:
    gabarit: detecteur
    theme: paquets
    vars:
      titre: "Aucune mise a jour de securite en attente"
      commande: |-
        apt list --upgradable 2>/dev/null | grep -i security
      but: "Lister les mises a jour de securite disponibles"
      controle: "aucune mise a jour de securite en attente"
      bon: "aucune ligne"
      action: "apt update && apt full-upgrade (fenetre de maintenance), ou unattended-upgrades."
      mots_cles: [mises a jour, correctifs, securite, apt, patch]
      pieges: ["La liste depend du cache apt : lancer « apt update » avant (commande qui ecrit, validation humaine)."]

