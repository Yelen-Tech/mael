    ignorer: "option yum/dnf (localpkg_gpgcheck) sans equivalent apt"
  ensure_gpgcheck_never_disabled:
    ignorer: "option yum/dnf (gpgcheck=0 par depot) sans equivalent apt"
  dnf-automatic_apply_updates:
    ignorer: "dnf-automatic : propre a RHEL/Fedora"
  dnf-automatic_security_updates_only:
    ignorer: "dnf-automatic : propre a RHEL/Fedora"
  ensure_almalinux_gpgkey_installed:
    ignorer: "cle GPG AlmaLinux : propre a AlmaLinux"
  ensure_oracle_gpgkey_installed:
    ignorer: "cle GPG Oracle : propre a Oracle Linux"
  ensure_redhat_gpgkey_installed:
    ignorer: "cle GPG Red Hat : propre a RHEL"
  package_dracut-fips-aesni_installed:
    ignorer: "dracut-fips-aesni : propre a RHEL"
  enable_authselect:
    ignorer: "authselect : propre a RHEL/Fedora (Debian/Ubuntu : pam-auth-update)"
  selinux_state:
    ignorer: "SELinux non utilise par defaut sur Debian/Ubuntu (AppArmor, couvert par ailleurs)"
