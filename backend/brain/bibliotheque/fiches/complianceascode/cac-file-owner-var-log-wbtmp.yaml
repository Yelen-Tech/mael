id: cac-file-owner-var-log-wbtmp
titre: 'Proprietaire des fichiers motif .*(b|w)tmp((\.|-)[^\/]+)?$ de /var/log/ : root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: proprietaire-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_owner_var_log_wbtmp
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_owner_var_log_wbtmp
mots_cles:
- chown
- fichier
- fichiers
- motif
- proprietaire
- temporaire
resume: 'Proprietaire des fichiers motif .*(b|w)tmp((\.|-)[^\/]+)?$ de /var/log/ : root : proprietaire
  root. (regle file_owner_var_log_wbtmp, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -maxdepth 1 -type f -regextype posix-extended -regex '.*(b|w)tmp((\.|-)[^\/]+)?$'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: lastlog, wtmp et btmp gardent l'historique des connexions reussies et des echecs. Modifiables
    par un compte non autorise, ils permettent d'effacer la trace d'une intrusion ; lisibles, ils revelent
    qui se connecte et quand.
  action: chown root sur les fichiers concernes.
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*(b|w)tmp((\.|-)[^\/]+)?$
    nature: proprietaire
    valeur: root
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
