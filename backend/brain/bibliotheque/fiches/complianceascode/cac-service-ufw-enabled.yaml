id: cac-service-ufw-enabled
titre: Service ufw active et demarre (si ufw est l'outil retenu)
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: service-actif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_ufw_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ufw/service_ufw_enabled
mots_cles:
- demarrage
- service
- services
- systemd
- ufw
resume: Le service ufw doit etre active et demarre. (regle service_ufw_enabled, ComplianceAsCode 0.1.82).
observer:
- commande: systemctl is-enabled ufw.service 2>/dev/null; systemctl is-active ufw.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de ufw
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service ufw enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: moyenne
  risque: Le service ufw doit etre active et demarre pour que ufw protege le systeme.
  action: systemctl enable --now ufw.service
  playbook: infra.service-activer
  parametres:
    service: ufw
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si ufw est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
