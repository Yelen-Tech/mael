resume: Le parametre noyau kernel.kptr_restrict doit valoir 2, en memoire et de facon persistante. (regle
  sysctl_kernel_kptr_restrict, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.kptr_restrict
  but: Lire la valeur ACTIVE de kernel.kptr_restrict
  lecture: 'Attendu : 2.'
- commande: grep -Rs '^[[:space:]]*kernel\.kptr_restrict[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.kptr_restrict = 2 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.kptr_restrict = 2
  bon: 2 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Les adresses du noyau affichees dans /proc permettent a un attaquant de viser precisement ses
    structures sensibles : les masquer rend l''exploitation d''une faille du noyau bien plus difficile.'
  action: Ecrire « kernel.kptr_restrict = 2 » dans /etc/sysctl.conf (lu en dernier) puis appliquer avec
    sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: kernel.kptr_restrict
    valeur: '2'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '2'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.kptr_restrict
    attendu: '2'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
referentiels:
