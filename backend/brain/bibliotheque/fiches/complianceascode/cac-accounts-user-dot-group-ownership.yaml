id: cac-accounts-user-dot-group-ownership
titre: Fichiers d'initialisation (.bashrc...) au groupe principal de l'utilisateur
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: sessions
  type_controle: detection
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: accounts_user_dot_group_ownership
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-session/accounts_user_dot_group_ownership
mots_cles:
- bashrc
- fichiers d'initialisation
- groupe
resume: Fichiers d'initialisation (.bashrc...) au groupe principal de l'utilisateur. (regle accounts_user_dot_group_ownership,
  ComplianceAsCode 0.1.82).
observer:
- commande: 'find /home -mindepth 2 -maxdepth 2 -name ''.*'' -type f -printf ''%G %p\n'' 2>/dev/null |
    awk ''BEGIN{while ((getline l < "/etc/passwd") > 0) {split(l, c, ":"); if (c[3] >= 1000) g[c[6]] =
    c[4]}} {d = $2; sub(/\/[^\/]*$/, "", d)} (d in g) && $1 != g[d] {print $2" : groupe "$1" (attendu
    "g[d]")"}'''
  but: Comparer le groupe des fichiers caches au groupe principal de l'utilisateur
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: groupe = groupe principal
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Les fichiers d'initialisation des utilisateurs interactifs configurent l'environnement de shell
    a la connexion. Une modification malveillante de ces fichiers peut compromettre les comptes a la connexion.
  action: chgrp GROUPE_PRINCIPAL /home/UTILISATEUR/.FICHIER
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
