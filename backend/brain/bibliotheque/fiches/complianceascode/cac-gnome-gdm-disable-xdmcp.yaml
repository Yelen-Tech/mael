id: cac-gnome-gdm-disable-xdmcp
titre: 'GDM : XDMCP desactive (Enable=false dans [xdmcp])'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: gnome_gdm_disable_xdmcp
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/gnome/gnome_login_screen/gnome_gdm_disable_xdmcp
mots_cles:
- acces distant
- gdm
- gnome
- xdmcp
resume: 'GDM : XDMCP desactive (Enable=false dans [xdmcp]). (regle gnome_gdm_disable_xdmcp, ComplianceAsCode
  0.1.82).'
observer:
- commande: dpkg -s gdm3 >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; awk '/^\[xdmcp\]/{s = 1; next}
    /^\[/{s = 0} s && /^[[:space:]]*Enable[[:space:]]*=[[:space:]]*false/{print FILENAME}' /etc/gdm3/custom.conf
    /etc/gdm3/daemon.conf 2>/dev/null
  but: Lire la section [xdmcp] de GDM (Ubuntu custom.conf, Debian daemon.conf)
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: Enable=false dans [xdmcp]
  bon: une ligne
  mauvais: Enable absent ou true
  gravite: elevee
  risque: 'XDMCP fournit un acces distant non chiffre via le gestionnaire d''affichage Gnome (GDM), sans
    confidentialite ni integrite pour les mots de passe ni la session distante. Un utilisateur privilegie
    qui se connecte par XDMCP expose son mot de passe : les evenements X et les frappes clavier transitent
    en clair sur le reseau.'
  action: 'Ecrire « [xdmcp] » puis « Enable=false » dans /etc/gdm3/custom.conf (Debian : daemon.conf).'
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
