resume: Le noyau doit etre compile avec CONFIG_MODULE_SIG_SHA512=y. (regle kernel_config_module_sig_sha512,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_MODULE_SIG_SHA512( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_MODULE_SIG_SHA512=y ». La ligne « # Linux/... » donne l''architecture ;
    option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_MODULE_SIG_SHA512 = y
  bon: CONFIG_MODULE_SIG_SHA512=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: Une fonction de hachage forte (SHA-512) est necessaire pour qu'on ne puisse pas fabriquer un
    module portant une fausse signature valide.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_MODULE_SIG_SHA512
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
