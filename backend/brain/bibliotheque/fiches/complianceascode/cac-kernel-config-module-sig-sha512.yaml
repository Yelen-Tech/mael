id: cac-kernel-config-module-sig-sha512
titre: Option de compilation du noyau CONFIG_MODULE_SIG_SHA512 = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
