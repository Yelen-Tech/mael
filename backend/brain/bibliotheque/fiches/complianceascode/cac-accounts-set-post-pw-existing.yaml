id: cac-accounts-set-post-pw-existing
titre: 'Comptes existants : desactivation apres 45 jours d''inactivite au plus'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_set_post_pw_existing
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/password_expiration/accounts_set_post_pw_existing
mots_cles:
- chage
- existants
- inactif
- inactivite
- shadow
resume: 'Comptes existants : desactivation apres 45 jours d''inactivite au plus. (regle accounts_set_post_pw_existing,
  ComplianceAsCode 0.1.82).'
observer:
- commande: 'awk -F: ''$2 ~ /^\$/ && ($7 == "" || $7 < 0 || $7 > 45) {print $1" "$7}'' /etc/shadow ||
    echo ''SENTINELLE:ILLISIBLE'''
  but: Lister les comptes a mot de passe sans desactivation d'inactivite
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: 7e champ de /etc/shadow entre 0 et 45
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Un compte inactif est une menace : son titulaire ne se connecte plus et ne remarque ni les
    tentatives echouees ni les acces anormaux.'
  action: chage --inactive 45 COMPTE pour chaque compte liste.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
