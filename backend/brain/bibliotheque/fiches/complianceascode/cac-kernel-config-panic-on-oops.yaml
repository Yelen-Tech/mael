resume: Le noyau doit etre compile avec CONFIG_PANIC_ON_OOPS=y. (regle kernel_config_panic_on_oops, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_PANIC_ON_OOPS( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_PANIC_ON_OOPS=y ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_PANIC_ON_OOPS = y
  bon: CONFIG_PANIC_ON_OOPS=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: 'Apres un oops, le noyau est dans un etat incertain : s''arreter evite qu''il continue a tourner
    en corrompant des donnees ou au profit d''un attaquant.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_PANIC_ON_OOPS
    attendu: y
pieges:
