id: cac-package-ufw-removed
titre: Paquet ufw absent (si ufw n'est pas l'outil retenu)
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_ufw_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ufw/package_ufw_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- ufw
resume: Le paquet ufw doit etre absent. (regle package_ufw_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' ufw 2>/dev/null
  but: Savoir si ufw est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet ufw absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: Si un autre pare-feu est retenu, garder ufw installe risque de le voir reactive et de melanger
    deux jeux de regles contradictoires.
  action: Desinstaller ufw (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: ufw
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si ufw n''est pas l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
