id: cac-chronyd-run-as-chrony-user
titre: chrony tourne sous le compte _chrony
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: chronyd_run_as_chrony_user
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/chronyd_run_as_chrony_user
mots_cles:
- chrony
- compte
- privileges
- user
resume: chrony tourne sous le compte _chrony. (regle chronyd_run_as_chrony_user, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg -s chrony >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -Es '^user[[:space:]]'
    /etc/chrony/chrony.conf | grep -v '[[:space:]]_chrony$'
  but: Lire le compte d'execution de chronyd
  lecture: Une ligne = autre compte que _chrony ; aucune (ou « user _chrony ») = conforme.
controles:
- controle: user _chrony (ou absent)
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'chrony doit abandonner les droits root apres son demarrage : une faille dans le service ne
    donne alors que les droits de son compte dedie.'
  action: Mettre « user _chrony » (ou retirer la ligne user) dans /etc/chrony/chrony.conf.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
