- commande: head -c0 /etc/audit/auditd.conf || echo 'SENTINELLE:ILLISIBLE'; grep -Es '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?admin_space_left_action[[:space:]]*='
    /etc/audit/auditd.conf
  but: Lire admin_space_left_action dans /etc/audit/auditd.conf
  lecture: Valeur de admin_space_left_action ; aucune ligne = non defini.
