resume: Le parametre noyau net.core.bpf_jit_harden doit valoir 2, en memoire et de facon persistante.
  (regle sysctl_net_core_bpf_jit_harden, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.core.bpf_jit_harden
  but: Lire la valeur ACTIVE de net.core.bpf_jit_harden
  lecture: 'Attendu : 2.'
- commande: grep -Rs '^[[:space:]]*net\.core\.bpf_jit_harden[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.core.bpf_jit_harden = 2 » ; aucune ligne = non persistant.'
controles:
- controle: net.core.bpf_jit_harden = 2
  bon: 2 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Durcit le compilateur a la volee de BPF : les adresses du noyau dans les programmes BPF sont
    rendues aleatoires et ne sont plus exposees dans /proc/kallsyms, ce qui complique l''exploitation
    du noyau (JIT spraying).'
  action: Ecrire « net.core.bpf_jit_harden = 2 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.core.bpf_jit_harden
    valeur: '2'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '2'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.core.bpf_jit_harden
    attendu: '2'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
