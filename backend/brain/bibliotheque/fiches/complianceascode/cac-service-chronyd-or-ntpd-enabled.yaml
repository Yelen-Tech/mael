id: cac-service-chronyd-or-ntpd-enabled
titre: Un demon NTP (chrony ou ntpd) est actif
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: synchronisation-heure
  type_controle: detection
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: service_chronyd_or_ntpd_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/service_chronyd_or_ntpd_enabled
mots_cles:
- chrony
- heure
- ntp
- ntpd
resume: Un demon NTP (chrony ou ntpd) est actif. (regle service_chronyd_or_ntpd_enabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-active chrony chronyd ntp ntpd 2>/dev/null | grep -x active
  but: Verifier qu'un demon NTP tourne
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: chrony ou ntpd actif
  bon: une ligne « active »
  mauvais: aucun demon NTP
  gravite: moyenne
  risque: 'Une heure exacte est indispensable a l''authentification (Kerberos, certificats) et a la coherence
    des journaux entre machines : sans elle, reconstituer un incident devient impossible.'
  action: apt install chrony puis systemctl enable --now chrony.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
