id: cac-package-bind-removed
titre: Paquet bind / bind9 absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_bind_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/dns/disabling_dns_server/package_bind_removed
mots_cles:
- bind
- bind9
- installe
- logiciel
- paquet
- paquets
resume: Le paquet bind / bind9 doit etre absent. (regle package_bind_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' bind bind9 2>/dev/null
  but: Savoir si bind bind9 est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet bind bind9 absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: S'il n'est pas necessaire de fournir un logiciel de serveur DNS, le retirer constitue une protection
    contre son activation.
  action: Desinstaller bind bind9 (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: bind bind9
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - bind
    - bind9
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.4 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
