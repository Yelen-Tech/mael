- orphelin
- proprietaire
resume: 'Fichiers des repertoires personnels : proprietaire valide. (regle accounts_users_home_files_ownership,
  ComplianceAsCode 0.1.82).'
observer:
- commande: find /home -xdev -nouser 2>/dev/null
  but: Chercher les fichiers sans proprietaire valide sous /home
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun fichier orphelin
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Si les fichiers des repertoires personnels n'appartiennent pas a leurs utilisateurs, des utilisateurs
    non autorises peuvent y acceder ; c'est aussi un signe possible de compromission.
  action: chown -R UTILISATEUR /home/UTILISATEUR (ou supprimer les fichiers orphelins).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
