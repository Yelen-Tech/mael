resume: Le parametre noyau net.ipv4.conf.all.accept_redirects doit valoir 0, en memoire et de facon persistante.
  (regle sysctl_net_ipv4_conf_all_accept_redirects, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.conf.all.accept_redirects
  but: Lire la valeur ACTIVE de net.ipv4.conf.all.accept_redirects
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.conf\.all\.accept_redirects[[:space:]]*=' /etc/sysctl.conf
    /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.conf.all.accept_redirects = 0 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.conf.all.accept_redirects = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Les redirections ICMP modifient la table de routage de la machine sans aucune authentification
    : un attaquant du reseau local peut detourner le trafic par sa machine (homme du milieu). Elles n''ont
    presque aucun usage legitime.'
  action: Ecrire « net.ipv4.conf.all.accept_redirects = 0 » dans /etc/sysctl.conf (lu en dernier) puis
    appliquer avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.conf.all.accept_redirects
    valeur: '0'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '0'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv4.conf.all.accept_redirects
    attendu: '0'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
