id: cac-accounts-password-pam-maxrepeat
titre: 'Mots de passe : repetitions consecutives d''un caractere (maxrepeat entre 1 et 3)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_pam_maxrepeat
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_maxrepeat
mots_cles:
- caractere
- complexite
- consecutives
- maxrepeat
- mot de passe
- mots de passe
- pam
- politique
- pwquality
- repetitions
resume: pwquality doit imposer maxrepeat entre 1 et 3 (repetitions consecutives d'un caractere). (regle
  accounts_password_pam_maxrepeat, ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*maxrepeat[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de maxrepeat configuree pour pwquality
  lecture: « maxrepeat = N » ; aucune ligne = valeur par defaut du module (0).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: maxrepeat entre 1 et 3
  bon: maxrepeat entre 1 et 3, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: Les mots de passe qui repetent le meme caractere (aaaa, 1111) sont parmi les premiers testes
    par les attaques par devinette.
  action: Ecrire « maxrepeat = 3 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: maxrepeat
    valeur: '3'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: entre
    champ: maxrepeat
    attendu:
    - 1
    - 3
    defaut: '0'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.2.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.2.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.2.4 (niveau 1)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
