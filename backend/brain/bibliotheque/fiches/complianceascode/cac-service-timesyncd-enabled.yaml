id: cac-service-timesyncd-enabled
titre: Service systemd-timesyncd active et demarre (si systemd-timesyncd est l'outil retenu)
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: service-actif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_timesyncd_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/service_timesyncd_enabled
mots_cles:
- demarrage
- service
- services
- systemd
- systemd-timesyncd
- timesyncd
resume: Le service systemd-timesyncd doit etre active et demarre. (regle service_timesyncd_enabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled systemd-timesyncd.service 2>/dev/null; systemctl is-active systemd-timesyncd.service
    2>/dev/null
  but: Lire l'etat de demarrage et d'execution de systemd-timesyncd
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service systemd-timesyncd enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: elevee
  risque: 'systemd-timesyncd synchronise l''horloge sur un serveur de temps : une heure exacte est indispensable
    a l''authentification et a la coherence des journaux entre machines.'
  action: systemctl enable --now systemd-timesyncd.service
  playbook: infra.service-activer
  parametres:
    service: systemd-timesyncd
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si systemd-timesyncd est l''outil retenu (var_timesync_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.3.1.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
