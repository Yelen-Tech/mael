id: cac-audit-rules-time-watch-localtime
titre: Audit des modifications de /etc/localtime
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: 2
    anssi: renforce
source:
  origine: complianceascode
  regle: audit_rules_time_watch_localtime
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_time_rules/audit_rules_time_watch_localtime
mots_cles:
- audit
- auditctl
- auditd
- journalisation
- localtime
- modification
- surveillance
- tracabilite
resume: Toute ecriture ou changement d'attribut de /etc/localtime doit etre trace par auditd (-w /etc/localtime
  -p wa). (regle audit_rules_time_watch_localtime, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -w /etc/localtime -p wa
  bon: regle -w /etc/localtime -p wa chargee et persistante
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: Changer l'heure du systeme permet de brouiller la chronologie des journaux pour masquer une
    activite malveillante, et perturbe les services qui dependent d'une heure exacte. Tout changement
    d'heure doit etre trace.
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -w /etc/localtime -p wa -k mael
  evaluation:
  - lecteur: audit
    comparateur: surveille
    champ: /etc/localtime
    attendu: wa
    commande: 0
  - lecteur: audit
    comparateur: surveille
    champ: /etc/localtime
    attendu: wa
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
