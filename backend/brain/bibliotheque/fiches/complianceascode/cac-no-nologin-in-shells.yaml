observer:
- commande: grep nologin /etc/shells
  but: Chercher nologin dans /etc/shells
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: nologin absent de /etc/shells
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: /etc/shells dit quels shells sont de vrais shells de connexion ; chsh, ftp et d'autres programmes
    s'y fient pour restreindre un compte. Y declarer nologin fait passer des comptes bloques pour des
    comptes interactifs.
  action: Retirer les lignes nologin de /etc/shells.
