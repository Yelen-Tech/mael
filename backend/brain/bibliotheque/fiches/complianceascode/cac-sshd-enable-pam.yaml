id: cac-sshd-enable-pam
titre: 'SSH : PAM active (UsePAM yes)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_enable_pam
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_enable_pam
mots_cles:
- authentification
- modules
- pam
- ssh
- sshd
- usepam
resume: La directive sshd UsePAM doit valoir « yes » (regle sshd_enable_pam, ComplianceAsCode 0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^usepam '
  but: Lire la valeur EFFECTIVE de UsePAM
  lecture: 'Attendu : « usepam yes ». Toute autre valeur est un ecart.'
- commande: grep -Ris '^[[:space:]]*UsePAM[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
  but: Trouver ou UsePAM est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: UsePAM = yes
  bon: UsePAM yes
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Sans PAM, les controles de compte et de session (restrictions par adresse, horaire, verrouillage
    de compte) ne s'appliquent pas aux connexions SSH.
  action: Definir « UsePAM yes » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: UsePAM
    valeur: 'yes'
  evaluation:
  - comparateur: egal
    attendu: 'yes'
    commande: 0
    lecteur: sshd_t
    champ: usepam
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.22 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.22 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.22 (niveau 1)
verifie_le: '2026-09-17'
relu_par: Yelen Tech
