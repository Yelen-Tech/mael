- 64 bits
- architecture
- uname
resume: Systeme d'exploitation 64 bits. (regle prefer_64bit_os, ComplianceAsCode 0.1.82).
observer:
- commande: uname -m | grep -Ev '^(x86_64|aarch64|ppc64le|s390x)$'
  but: Lire l'architecture du systeme
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: architecture 64 bits
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Un systeme 64 bits offre un espace d''adresses bien plus large a la randomisation (ASLR) et
    toujours le bit de non-execution (NX) : l''exploitation des failles memoire y est plus difficile.'
  action: Reinstaller en 64 bits si le processeur le permet (lscpu | grep 'CPU op-mode').
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
