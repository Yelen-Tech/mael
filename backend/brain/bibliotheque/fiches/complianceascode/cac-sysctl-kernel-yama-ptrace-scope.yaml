resume: Le parametre noyau kernel.yama.ptrace_scope doit valoir 1, en memoire et de facon persistante.
  (regle sysctl_kernel_yama_ptrace_scope, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.yama.ptrace_scope
  but: Lire la valeur ACTIVE de kernel.yama.ptrace_scope
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*kernel\.yama\.ptrace_scope[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.yama.ptrace_scope = 1 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.yama.ptrace_scope = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Sans restriction de ptrace, un programme compromis peut espionner les autres processus du meme
    utilisateur (session SSH, navigateur) et leur voler des secrets, sans aucune action de sa part.
  action: Ecrire « kernel.yama.ptrace_scope = 1 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: kernel.yama.ptrace_scope
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.yama.ptrace_scope
    attendu: '1'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
