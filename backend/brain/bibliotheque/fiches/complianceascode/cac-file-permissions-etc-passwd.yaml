id: cac-file-permissions-etc-passwd
titre: Droits de /etc/passwd (0644 au plus)
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_permissions_etc_passwd
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_important_account_files/file_permissions_etc_passwd
mots_cles:
- chmod
- comptes
- droits
- fichier
- fichiers
- passwd
- permissions
- utilisateurs
resume: 'Droits de /etc/passwd : 0644 ou plus strict (aucun droit en plus). (regle file_permissions_etc_passwd,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/passwd 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0644. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0644
  bon: 0644 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Si /etc/passwd est modifiable par son groupe ou par tous, n''importe quel utilisateur peut
    ajouter un compte ou se donner l''UID 0. Ce fichier liste les comptes : sa protection est essentielle.'
  action: chmod 0644 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/passwd
    mode: '0644'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0644'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 7.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 7.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 7.1.1 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
