id: cac-audit-sudo-log-events
titre: Audit des modifications de /var/log/sudo.log
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: 2
    anssi: renforce
source:
  origine: complianceascode
  regle: audit_sudo_log_events
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_sudo_log_events
mots_cles:
- audit
- auditctl
- auditd
- journalisation
- modification
- sudo
- surveillance
- tracabilite
resume: Toute ecriture ou changement d'attribut de /var/log/sudo.log doit etre trace par auditd (-w /var/log/sudo.log
  -p wa). (regle audit_sudo_log_events, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -w /var/log/sudo.log -p wa
  bon: regle -w /var/log/sudo.log -p wa chargee et persistante
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: 'Le journal de sudo retrace les actions d''administration : s''il peut etre modifie sans trace,
    un attaquant peut effacer ce qu''il a fait avec des droits root.'
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -w /var/log/sudo.log -p wa -k mael
  evaluation:
  - lecteur: audit
    comparateur: surveille
    champ: /var/log/sudo.log
    attendu: wa
    commande: 0
  - lecteur: audit
    comparateur: surveille
    champ: /var/log/sudo.log
    attendu: wa
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
referentiels:
