id: cac-accounts-password-pam-difok
titre: 'Mots de passe : caracteres differents de l''ancien mot de passe (difok au moins 2)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_pam_difok
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_difok
mots_cles:
- ancien
- caracteres
- complexite
- differents
- difok
- mot de passe
- mots de passe
- pam
- passe
- politique
- pwquality
resume: pwquality doit imposer difok au moins 2 (caracteres differents de l'ancien mot de passe). (regle
  accounts_password_pam_difok, ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*difok[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de difok configuree pour pwquality
  lecture: « difok = N » ; aucune ligne = valeur par defaut du module (1).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: difok au moins 2
  bon: difok au moins 2, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: Exiger un nombre minimal de caracteres differents a chaque changement evite qu'un nouveau mot
    de passe ressemble a l'ancien (qui a pu etre compromis). Un mot de passe change sur une machine deja
    compromise reste toutefois compromis.
  action: Ecrire « difok = 2 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: difok
    valeur: '2'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: au_moins
    champ: difok
    attendu: '2'
    defaut: '1'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.2.1 (niveau 1)
verifie_le: '2026-09-18'
relu_par: Yelen Tech
