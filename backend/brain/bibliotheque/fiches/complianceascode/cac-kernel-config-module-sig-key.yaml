id: cac-kernel-config-module-sig-key
titre: Option de compilation du noyau CONFIG_MODULE_SIG_KEY = certs/signing_key.pem
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_module_sig_key
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_module_sig_key
mots_cles:
- compilation
- config_module_sig_key
- kernel
- module
- noyau
resume: Le noyau doit etre compile avec CONFIG_MODULE_SIG_KEY=certs/signing_key.pem. (regle kernel_config_module_sig_key,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_MODULE_SIG_KEY( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_MODULE_SIG_KEY=certs/signing_key.pem ». La ligne « # Linux/... » donne
    l''architecture ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_MODULE_SIG_KEY = certs/signing_key.pem
  bon: CONFIG_MODULE_SIG_KEY=certs/signing_key.pem
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: Une cle et un certificat sont necessaires pour signer les modules compiles avec le noyau.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_MODULE_SIG_KEY
    attendu: certs/signing_key.pem
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
