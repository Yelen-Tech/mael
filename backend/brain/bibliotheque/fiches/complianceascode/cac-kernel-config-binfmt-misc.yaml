id: cac-kernel-config-binfmt-misc
titre: Option de compilation du noyau CONFIG_BINFMT_MISC = n
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_binfmt_misc
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_binfmt_misc
mots_cles:
- binfmt
- compilation
- config_binfmt_misc
- kernel
- misc
- noyau
resume: Le noyau doit etre compile avec CONFIG_BINFMT_MISC=n. (regle kernel_config_binfmt_misc, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_BINFMT_MISC( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_BINFMT_MISC is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_BINFMT_MISC = n
  bon: '# CONFIG_BINFMT_MISC is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: moyenne
  risque: 'binfmt_misc permet d''enregistrer des interpreteurs pour des formats de binaires arbitraires
    : le desactiver reduit la surface d''attaque.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_BINFMT_MISC
    attendu: n
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
