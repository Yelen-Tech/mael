id: cac-kernel-config-acpi-custom-method
titre: Option de compilation du noyau CONFIG_ACPI_CUSTOM_METHOD = n
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_acpi_custom_method
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_acpi_custom_method
mots_cles:
- acpi
- compilation
- config_acpi_custom_method
- custom
- kernel
- method
- noyau
resume: Le noyau doit etre compile avec CONFIG_ACPI_CUSTOM_METHOD=n. (regle kernel_config_acpi_custom_method,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_ACPI_CUSTOM_METHOD( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_ACPI_CUSTOM_METHOD is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_ACPI_CUSTOM_METHOD = n
  bon: '# CONFIG_ACPI_CUSTOM_METHOD is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: faible
  risque: Cette option permet a root d'ecrire n'importe ou dans la memoire du noyau via ACPI, et donc
    de contourner les protections du noyau (verrouillage, modules signes).
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_ACPI_CUSTOM_METHOD
    attendu: n
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R15 (niveau eleve)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
