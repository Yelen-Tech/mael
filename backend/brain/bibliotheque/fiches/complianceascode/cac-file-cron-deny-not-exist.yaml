id: cac-file-cron-deny-not-exist
titre: Fichier /etc/cron.deny absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: planification
  type_controle: existence-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_cron_deny_not_exist
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/cron_and_at/restrict_at_cron_users/file_cron_deny_not_exist
mots_cles:
- absent
- cron
- deny
- fichier
- planification
- taches
resume: /etc/cron.deny doit etre absent. (regle file_cron_deny_not_exist, ComplianceAsCode 0.1.82).
observer:
- commande: stat -c '%a %U %G %n' /etc/cron.deny 2>/dev/null
  but: Voir si /etc/cron.deny existe (droits, proprietaire)
  lecture: Une ligne = present ; aucune = absent.
controles:
- controle: /etc/cron.deny absent
  bon: absent
  mauvais: present
  gravite: moyenne
  risque: 'Une liste des comptes autorises (cron.allow, at.allow) est plus sure qu''une liste d''interdits
    : un compte oublie n''obtient rien. Planifier une tache permet de relancer du code a intervalles reguliers,
    y compris pour garder un acces apres une intrusion.'
  action: Supprimer /etc/cron.deny apres verification.
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
  sans_playbook: 'retirer cron.deny sans cron.allow ouvre crontab a TOUS les comptes : creer et remplir
    cron.allow d''abord'
pieges:
- 'Sur Debian/Ubuntu, sans cron.allow ni cron.deny, tous les comptes peuvent utiliser crontab : ne retirer
  cron.deny qu''une fois /etc/cron.allow en place.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.4.1.8 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.4.1.8 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.4.1.8 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
