id: cac-file-permissions-var-log-lastlog
titre: Droits des fichiers motif .*lastlog(\.[^\/]+)?$ de /var/log/ (0664 au plus)
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_permissions_var_log_lastlog
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_permissions_var_log_lastlog
mots_cles:
- chmod
- droits
- fichier
- fichiers
- lastlog
- motif
- permissions
resume: 'Droits des fichiers motif .*lastlog(\.[^\/]+)?$ de /var/log/ : 0664 ou plus strict (aucun droit
  en plus). (regle file_permissions_var_log_lastlog, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -maxdepth 1 -type f -regextype posix-extended -regex '.*lastlog(\.[^\/]+)?$'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0664. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0664
  bon: 0664 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: lastlog, wtmp et btmp gardent l'historique des connexions reussies et des echecs. Modifiables
    par un compte non autorise, ils permettent d'effacer la trace d'une intrusion ; lisibles, ils revelent
    qui se connecte et quand.
  action: chmod 0664 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*lastlog(\.[^\/]+)?$
    nature: droits
    valeur: '0664'
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0664'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
