id: cac-aide-verify-acls
titre: AIDE verifie les ACL (option acl)
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: integrite
  type_controle: detection
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: aide_verify_acls
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/integrity/software-integrity/aide/aide_verify_acls
mots_cles:
- acl
- aide
- integrite
resume: AIDE verifie les ACL (option acl). (regle aide_verify_acls, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg -s aide >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -hEs '^[^#]*\bacl\b' /etc/aide/aide.conf
    /etc/aide/aide.conf.d/*
  but: Chercher l'option acl dans les regles AIDE
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: acl dans les regles
  bon: une ligne
  mauvais: acl absent
  gravite: faible
  risque: 'Les ACL peuvent accorder des droits au-dela des droits classiques d''un fichier : un intrus
    peut s''ouvrir un acces par ce biais sans changer son mode. AIDE doit aussi les verifier.'
  action: Ajouter acl a la regle utilisee (ex. FIPSR = p+i+n+u+g+s+m+c+acl+xattrs+sha256).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
