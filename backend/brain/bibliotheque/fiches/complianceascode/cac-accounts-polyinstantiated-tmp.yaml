id: cac-accounts-polyinstantiated-tmp
titre: /tmp polyinstancie par utilisateur (pam_namespace)
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: sessions
  type_controle: detection
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: accounts_polyinstantiated_tmp
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-session/accounts_polyinstantiated_tmp
mots_cles:
- /tmp
- namespace
- polyinstanciation
- temporaire
resume: /tmp polyinstancie par utilisateur (pam_namespace). (regle accounts_polyinstantiated_tmp, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*/tmp[[:space:]]+/tmp/tmp-inst/[[:space:]]+level[[:space:]]+root,adm'
    /etc/security/namespace.conf
  but: Lire la configuration de polyinstanciation de /tmp
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: « /tmp /tmp/tmp-inst/ level root,adm » dans namespace.conf
  bon: une ligne
  mauvais: aucune ligne
  gravite: faible
  risque: Un /tmp commun a tous les utilisateurs permet des attaques entre comptes (fichier piege, lien
    symbolique, lecture de fichiers temporaires). La polyinstanciation donne a chaque utilisateur son
    propre /tmp prive.
  action: mkdir --mode 000 /tmp/tmp-inst puis ajouter « /tmp /tmp/tmp-inst/ level root,adm » a /etc/security/namespace.conf.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
