id: cac-package-tnftp-removed
titre: Paquet tnftp absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_tnftp_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ftp/package_tnftp_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- tnftp
resume: Le paquet tnftp doit etre absent. (regle package_tnftp_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' tnftp 2>/dev/null
  but: Savoir si tnftp est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet tnftp absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: Sauf besoin d'utiliser le protocole standard de transfert de fichiers d'Internet (par exemple
    pour des telechargements anonymes), retirer le paquet est recommande pour reduire la surface d'attaque
    potentielle.
  action: Desinstaller tnftp (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: tnftp
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - tnftp
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
