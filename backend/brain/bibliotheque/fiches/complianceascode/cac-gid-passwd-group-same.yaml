id: cac-gid-passwd-group-same
titre: Chaque groupe principal de /etc/passwd existe dans /etc/group
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: gid_passwd_group_same
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/password_storage/gid_passwd_group_same
mots_cles:
- comptes
- gid
- group
- groupe
- passwd
resume: Chaque groupe principal de /etc/passwd existe dans /etc/group. (regle gid_passwd_group_same, ComplianceAsCode
  0.1.82).
observer:
- commande: 'awk -F: ''NR==FNR{g[$3]=1; next} !($4 in g) {print $1":"$4}'' /etc/group /etc/passwd'
  but: Lister les comptes dont le GID n'existe pas
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: tous les GID de /etc/passwd definis
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: faible
  risque: Un compte rattache a un GID qui n'existe pas dans /etc/group recevra les droits du groupe cree
    plus tard avec ce GID, y compris sur des fichiers qui ne lui etaient pas destines.
  action: Creer le groupe manquant (groupadd -g GID NOM) ou corriger le compte.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
