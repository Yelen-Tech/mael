id: cac-set-nftables-loopback-traffic
titre: 'nftables : boucle locale autorisee, 127.0.0.0/8 et ::1 refuses ailleurs (si nftables est l''outil
  retenu)'
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: set_nftables_loopback_traffic
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-nftables/set_nftables_loopback_traffic
mots_cles:
- boucle locale
- lo
- loopback
- nftables
resume: 'nftables : boucle locale autorisee, 127.0.0.0/8 et ::1 refuses ailleurs. (regle set_nftables_loopback_traffic,
  ComplianceAsCode 0.1.82).'
observer:
- commande: nft list ruleset | awk '/hook input/,/}/' | grep -E 'iif "lo" accept|saddr (127.0.0.0/8|::1)'
  but: Lire les regles de boucle locale de la chaine input
  lecture: 'Attendu : iif "lo" accept ET un refus de 127.0.0.0/8 et de ::1 ; une regle manquante = ecart.'
controles:
- controle: regles de boucle locale presentes
  bon: iif "lo" accept + drop de 127.0.0.0/8 et ::1
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Le trafic de boucle locale est genere entre processus de la machine et est essentiel a son
    fonctionnement. La boucle locale est le seul endroit ou ce trafic doit apparaitre : les autres interfaces
    doivent l''ignorer, comme mesure anti-usurpation.'
  action: 'Ajouter : iif "lo" accept ; ip saddr 127.0.0.0/8 drop ; ip6 saddr ::1 drop'
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si nftables est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 4.2.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 4.3.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 4.3.6 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
