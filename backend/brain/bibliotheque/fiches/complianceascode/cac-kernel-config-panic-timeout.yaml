id: cac-kernel-config-panic-timeout
titre: Option de compilation du noyau CONFIG_PANIC_TIMEOUT = 0
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_panic_timeout
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_panic_timeout
mots_cles:
- compilation
- config_panic_timeout
- kernel
- noyau
- panic
- timeout
resume: Le noyau doit etre compile avec CONFIG_PANIC_TIMEOUT=0. (regle kernel_config_panic_timeout, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_PANIC_TIMEOUT( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_PANIC_TIMEOUT=0 ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_PANIC_TIMEOUT = 0
  bon: CONFIG_PANIC_TIMEOUT=0
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: 'Fixe le delai avant redemarrage apres une panique du noyau (0 = jamais, la machine reste arretee
    pour analyse) : un redemarrage automatique peut masquer une attaque qui fait paniquer le noyau.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_PANIC_TIMEOUT
    attendu: '0'
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R19 (niveau eleve)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
