id: cac-service-snmpd-disabled
titre: Service snmpd desactive et arrete
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_snmpd_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/snmp/disabling_snmp_service/service_snmpd_disabled
mots_cles:
- demarrage
- service
- services
- snmpd
- systemd
resume: Le service snmpd doit etre desactive et arrete. (regle service_snmpd_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg -s snmpd >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; systemctl is-enabled snmpd.service
    2>/dev/null; systemctl is-active snmpd.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de snmpd
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service snmpd disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: faible
  risque: Un logiciel SNMP offre une voie d'attaque reseau ; le desactiver s'il n'est pas necessaire.
  action: systemctl disable --now snmpd.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: snmpd
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
pieges:
- 'Regle limitee par la source a : system_with_kernel and package[snmpd]. Hors de ce cas, la commande
  repond « sans objet » (aucun ecart).'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.15 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.15 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.15 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
