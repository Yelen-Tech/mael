id: cac-audit-rules-media-export
titre: Audit de l'appel systeme mount
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: 2
    anssi: renforce
source:
  origine: complianceascode
  regle: audit_rules_media_export
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_rules_media_export
mots_cles:
- appel
- audit
- auditctl
- auditd
- droits
- journalisation
- mount
- permissions
- proprietaire
- syscall
- systeme
- tracabilite
resume: L'appel systeme mount doit etre trace par auditd, en 32 et 64 bits (-a always,exit -F arch=b32/b64
  -S mount). (regle audit_rules_media_export, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -a always,exit -S mount (b32 et b64)
  bon: regles arch=b32 et arch=b64 pour mount
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: Copier des donnees sur un support externe peut provoquer une fuite d'informations (donnees personnelles,
    propriete intellectuelle). Tracer chaque montage de systeme de fichiers aide a detecter ces sorties
    de donnees.
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mael | -a always,exit
      -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mael
  evaluation:
  - lecteur: audit
    comparateur: appels
    champ: mount
    commande: 0
  - lecteur: audit
    comparateur: appels
    champ: mount
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
