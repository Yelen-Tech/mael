id: cac-package-timesyncd-installed
titre: Paquet systemd-timesyncd installe (si systemd-timesyncd est l'outil retenu)
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: paquet-present
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_timesyncd_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/package_timesyncd_installed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- systemd
- systemd-timesyncd
- timesyncd
resume: Le paquet systemd-timesyncd doit etre installe. (regle package_timesyncd_installed, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' systemd-timesyncd 2>/dev/null
  but: Savoir si systemd-timesyncd est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet systemd-timesyncd installe
  bon: installe
  mauvais: absent
  gravite: elevee
  risque: 'systemd-timesyncd synchronise l''horloge sur un serveur de temps : une heure exacte est indispensable
    a l''authentification et a la coherence des journaux entre machines.'
  action: Installer systemd-timesyncd avec le gestionnaire de paquets.
  playbook: infra.paquet-installer
  parametres:
    paquet: systemd-timesyncd
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si systemd-timesyncd est l''outil retenu (var_timesync_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.3.1.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
