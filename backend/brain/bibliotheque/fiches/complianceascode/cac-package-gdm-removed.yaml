id: cac-package-gdm-removed
titre: Paquet gdm / gdm3 absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: package_gdm_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/gnome/package_gdm_removed
mots_cles:
- gdm
- gdm3
- installe
- logiciel
- paquet
- paquets
resume: Le paquet gdm / gdm3 doit etre absent. (regle package_gdm_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' gdm gdm3 2>/dev/null
  but: Savoir si gdm gdm3 est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet gdm gdm3 absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: Ne pas installer les paquets de services inutiles diminue la surface d'attaque du systeme. Un
    environnement graphique est inutile pour certains types de systemes, dont un hyperviseur de virtualisation.
  action: Desinstaller gdm gdm3 (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: gdm gdm3
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - gdm
    - gdm3
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.7.1 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.7.1 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.7.1 (niveau 2)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
