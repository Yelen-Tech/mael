id: cac-kernel-module-cramfs-disabled
titre: Module noyau cramfs desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_cramfs_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_cramfs_disabled
mots_cles:
- cramfs
- module
- modules
- noyau
resume: Le module noyau cramfs ne doit pas pouvoir etre charge. (regle kernel_module_cramfs_disabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs 'cramfs' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si cramfs est interdit de chargement
  lecture: 'Attendu : « install cramfs /bin/false » (ou /bin/true) et « blacklist cramfs ».'
- commande: lsmod | grep -w 'cramfs'
  but: Voir si cramfs est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module cramfs non chargeable
  bon: install cramfs /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: faible
  risque: Chaque systeme de fichiers pris en charge est du code du noyau qu'un support piege (cle USB,
    image disque) peut atteindre. Retirer ceux dont on n'a pas besoin reduit la surface d'attaque locale.
  action: Ajouter « install cramfs /bin/false » et « blacklist cramfs » dans /etc/modprobe.d/cramfs.conf,
    puis decharger le module.
  playbook: infra.module-interdit
  parametres:
    module: cramfs
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: cramfs
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
pieges:
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
