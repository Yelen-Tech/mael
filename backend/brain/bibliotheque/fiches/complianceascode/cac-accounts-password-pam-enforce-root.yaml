resume: /etc/security/pwquality.conf doit contenir la ligne « enforce_for_root ». (regle accounts_password_pam_enforce_root,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*enforce_for_root' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Chercher « enforce_for_root » dans /etc/security/pwquality.conf
  lecture: Une ligne = present ; aucune = absent.
controles:
- controle: « enforce_for_root » present
  bon: ligne presente
  mauvais: ligne absente
  gravite: moyenne
  risque: 'Sans enforce_for_root, root peut choisir un mot de passe qui ne respecte pas la politique de
    complexite : le compte le plus puissant du systeme aurait alors le mot de passe le plus faible.'
  action: Ajouter « enforce_for_root » dans /etc/security/pwquality.conf.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: enforce_for_root
    valeur: ''
    format: cle_seule
