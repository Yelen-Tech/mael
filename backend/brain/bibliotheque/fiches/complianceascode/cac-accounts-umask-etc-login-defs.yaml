observer:
- commande: grep -Es '^[[:space:]]*UMASK[[:space:]]' /etc/login.defs
  but: Lire UMASK dans /etc/login.defs
  lecture: Valeur de UMASK ; aucune ligne = non defini.
controles:
- controle: UMASK au moins aussi strict que 027
  bon: UMASK 027
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Le umask determine les droits appliques aux fichiers a leur creation. Un umask mal configure
    peut donner a des fichiers des droits excessifs, lisibles et inscriptibles par des utilisateurs non
    autorises.
  action: Ecrire « UMASK 027 » dans /etc/login.defs.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/login.defs
    cle: UMASK
    valeur: '027'
    format: espace
  evaluation:
