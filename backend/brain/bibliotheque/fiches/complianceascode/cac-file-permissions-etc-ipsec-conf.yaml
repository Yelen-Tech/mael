id: cac-file-permissions-etc-ipsec-conf
titre: Droits de /etc/ipsec.conf (0644 au plus)
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: droits-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_permissions_etc_ipsec_conf
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ipsec/file_permissions_etc_ipsec_conf
mots_cles:
- chmod
- conf
- droits
- fichier
- fichiers
- ipsec
- permissions
resume: 'Droits de /etc/ipsec.conf : 0644 ou plus strict (aucun droit en plus). (regle file_permissions_etc_ipsec_conf,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s libreswan >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; stat -c '%a %U %G %n' /etc/ipsec.conf
    2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0644. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0644
  bon: 0644 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/ipsec.conf definit les tunnels IPsec : qui peut le modifier peut desactiver le chiffrement
    ou detourner les connexions. Seul root doit pouvoir y ecrire.'
  action: chmod 0644 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/ipsec.conf
    mode: '0644'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0644'
pieges:
- 'Regle limitee par la source a : package[libreswan]. Hors de ce cas, la commande repond « sans objet
  » (aucun ecart).'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
