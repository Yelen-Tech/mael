id: cac-package-avahi-removed
titre: Paquet avahi / avahi-daemon absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_avahi_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/avahi/disable_avahi_group/package_avahi_removed
mots_cles:
- avahi
- avahi-daemon
- daemon
- installe
- logiciel
- paquet
- paquets
resume: Le paquet avahi / avahi-daemon doit etre absent. (regle package_avahi_removed, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' avahi avahi-daemon 2>/dev/null
  but: Savoir si avahi avahi-daemon est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet avahi avahi-daemon absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: La decouverte automatique des services reseau n'est normalement pas requise pour le fonctionnement
    du systeme. Retirer ce paquet est recommande pour reduire la surface d'attaque potentielle.
  action: Desinstaller avahi avahi-daemon (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: avahi avahi-daemon
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - avahi
    - avahi-daemon
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.2 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
