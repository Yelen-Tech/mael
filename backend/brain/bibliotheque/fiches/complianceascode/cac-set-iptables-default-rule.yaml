resume: 'iptables : politique DROP sur INPUT. (regle set_iptables_default_rule, ComplianceAsCode 0.1.82).'
observer:
- commande: iptables -L INPUT -n | head -1
  but: Lire la politique de la chaine INPUT
  lecture: 'Attendu : « Chain INPUT (policy DROP) ».'
controles:
- controle: policy DROP
  bon: Chain INPUT (policy DROP)
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Dans iptables, la politique par defaut n''est appliquee qu''apres examen de toutes les regles
    de la table. La mettre a DROP est la bonne conception d''un pare-feu : tout paquet non explicitement
    permis ne doit pas etre accepte.'
  action: iptables -P INPUT DROP (apres les regles d'autorisation), puis sauvegarder (netfilter-persistent
    save).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si iptables est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
