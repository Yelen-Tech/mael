resume: Historiques bash (.bash_history) en 0600 au plus. (regle file_permission_user_bash_history, ComplianceAsCode
  0.1.82).
observer:
- commande: find /home -type f -name '.bash_history' -perm /0177 2>/dev/null
  but: Chercher les .bash_history trop ouverts
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: .bash_history en 0600 au plus
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Des droits incorrects permettent a des utilisateurs malveillants de retrouver l'historique de
    commandes des autres utilisateurs.
  action: chmod 0600 /home/COMPTE/.bash_history
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
