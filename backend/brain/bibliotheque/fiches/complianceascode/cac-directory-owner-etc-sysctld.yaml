id: cac-directory-owner-etc-sysctld
titre: 'Proprietaire de /etc/sysctl.d/ : root'
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: parametres-noyau
  type_controle: proprietaire-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: directory_owner_etc_sysctld
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_within_important_dirs/directory_owner_etc_sysctld
mots_cles:
- chown
- fichier
- fichiers
- proprietaire
- sysctl
resume: 'Proprietaire de /etc/sysctl.d/ : root : proprietaire root. (regle directory_owner_etc_sysctld,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/sysctl.d/ 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/sysctl.d contient les reglages du noyau appliques a chaque demarrage. Qui peut y ecrire
    peut desactiver les protections du noyau (ASLR, filtrage reseau...) : le repertoire doit appartenir
    a root et n''etre modifiable que par lui.'
  action: chown root sur les fichiers concernes.
  playbook: infra.fichier-proprietaire
  parametres:
    chemin: /etc/sysctl.d/
    proprietaire: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
