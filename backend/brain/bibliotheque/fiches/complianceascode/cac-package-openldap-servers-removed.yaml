id: cac-package-openldap-servers-removed
titre: Paquet openldap-servers / slapd absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_openldap-servers_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ldap/openldap_server/package_openldap-servers_removed
mots_cles:
- installe
- logiciel
- openldap
- openldap-servers
- paquet
- paquets
- servers
- slapd
resume: Le paquet openldap-servers / slapd doit etre absent. (regle package_openldap-servers_removed,
  ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' openldap-servers slapd 2>/dev/null
  but: Savoir si openldap-servers slapd est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet openldap-servers slapd absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: Ne pas installer les paquets inutiles diminue la surface d'attaque du systeme. Indispensable
    sur un serveur LDAP, ce logiciel n'est pas necessaire sur un poste de bureau ou une station de travail
    typique.
  action: Desinstaller openldap-servers slapd (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: openldap-servers slapd
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - openldap-servers
    - slapd
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
