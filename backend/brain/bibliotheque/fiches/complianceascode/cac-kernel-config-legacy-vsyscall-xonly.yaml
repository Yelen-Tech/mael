observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_LEGACY_VSYSCALL_XONLY( is not set|=)' /boot/config-$(uname
    -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_LEGACY_VSYSCALL_XONLY is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_LEGACY_VSYSCALL_XONLY = n
  bon: '# CONFIG_LEGACY_VSYSCALL_XONLY is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: moyenne
  risque: 'Meme en execution seule, la zone vsyscall reste a une adresse fixe : la desactiver retire un
    point d''appui pour contourner l''ASLR.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_LEGACY_VSYSCALL_XONLY
    attendu: n
