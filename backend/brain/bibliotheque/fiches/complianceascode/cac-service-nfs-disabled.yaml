id: cac-service-nfs-disabled
titre: Service nfs-server desactive et arrete
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_nfs_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/nfs_and_rpc/nfs_configuring_clients/disabling_nfsd/service_nfs_disabled
mots_cles:
- demarrage
- nfs-server
- server
- service
- services
- systemd
resume: Le service nfs-server doit etre desactive et arrete. (regle service_nfs_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled nfs-server.service 2>/dev/null; systemctl is-active nfs-server.service
    2>/dev/null
  but: Lire l'etat de demarrage et d'execution de nfs-server
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service nfs-server disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: moyenne
  risque: Desactiver les services inutiles diminue la surface d'attaque du systeme.
  action: systemctl disable --now nfs-server.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: nfs-server
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.9 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.9 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.9 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
