id: cac-service-nftables-disabled
titre: Service nftables desactive et arrete (si nftables n'est pas l'outil retenu)
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_nftables_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-nftables/service_nftables_disabled
mots_cles:
- demarrage
- nftables
- service
- services
- systemd
resume: Le service nftables doit etre desactive et arrete. (regle service_nftables_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled nftables.service 2>/dev/null; systemctl is-active nftables.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de nftables
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service nftables disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: moyenne
  risque: 'Si un autre pare-feu est retenu (ufw, iptables), le service nftables doit etre desactive :
    deux jeux de regles actifs se contredisent.'
  action: systemctl disable --now nftables.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: nftables
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si nftables n''est pas l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 4.3.1.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 4.4.1.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 4.4.1.2 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
