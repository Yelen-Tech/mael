id: cac-permissions-local-var-log
titre: Droits de tous les fichiers de /var/log/ (0640 au plus)
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: permissions_local_var_log
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_local_var_log
mots_cles:
- chmod
- droits
- fichier
- fichiers
- permissions
- tous
resume: 'Droits de tous les fichiers de /var/log/ : 0640 ou plus strict (aucun droit en plus). (regle
  permissions_local_var_log, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -type f -regextype posix-extended -regex '.*' ! -name 'history.log*' ! -name
    'eipp.log.xz*' ! -name '[bw]tmp' ! -name '[bw]tmp.*' ! -name '[bw]tmp-*' ! -name 'lastlog' ! -name
    'lastlog.*' ! -name 'cloud-init.log*' ! -name 'localmessages*' ! -name 'waagent.log*' -printf '%m
    %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0640. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0640
  bon: 0640 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les journaux contiennent des informations exploitables (erreurs detaillees, identifiants tapes
    par erreur, adresses, noms de comptes) : ils ne doivent etre lisibles que par root et le groupe d''administration,
    jamais par tous.'
  action: chmod 0640 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*
    nature: droits
    valeur: '0640'
    recursif: oui
    exclure: history.log*,eipp.log.xz*,[bw]tmp,[bw]tmp.*,[bw]tmp-*,lastlog,lastlog.*,cloud-init.log*,localmessages*,waagent.log*
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0640'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
- 'Exclus par la source (exigence propre, voir leur fiche) : history.log*, eipp.log.xz*, [bw]tmp, [bw]tmp.*,
  [bw]tmp-*, lastlog, lastlog.*, cloud-init.log*, localmessages*, waagent.log*.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
