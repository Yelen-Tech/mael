id: cac-kernel-config-security-dmesg-restrict
titre: Option de compilation du noyau CONFIG_SECURITY_DMESG_RESTRICT = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_security_dmesg_restrict
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_security_dmesg_restrict
mots_cles:
- compilation
- config_security_dmesg_restrict
- dmesg
- kernel
- noyau
- restrict
- security
resume: Le noyau doit etre compile avec CONFIG_SECURITY_DMESG_RESTRICT=y. (regle kernel_config_security_dmesg_restrict,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_SECURITY_DMESG_RESTRICT( is not set|=)' /boot/config-$(uname
    -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_SECURITY_DMESG_RESTRICT=y ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_SECURITY_DMESG_RESTRICT = y
  bon: CONFIG_SECURITY_DMESG_RESTRICT=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: Empeche les utilisateurs non privilegies de lire les messages du noyau (dmesg), qui revelent
    des adresses du noyau utiles a une exploitation.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_SECURITY_DMESG_RESTRICT
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R15 (niveau eleve)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
