id: cac-audit-rules-time-settimeofday
titre: Audit des changements d'heure par settimeofday
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: audit_rules_time_settimeofday
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_time_rules/audit_rules_time_settimeofday
mots_cles:
- audit
- auditctl
- auditd
- heure
- horloge
- journalisation
- settimeofday
- temps
- tracabilite
resume: Audit des changements d'heure par settimeofday. (regle audit_rules_time_settimeofday, ComplianceAsCode
  0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -a always,exit -S settimeofday
  bon: toutes les regles chargees et persistantes
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: Changer l'heure du systeme permet de brouiller la chronologie des journaux pour masquer une
    activite malveillante, et perturbe les services qui dependent d'une heure exacte. Tout changement
    d'heure doit etre trace.
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -a always,exit -F arch=b32 -S settimeofday -k mael | -a always,exit -F arch=b64 -S settimeofday
      -k mael
  evaluation:
  - lecteur: audit
    comparateur: appels
    champ: settimeofday
    commande: 0
  - lecteur: audit
    comparateur: appels
    champ: settimeofday
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
