id: cac-package-net-snmp-removed
titre: Paquet net-snmp / snmp / snmpd absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_net-snmp_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/snmp/disabling_snmp_service/package_net-snmp_removed
mots_cles:
- installe
- logiciel
- net-snmp
- paquet
- paquets
- snmp
- snmpd
resume: Le paquet net-snmp / snmp / snmpd doit etre absent. (regle package_net-snmp_removed, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' net-snmp snmp snmpd 2>/dev/null
  but: Savoir si net-snmp snmp snmpd est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet net-snmp snmp snmpd absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: S'il n'est pas necessaire d'executer un logiciel de serveur SNMP, retirer le paquet constitue
    une protection contre son activation.
  action: Desinstaller net-snmp snmp snmpd (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: net-snmp snmp snmpd
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - net-snmp
    - snmp
    - snmpd
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.15 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.15 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.15 (niveau 1)
