- paquet
- paquets
- plugins
- setroubleshoot
- setroubleshoot-plugins
resume: Le paquet setroubleshoot-plugins doit etre absent. (regle package_setroubleshoot-plugins_removed,
  ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' setroubleshoot-plugins 2>/dev/null
  but: Savoir si setroubleshoot-plugins est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
  variantes:
    rhel: rpm -q setroubleshoot-plugins
controles:
- controle: paquet setroubleshoot-plugins absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: 'setroubleshoot est un service d''aide au diagnostic SELinux, inutile sur un serveur : c''est
    du code en plus, donc une surface d''attaque en plus.'
  action: Desinstaller setroubleshoot-plugins (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: setroubleshoot-plugins
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - setroubleshoot-plugins
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
