id: cac-package-setroubleshoot-plugins-removed
titre: Paquet setroubleshoot-plugins absent
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: controle-acces
  type_controle: paquet-absent
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: package_setroubleshoot-plugins_removed
  version: 0.1.82
