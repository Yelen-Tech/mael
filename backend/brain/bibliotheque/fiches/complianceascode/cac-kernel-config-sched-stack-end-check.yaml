  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_SCHED_STACK_END_CHECK=y ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_SCHED_STACK_END_CHECK = y
  bon: CONFIG_SCHED_STACK_END_CHECK=y
  mauvais: 'autre valeur (option absente : indetermine)'
