resume: Le noyau doit demarrer avec page_poison=1. (regle grub2_page_poison_argument, ComplianceAsCode
  0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : page_poison=1.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: page_poison=1 doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument page_poison=1
  bon: page_poison=1 dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: moyenne
  risque: Remplir la memoire liberee d'un motif connu detecte et bloque les utilisations apres liberation
    (use-after-free), pour un faible cout en performance.
  action: Ajouter page_poison=1 a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer la configuration
    (update-grub) et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: page_poison=1
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: page_poison
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: grub
    champ: page_poison
    comparateur: egal
    attendu: '1'
pieges:
