- repertoire personnel
- repertoires personnels
- utilisateurs
resume: Chaque utilisateur interactif a un repertoire personnel existant. (regle accounts_user_interactive_home_directory_exists,
  ComplianceAsCode 0.1.82).
observer:
- commande: 'awk -F: ''($3 >= 1000 && $7 !~ /(nologin|false)$/) {print $6}'' /etc/passwd | xargs -r ls
    -d 2>&1 >/dev/null'
  but: Lister les repertoires personnels manquants
  lecture: Chaque ligne « ls ... No such file or directory » = repertoire manquant ; aucune = conforme.
controles:
- controle: repertoires personnels presents
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Si le repertoire personnel declare d'un utilisateur interactif n'existe pas, l'utilisateur peut
    se retrouver avec / comme repertoire courant a la connexion. Cela peut causer un deni de service (impossibilite
    d'acceder aux fichiers de configuration) et lui donner la vision de fichiers systeme normalement inaccessibles.
  action: mkdir /home/COMPTE, puis chown COMPTE:GROUPE et chmod 0750.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
