id: cac-accounts-user-interactive-home-directory-exists
titre: Chaque utilisateur interactif a un repertoire personnel existant
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
