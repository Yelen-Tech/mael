id: cac-accounts-password-pam-minclass
titre: 'Mots de passe : nombre de classes de caracteres exigees (minclass au moins 4)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_password_pam_minclass
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_minclass
mots_cles:
- caracteres
- classes
- complexite
- exigees
- minclass
- mot de passe
- mots de passe
- nombre
- pam
- politique
- pwquality
resume: pwquality doit imposer minclass au moins 4 (nombre de classes de caracteres exigees). (regle accounts_password_pam_minclass,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*minclass[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de minclass configuree pour pwquality
  lecture: « minclass = N » ; aucune ligne = valeur par defaut du module (0).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: minclass au moins 4
  bon: minclass au moins 4, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: Un mot de passe complexe resiste plus longtemps aux attaques par devinette et par force brute.
    Exiger plusieurs categories de caracteres (minuscules, majuscules, chiffres, speciaux) agrandit l'espace
    des combinaisons a tester.
  action: Ecrire « minclass = 4 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: minclass
    valeur: '4'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: au_moins
    champ: minclass
    attendu: '4'
    defaut: '0'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.2.3 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.2.3 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.2.3 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R68 (niveau minimal)
verifie_le: '2026-09-18'
relu_par: Yelen Tech
