resume: 'GNOME : verrouillage au plus 5 s apres la mise en veille (lock-delay). (regle dconf_gnome_screensaver_lock_delay,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s gdm3 >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -EsR '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?lock-delay[[:space:]]*='
    /etc/dconf/db/
  but: Lire lock-delay dans /etc/dconf/db/
  lecture: Valeur de lock-delay ; aucune ligne = non defini.
controles:
- controle: lock-delay entre 0 et 5
  bon: lock-delay=uint32 5
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: 'Le verrouillage doit suivre la mise en veille presque immediatement (5 s au plus) : sinon,
    n''importe qui peut reprendre la session pendant ce delai.'
  action: Ecrire lock-delay=uint32 5 (section [org/gnome/desktop/screensaver]), puis dconf update.
  playbook: null
  sans_playbook: 'fichier a sections ou repertoire (dconf, sssd) : correction manuelle'
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: entre
    champ: lock-delay
    attendu:
    - 0
    - '5'
