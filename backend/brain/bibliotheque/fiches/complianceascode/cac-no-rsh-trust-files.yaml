id: cac-no-rsh-trust-files
titre: Aucun fichier de confiance rsh (/etc/hosts.equiv, .rhosts)
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: no_rsh_trust_files
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/r_services/no_rsh_trust_files
mots_cles:
- confiance
- hosts.equiv
- rhosts
- rsh
resume: Aucun fichier de confiance rsh (/etc/hosts.equiv, .rhosts). (regle no_rsh_trust_files, ComplianceAsCode
  0.1.82).
observer:
- commande: ls /etc/hosts.equiv 2>/dev/null; find /home /root -maxdepth 2 -name .rhosts 2>/dev/null
  but: Chercher hosts.equiv et les .rhosts
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun fichier de confiance rsh
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: '/etc/hosts.equiv et les fichiers .rhosts declarent des machines et des comptes de confiance
    : combines aux services R (rsh, rlogin), ils ouvrent une session sans aucune authentification.'
  action: Supprimer /etc/hosts.equiv et les fichiers .rhosts.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
