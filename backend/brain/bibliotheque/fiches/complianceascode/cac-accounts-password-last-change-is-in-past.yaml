observer:
- commande: 'awk -F: ''BEGIN{srand(); t=int(srand()/86400)} $3 > t {print $1" "$3}'' /etc/shadow || echo
    ''SENTINELLE:ILLISIBLE'''
  but: Lister les comptes dont le dernier changement est dans le futur
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: date de dernier changement dans le passe pour tous
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Une date de dernier changement dans le futur fausse le calcul de l''expiration : le mot de
    passe echappe a la duree de vie maximale.'
  action: Corriger la date (chage -d AAAA-MM-JJ COMPTE) et verifier l'horloge du systeme.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
