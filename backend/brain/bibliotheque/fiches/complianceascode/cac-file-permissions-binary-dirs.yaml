observer:
- commande: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin -perm /022
    -printf '%m %p\n' 2>/dev/null
  but: Chercher les executables modifiables par le groupe ou les autres
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: pas d'ecriture pour le groupe ni les autres
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Les executables systeme sont executes par des utilisateurs privilegies et des services systeme
    : des droits restrictifs sont necessaires pour que leur execution ne puisse pas etre detournee.'
  action: chmod go-w FICHIER
