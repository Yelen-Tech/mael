id: cac-file-groupowner-backup-etc-gshadow
titre: 'Groupe de /etc/gshadow- : shadow'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_backup_etc_gshadow
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_important_account_files/file_groupowner_backup_etc_gshadow
mots_cles:
- chgrp
- comptes
- fichier
- fichiers
- groupe
- groupes
- gshadow
- mots de passe
resume: 'Groupe de /etc/gshadow- : shadow : groupe shadow. (regle file_groupowner_backup_etc_gshadow,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/gshadow- 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu shadow. Aucune ligne = fichier absent.'
controles:
- controle: groupe = shadow
  bon: groupe shadow
  mauvais: toute autre valeur
  gravite: moyenne
  risque: /etc/gshadow (et sa copie /etc/gshadow-) contient les empreintes des mots de passe de groupe
    et la liste de leurs administrateurs. Lisible par un autre compte, il permet de les casser hors ligne
    ; modifiable, il permet d'entrer dans n'importe quel groupe.
  action: chgrp shadow sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/gshadow-
    groupe: shadow
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - shadow
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 7.1.8 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 7.1.8 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 7.1.8 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
