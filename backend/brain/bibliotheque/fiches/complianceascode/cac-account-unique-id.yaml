id: cac-account-unique-id
titre: Chaque compte a un UID unique
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: account_unique_id
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/account_unique_id
mots_cles:
- comptes
- doublon
- passwd
- uid
- unique
resume: Chaque compte a un UID unique. (regle account_unique_id, ComplianceAsCode 0.1.82).
observer:
- commande: 'awk -F: ''list[$3]++ {print $1, $3}'' /etc/passwd'
  but: Lister les UID en double
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun UID en double
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Deux comptes qui partagent un UID sont un seul et meme utilisateur pour le systeme : ils ont
    les memes droits sur les memes fichiers, et les journaux ne permettent plus de savoir lequel a agi.'
  action: Renumeroter (usermod -u) ou supprimer les comptes en double.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
