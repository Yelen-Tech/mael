id: cac-file-permissions-systemmap
titre: Droits des fichiers motif ^.*System\.map.*$ de /boot/ (0600 au plus)
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: droits-fichier
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: file_permissions_systemmap
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/file_permissions_systemmap
mots_cles:
- boot
- chmod
- droits
- fichier
- fichiers
- motif
- permissions
- system
resume: 'Droits des fichiers motif ^.*System\.map.*$ de /boot/ : 0600 ou plus strict (aucun droit en plus).
  (regle file_permissions_systemmap, ComplianceAsCode 0.1.82).'
observer:
- commande: find /boot/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*System\.map.*$' -printf
    '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0600. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0600
  bon: 0600 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: faible
  risque: Les fichiers System.map servent surtout au debogage et au profilage du noyau. Un acces non limite
    peut reveler des informations utiles aux attaquants et aux logiciels malveillants, menant a des exploitations
    plus elaborees.
  action: chmod 0600 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /boot/
    regex: ^.*System\.map.*$
    nature: droits
    valeur: '0600'
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0600'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R29 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
