id: cac-kernel-config-debug-credentials
titre: Option de compilation du noyau CONFIG_DEBUG_CREDENTIALS = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_debug_credentials
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_debug_credentials
mots_cles:
- compilation
- config_debug_credentials
- credentials
- debug
- kernel
- noyau
resume: Le noyau doit etre compile avec CONFIG_DEBUG_CREDENTIALS=y. (regle kernel_config_debug_credentials,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_DEBUG_CREDENTIALS( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_DEBUG_CREDENTIALS=y ». La ligne « # Linux/... » donne l''architecture ;
    option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_DEBUG_CREDENTIALS = y
  bon: CONFIG_DEBUG_CREDENTIALS=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: faible
  risque: Ajoute des verifications de coherence sur les structures d'identite des processus (credentials),
    cible classique d'une elevation de privileges.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_DEBUG_CREDENTIALS
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
