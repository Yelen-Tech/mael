id: cac-root-path-all-dirs
titre: 'PATH : chaque entree est un repertoire existant'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: sessions
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: root_path_all_dirs
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-session/root_paths/root_path_all_dirs
mots_cles:
- path
- repertoires
- root
resume: 'PATH : chaque entree est un repertoire existant. (regle root_path_all_dirs, ComplianceAsCode
  0.1.82).'
observer:
- commande: echo "$PATH" | tr ':' '\n' | xargs -r stat -L -c '%F %n' 2>&1 | grep -v '^directory '
  but: Verifier que chaque entree du PATH est un repertoire
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: toutes les entrees sont des repertoires
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Des entrees du PATH de root qui ne sont pas des repertoires provoquent des comportements inattendus,
    comme l'execution de scripts depuis des emplacements non prevus. Toutes les entrees du PATH de root
    doivent etre des repertoires pour lui garantir un environnement sur.
  action: Retirer du PATH les entrees inexistantes ou qui ne sont pas des repertoires.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'C''est le PATH du shell d''audit : lancer l''audit en tant que root (sudo -i) pour lire celui de root.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
