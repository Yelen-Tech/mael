id: cac-package-telnet-removed
titre: Paquet telnet absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: package_telnet_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/telnet/package_telnet_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- telnet
resume: Le paquet telnet doit etre absent. (regle package_telnet_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' telnet 2>/dev/null
  but: Savoir si telnet est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet telnet absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: 'Le protocole telnet n''est pas chiffre : identifiants et session circulent en clair et peuvent
    etre interceptes. SSH fournit une session chiffree et une authentification plus sure.'
  action: Desinstaller telnet (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: telnet
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - telnet
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.2.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.2.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.2.4 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R62 (niveau minimal)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
