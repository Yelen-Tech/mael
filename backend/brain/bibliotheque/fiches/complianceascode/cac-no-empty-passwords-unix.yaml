id: cac-no-empty-passwords-unix
titre: 'PAM : pas de connexion avec un mot de passe vide (nullok absent)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: no_empty_passwords_unix
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/password_storage/no_empty_passwords_unix
mots_cles:
- mot de passe vide
- mots de passe vides
- nullok
- pam_unix
resume: 'PAM : pas de connexion avec un mot de passe vide (nullok absent). (regle no_empty_passwords_unix,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -Es '^[^#]*pam_unix\.so.*\bnullok\b' /etc/pam.d/common-password /etc/pam.d/common-auth
    /etc/pam.d/common-account /etc/pam.d/common-session /etc/pam.d/common-session-noninteractive
  but: Chercher l'option nullok sur pam_unix
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: nullok absent
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: Avec l'option nullok, un compte au mot de passe vide permet a n'importe qui de se connecter
    et d'agir avec les droits de ce compte.
  action: Retirer nullok des lignes pam_unix.so de /etc/pam.d/common-* (pam-auth-update).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
