    AppArmor) : lui preferer Postfix.'
  action: Desinstaller sendmail (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: sendmail
  evaluation:
