id: cac-service-cron-enabled
titre: Service cron active et demarre
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: planification
  type_controle: service-actif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_cron_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/cron_and_at/service_cron_enabled
mots_cles:
- cron
- demarrage
- planification
- service
- services
- systemd
- taches
resume: Le service cron doit etre active et demarre. (regle service_cron_enabled, ComplianceAsCode 0.1.82).
observer:
- commande: systemctl is-enabled cron.service 2>/dev/null; systemctl is-active cron.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de cron
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service cron enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: moyenne
  risque: 'cron execute des taches de maintenance et de securite (rotation des journaux, controles d''integrite,
    mises a jour) : arrete, elles ne se font plus.'
  action: systemctl enable --now cron.service
  playbook: infra.service-activer
  parametres:
    service: cron
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: actif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.4.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.4.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.4.1.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
