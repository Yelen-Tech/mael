resume: Seul le groupe root a le GID 0. (regle groups_no_zero_gid_except_root, ComplianceAsCode 0.1.82).
observer:
- commande: 'awk -F: ''$3 == 0 && $1 != "root" {print $1}'' /etc/group'
  but: Lister les groupes autres que root avec le GID 0
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun autre groupe en GID 0
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: Les fichiers du groupe root (GID 0) sont souvent lisibles par ce groupe. Un autre groupe d'GID
    0 donne a ses membres ces memes acces sans que cela se voie.
  action: Supprimer ou renumeroter les groupes listes (groupmod -g).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
