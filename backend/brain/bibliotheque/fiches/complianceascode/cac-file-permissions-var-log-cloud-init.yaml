id: cac-file-permissions-var-log-cloud-init
titre: Droits des fichiers motif .*cloud-init.log([^\/]+)?$ de /var/log/ (0644 au plus)
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_permissions_var_log_cloud-init
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_permissions_var_log_cloud-init
mots_cles:
- chmod
- cloud
- droits
- fichier
- fichiers
- init
- motif
- permissions
resume: 'Droits des fichiers motif .*cloud-init.log([^\/]+)?$ de /var/log/ : 0644 ou plus strict (aucun
  droit en plus). (regle file_permissions_var_log_cloud-init, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -maxdepth 1 -type f -regextype posix-extended -regex '.*cloud-init.log([^\/]+)?$'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0644. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0644
  bon: 0644 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les journaux de cloud-init detaillent l''initialisation de la machine (reseau, comptes, scripts
    de demarrage fournis par le nuage) : des informations utiles a un attaquant, a reserver au personnel
    autorise.'
  action: chmod 0644 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*cloud-init.log([^\/]+)?$
    nature: droits
    valeur: '0644'
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0644'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
