observer:
- commande: dpkg -s aide >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; systemctl is-enabled dailyaidecheck.timer
    aidecheck.timer 2>/dev/null | grep -x enabled
  but: Verifier le minuteur de controle AIDE
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: minuteur AIDE active
  bon: une ligne « enabled »
  mauvais: aucun minuteur
  gravite: moyenne
  risque: 'AIDE ne se lance pas seul : sans execution reguliere, une modification non autorisee des fichiers
    systeme n''est jamais signalee.'
  action: systemctl enable --now dailyaidecheck.timer
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
