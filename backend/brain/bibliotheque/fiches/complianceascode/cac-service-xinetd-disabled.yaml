id: cac-service-xinetd-disabled
titre: Service xinetd desactive et arrete
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_xinetd_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/inetd_and_xinetd/service_xinetd_disabled
mots_cles:
- demarrage
- service
- services
- systemd
- xinetd
resume: Le service xinetd doit etre desactive et arrete. (regle service_xinetd_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled xinetd.service 2>/dev/null; systemctl is-active xinetd.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de xinetd
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service xinetd disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: moyenne
  risque: xinetd fournit un service d'ecoute dedie pour certains programmes, qui n'est plus necessaire
    pour les services reseau courants. Le desactiver garantit que ces services peu courants ne tournent
    pas et empeche aussi les attaques contre xinetd lui-meme.
  action: systemctl disable --now xinetd.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: xinetd
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.19 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.19 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.19 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
