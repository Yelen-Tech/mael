id: cac-file-permissions-backup-etc-shadow
titre: Droits de /etc/shadow- (0640 au plus)
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_permissions_backup_etc_shadow
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_important_account_files/file_permissions_backup_etc_shadow
mots_cles:
- chmod
- comptes
- droits
- fichier
- fichiers
- mots de passe
- permissions
- shadow
resume: 'Droits de /etc/shadow- : 0640 ou plus strict (aucun droit en plus). (regle file_permissions_backup_etc_shadow,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/shadow- 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0640. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0640
  bon: 0640 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: /etc/shadow (et sa copie /etc/shadow-) contient les empreintes des mots de passe. Lisible par
    un autre compte, il permet de les casser hors ligne ; modifiable, il permet de changer le mot de passe
    de root. Il doit appartenir a root, au groupe shadow, en 0640 au plus.
  action: chmod 0640 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/shadow-
    mode: '0640'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0640'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 7.1.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 7.1.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 7.1.6 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
