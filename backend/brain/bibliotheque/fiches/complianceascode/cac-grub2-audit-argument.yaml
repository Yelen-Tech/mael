id: cac-grub2-audit-argument
titre: Argument de demarrage audit=1
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: argument-demarrage
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: grub2_audit_argument
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/grub2_audit_argument
mots_cles:
- argument
- audit
- demarrage
- grub
- journalisation
- noyau
resume: Le noyau doit demarrer avec audit=1. (regle grub2_audit_argument, ComplianceAsCode 0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : audit=1.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: audit=1 doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument audit=1
  bon: audit=1 dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: faible
  risque: 'Sans l''argument audit=1, les processus lances avant auditd au demarrage ne sont pas auditables
    : une activite malveillante precoce echapperait a la trace.'
  action: Ajouter audit=1 a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer la configuration (update-grub)
    et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: audit=1
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: audit
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: grub
    champ: audit
    comparateur: egal
    attendu: '1'
pieges:
- 'Le changement ne prend effet qu''apres redemarrage : planifier la fenetre de maintenance.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.3.1.3 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.2.1.3 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.2.1.3 (niveau 2)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
