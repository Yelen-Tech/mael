  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun champ mot de passe vide
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: 'Un compte au mot de passe vide s''ouvre sans rien taper : n''importe qui peut s''y connecter
    et agir avec ses droits.'
  action: Donner un mot de passe (passwd COMPTE) ou verrouiller le compte (passwd -l COMPTE).
