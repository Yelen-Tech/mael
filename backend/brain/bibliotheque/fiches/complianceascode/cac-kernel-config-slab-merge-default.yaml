resume: Le noyau doit etre compile avec CONFIG_SLAB_MERGE_DEFAULT=n. (regle kernel_config_slab_merge_default,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_SLAB_MERGE_DEFAULT( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_SLAB_MERGE_DEFAULT is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_SLAB_MERGE_DEFAULT = n
  bon: '# CONFIG_SLAB_MERGE_DEFAULT is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: moyenne
  risque: 'Ne pas fusionner les caches d''allocation de tailles voisines isole les objets : un debordement
    dans un cache sans valeur ne peut plus ecraser les objets sensibles d''un autre.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_SLAB_MERGE_DEFAULT
    attendu: n
pieges:
