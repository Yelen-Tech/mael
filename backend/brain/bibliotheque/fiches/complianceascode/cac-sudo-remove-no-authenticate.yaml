- sudoers
resume: 'sudo : pas d''option !authenticate (reauthentification obligatoire). (regle sudo_remove_no_authenticate,
  ComplianceAsCode 0.1.82).'
observer:
- commande: head -c0 /etc/sudoers || echo 'SENTINELLE:ILLISIBLE'; grep -rs '^[^#]*!authenticate' /etc/sudoers
    /etc/sudoers.d/
  but: Chercher !authenticate dans la configuration de sudo
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucune ligne !authenticate
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Sans nouvelle authentification (NOPASSWD, !authenticate, delai trop long), quiconque prend le
    controle d'une session ouverte devient root sans connaitre le mot de passe.
  action: Retirer !authenticate avec visudo.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
