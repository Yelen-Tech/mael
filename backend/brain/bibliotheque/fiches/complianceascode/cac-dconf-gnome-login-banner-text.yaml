id: cac-dconf-gnome-login-banner-text
titre: 'GNOME : texte de la banniere de connexion defini'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: sessions
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: dconf_gnome_login_banner_text
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-banners/gui_login_banner/dconf_gnome_login_banner_text
