- banniere
- connexion
- gnome
- texte
resume: 'GNOME : texte de la banniere de connexion defini. (regle dconf_gnome_login_banner_text, ComplianceAsCode
  0.1.82).'
observer:
- commande: dpkg -s gdm3 >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -Rhs "^[[:space:]]*banner-message-text[[:space:]]*=[[:space:]]*'..*'"
    /etc/dconf/db/ /etc/gdm3/greeter.dconf-defaults
  but: Lire le texte de la banniere de connexion
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: banner-message-text renseigne
  bon: une ligne
  mauvais: texte absent
  gravite: moyenne
  risque: Un message d'avertissement a la connexion rappelle la politique d'usage et facilite d'eventuelles
    poursuites contre un intrus.
  action: Ecrire banner-message-text='TEXTE APPROUVE' dans /etc/gdm3/greeter.dconf-defaults, puis dconf
    update.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
