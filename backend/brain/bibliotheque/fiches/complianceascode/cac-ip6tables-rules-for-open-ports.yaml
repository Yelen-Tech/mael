id: cac-ip6tables-rules-for-open-ports
titre: 'ip6tables : une regle pour chaque port ouvert (IPv6) (si iptables est l''outil retenu)'
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
