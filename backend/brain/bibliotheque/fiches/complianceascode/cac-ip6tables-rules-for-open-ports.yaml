- ports
resume: 'ip6tables : une regle pour chaque port ouvert (IPv6). (regle ip6tables_rules_for_open_ports,
  ComplianceAsCode 0.1.82).'
observer:
- commande: ss -6tuln
  but: Lister les ports IPv6 ouverts, a comparer a ip6tables -L INPUT -v -n
  lecture: 'Liste des ports en ecoute (IPv6) : chacun doit avoir une regle dans ip6tables -L INPUT -v
    -n.'
controles:
- controle: regle pour chaque port ouvert
  bon: tous les ports couverts
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Chaque port en ecoute doit etre explicitement autorise ou refuse par le pare-feu. Un port sans
    regle depend de la seule politique par defaut : un service peut etre bloque par erreur, ou expose
    sans qu''on l''ait decide.'
  action: ip6tables -A INPUT -p PROTO --dport PORT -j ACCEPT (ou DROP) pour chaque port non couvert.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si iptables est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
