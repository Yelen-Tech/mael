id: cac-package-iptables-persistent-installed
titre: Paquet iptables-persistent installe (si iptables est l'outil retenu)
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: paquet-present
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_iptables-persistent_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-iptables/package_iptables-persistent_installed
mots_cles:
- installe
- iptables
- iptables-persistent
- logiciel
- paquet
- paquets
- persistent
resume: Le paquet iptables-persistent doit etre installe. (regle package_iptables-persistent_installed,
  ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' iptables-persistent 2>/dev/null
  but: Savoir si iptables-persistent est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet iptables-persistent installe
  bon: installe
  mauvais: absent
  gravite: moyenne
  risque: 'Sans iptables-persistent, les regles iptables ne sont pas rechargees au demarrage : la machine
    redemarre sans pare-feu.'
  action: Installer iptables-persistent avec le gestionnaire de paquets.
  playbook: infra.paquet-installer
  parametres:
    paquet: iptables-persistent
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si iptables est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 4.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 4.4.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 4.4.1.1 (niveau 1)
