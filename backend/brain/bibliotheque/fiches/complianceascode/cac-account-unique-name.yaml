- comptes
- doublon
- nom
- passwd
- unique
resume: Chaque compte a un nom unique. (regle account_unique_name, ComplianceAsCode 0.1.82).
observer:
- commande: 'cut -d: -f1 /etc/passwd | sort | uniq -d'
  but: Lister les noms de compte en double
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun nom en double
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Un nom de compte en double rend les journaux et les droits ambigus : on ne peut plus imputer
    une action a une personne.'
  action: Renommer ou supprimer les comptes en double.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
