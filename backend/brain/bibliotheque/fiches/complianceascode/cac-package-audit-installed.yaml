id: cac-package-audit-installed
titre: Paquet auditd installe
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: paquet-present
  niveaux:
    cis: 2
    anssi: intermediaire
source:
  origine: complianceascode
  regle: package_audit_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/package_audit_installed
mots_cles:
- audit
- auditd
- installe
- journalisation
- logiciel
- paquet
- paquets
resume: Le paquet auditd doit etre installe. (regle package_audit_installed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' auditd 2>/dev/null
  but: Savoir si auditd est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet auditd installe
  bon: installe
  mauvais: absent
  gravite: moyenne
  risque: 'Sans auditd actif, les evenements de securite generes par le noyau ne sont pas enregistres
    : impossible de reconstituer un incident ni d''imputer une action a un utilisateur.'
  action: Installer auditd avec le gestionnaire de paquets.
  playbook: infra.paquet-installer
  parametres:
    paquet: auditd
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: installe
    attendu:
    - auditd
pieges: []
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.3.1.1 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.2.1.1 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.2.1.1 (niveau 2)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R33 (niveau intermediaire)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R73 (niveau renforce)
