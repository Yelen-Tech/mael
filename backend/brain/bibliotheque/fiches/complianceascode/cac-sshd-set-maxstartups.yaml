id: cac-sshd-set-maxstartups
titre: 'SSH : limitation des connexions non authentifiees simultanees (MaxStartups 10:30:60)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_set_maxstartups
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_set_maxstartups
mots_cles:
- connexions
- deni de service
- limite
- maxstartups
- saturation
- simultanees
- ssh
- sshd
- startups
resume: La directive sshd MaxStartups doit valoir « 10:30:60 » (regle sshd_set_maxstartups, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^maxstartups '
  but: Lire la valeur EFFECTIVE de MaxStartups
  lecture: 'Attendu : « maxstartups debut:taux:plein » avec debut <= 10, taux >= 30 et plein <= 60.'
- commande: grep -Ris '^[[:space:]]*MaxStartups[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou MaxStartups est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: MaxStartups 10:30:60 ou plus strict
  bon: debut <= 10, taux >= 30, plein <= 60
  mauvais: limites plus permissives, ou absent avec un defaut plus permissif
  gravite: moyenne
  risque: Limiter les connexions en attente d'authentification protege le service SSH contre la saturation
    (deni de service).
  action: Definir « MaxStartups 10:30:60 » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: MaxStartups
    valeur: 10:30:60
  evaluation:
  - comparateur: maxstartups
    attendu: 10:30:60
    commande: 0
    lecteur: sshd_t
    champ: maxstartups
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- 'Regle Sentinelle : la source exige exactement 10:30:60 ; une configuration plus stricte est acceptee.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.18 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.18 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.18 (niveau 1)
verifie_le: '2026-09-17'
relu_par: assistant IA (Claude), par delegation du responsable du projet
