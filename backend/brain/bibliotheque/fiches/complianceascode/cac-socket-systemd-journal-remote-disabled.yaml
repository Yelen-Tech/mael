id: cac-socket-systemd-journal-remote-disabled
titre: Socket systemd-journal-remote.socket desactive
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: socket_systemd-journal-remote_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/journald/socket_systemd-journal-remote_disabled
mots_cles:
- journal
- remote
- socket
- systemd
- systemd-journal-remote
resume: L'unite systemd systemd-journal-remote.socket doit etre desactivee. (regle socket_systemd-journal-remote_disabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: systemctl is-enabled systemd-journal-remote.socket 2>/dev/null; systemctl is-active systemd-journal-remote.socket
    2>/dev/null
  but: Lire l'etat de systemd-journal-remote.socket
  lecture: 'Attendu : « disabled » ou « masked » puis « inactive ».'
controles:
- controle: systemd-journal-remote.socket disabled/inactive
  bon: disabled ou masked, inactive
  mauvais: enabled ou active
  gravite: moyenne
  risque: 'systemd-journal-remote fait de la machine un serveur qui recoit les journaux d''autres machines
    : hors du serveur central, c''est un service reseau expose sans raison.'
  action: systemctl disable --now systemd-journal-remote.socket (ou mask)
  playbook: infra.service-desactiver
  parametres:
    service: systemd-journal-remote.socket
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
