id: cac-package-talk-removed
titre: Paquet talk absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: package_talk_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/talk/package_talk_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- talk
resume: Le paquet talk doit etre absent. (regle package_talk_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' talk 2>/dev/null
  but: Savoir si talk est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet talk absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: Le logiciel talk presente un risque de securite car ses protocoles de communication ne sont
    pas chiffres. Retirer le paquet talk diminue le risque d'activation accidentelle ou intentionnelle
    du programme client talk.
  action: Desinstaller talk (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: talk
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - talk
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.2.3 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.2.3 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.2.3 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R62 (niveau minimal)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
