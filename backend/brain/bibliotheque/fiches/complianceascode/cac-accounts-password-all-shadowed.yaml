resume: Aucune empreinte de mot de passe dans /etc/passwd (toutes dans /etc/shadow). (regle accounts_password_all_shadowed,
  ComplianceAsCode 0.1.82).
observer:
- commande: 'awk -F: ''($2 != "x" && $2 != "*") {print $1}'' /etc/passwd'
  but: Chercher des empreintes de mot de passe dans /etc/passwd
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: 2e champ de /etc/passwd = x pour tous les comptes
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: '/etc/passwd est lisible par tous les utilisateurs : une empreinte de mot de passe qui s''y
    trouve peut etre copiee et cassee hors ligne. Les empreintes doivent rester dans /etc/shadow, reserve
    a root.'
  action: Reinitialiser le mot de passe du compte (pwconv) ou supprimer le compte ; enqueter sur la cause.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
