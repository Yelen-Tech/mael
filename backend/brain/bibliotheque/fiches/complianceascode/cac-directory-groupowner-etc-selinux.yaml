id: cac-directory-groupowner-etc-selinux
titre: 'Groupe de /etc/selinux/ : root'
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: controle-acces
  type_controle: groupe-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: directory_groupowner_etc_selinux
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/selinux/directory_groupowner_etc_selinux
mots_cles:
- chgrp
- fichier
- fichiers
- groupe
- selinux
resume: 'Groupe de /etc/selinux/ : root : groupe root. (regle directory_groupowner_etc_selinux, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/selinux/ 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/selinux et /etc/sestatus.conf portent la politique SELinux : qui peut les modifier peut
    la desactiver ou l''affaiblir. Ils doivent appartenir a root et n''etre modifiables que par lui (sur
    Debian/Ubuntu, sans objet si SELinux n''est pas installe).'
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/selinux/
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
