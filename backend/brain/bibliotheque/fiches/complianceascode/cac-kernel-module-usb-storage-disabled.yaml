id: cac-kernel-module-usb-storage-disabled
titre: Module noyau usb-storage desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_usb-storage_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_usb-storage_disabled
mots_cles:
- cle usb
- module
- modules
- noyau
- peripherique
- storage
- usb
- usb-storage
resume: Le module noyau usb-storage ne doit pas pouvoir etre charge. (regle kernel_module_usb-storage_disabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs 'usb-storage' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si usb-storage est interdit de chargement
  lecture: 'Attendu : « install usb-storage /bin/false » (ou /bin/true) et « blacklist usb-storage ».'
- commande: lsmod | grep -w 'usb-storage'
  but: Voir si usb-storage est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module usb-storage non chargeable
  bon: install usb-storage /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: moyenne
  risque: 'Une cle USB peut introduire un logiciel malveillant ou servir a exfiltrer des donnees : sur
    un serveur, le stockage USB n''a en general pas lieu d''etre.'
  action: Ajouter « install usb-storage /bin/false » et « blacklist usb-storage » dans /etc/modprobe.d/usb-storage.conf,
    puis decharger le module.
  playbook: infra.module-interdit
  parametres:
    module: usb-storage
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: usb-storage
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
pieges:
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
