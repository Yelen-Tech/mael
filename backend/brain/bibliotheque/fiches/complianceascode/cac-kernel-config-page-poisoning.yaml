resume: Le noyau doit etre compile avec CONFIG_PAGE_POISONING=y. (regle kernel_config_page_poisoning,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_PAGE_POISONING( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_PAGE_POISONING=y ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_PAGE_POISONING = y
  bon: CONFIG_PAGE_POISONING=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
