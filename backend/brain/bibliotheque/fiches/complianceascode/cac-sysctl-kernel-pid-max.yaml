id: cac-sysctl-kernel-pid-max
titre: Parametre noyau kernel.pid_max = 65536
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: parametres-noyau
  type_controle: parametre-noyau
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: sysctl_kernel_pid_max
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/restrictions/sysctl_kernel_pid_max
mots_cles:
- kernel
- kernel.pid_max
- noyau
- parametre
- sysctl
resume: Le parametre noyau kernel.pid_max doit valoir 65536, en memoire et de facon persistante. (regle
  sysctl_kernel_pid_max, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.pid_max
  but: Lire la valeur ACTIVE de kernel.pid_max
  lecture: 'Attendu : 65536.'
- commande: grep -Rs '^[[:space:]]*kernel\.pid_max[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/ /run/sysctl.d/
    /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.pid_max = 65536 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.pid_max = 65536
  bon: 65536 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Fixe le nombre maximal d''identifiants de processus, comme le recommande l''ANSSI. Trop bas,
    il bloque la creation de processus sur une machine tres chargee : a ajuster selon l''usage.'
  action: Ecrire « kernel.pid_max = 65536 » dans /etc/sysctl.conf (lu en dernier) puis appliquer avec
    sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: kernel.pid_max
    valeur: '65536'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '65536'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.pid_max
    attendu: '65536'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R9 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
