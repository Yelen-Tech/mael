id: cac-sshd-disable-empty-passwords
titre: 'SSH : mots de passe vides interdits (PermitEmptyPasswords no)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_disable_empty_passwords
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_disable_empty_passwords
mots_cles:
- connexion
- empty
- mot de passe
- passwords
- permit
- permitemptypasswords
- ssh
- sshd
- vide
- vides
resume: La directive sshd PermitEmptyPasswords doit valoir « no » (regle sshd_disable_empty_passwords,
  ComplianceAsCode 0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^permitemptypasswords '
  but: Lire la valeur EFFECTIVE de PermitEmptyPasswords
  lecture: 'Attendu : « permitemptypasswords no ». Toute autre valeur est un ecart.'
- commande: grep -Ris '^[[:space:]]*PermitEmptyPasswords[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou PermitEmptyPasswords est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: PermitEmptyPasswords = no
  bon: PermitEmptyPasswords no
  mauvais: toute autre valeur
  gravite: elevee
  risque: Garantit qu'une connexion SSH exige un mot de passe, meme si un compte a ete mal configure ailleurs
    (mot de passe vide).
  action: Definir « PermitEmptyPasswords no » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: PermitEmptyPasswords
    valeur: 'no'
  evaluation:
  - comparateur: egal
    attendu: 'no'
    commande: 0
    lecteur: sshd_t
    champ: permitemptypasswords
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- '« PermitEmptyPasswords no » est la valeur par defaut : son absence du fichier est conforme.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.19 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.19 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.19 (niveau 1)
verifie_le: '2026-09-17'
relu_par: Yelen Tech
