id: cac-file-groupowner-backup-etc-group
titre: 'Groupe de /etc/group- : root'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_backup_etc_group
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_important_account_files/file_groupowner_backup_etc_group
mots_cles:
- chgrp
- fichier
- fichiers
- group
- groupe
- groupes
resume: 'Groupe de /etc/group- : root : groupe root. (regle file_groupowner_backup_etc_group, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/group- 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/group (et sa copie /etc/group-) definit l''appartenance aux groupes. Qui peut le modifier
    peut s''ajouter a un groupe privilegie (sudo, adm, shadow) : il doit appartenir a root et n''etre
    modifiable que par lui.'
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/group-
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 7.1.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 7.1.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 7.1.4 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
