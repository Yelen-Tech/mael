id: cac-partition-for-srv
titre: Partition separee pour /srv
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: montage
  type_controle: partition-separee
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: partition_for_srv
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/disk_partitioning/partition_for_srv
mots_cles:
- disque
- montage
- partition
- separee
resume: /srv doit etre une partition (ou un montage) separe. (regle partition_for_srv, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /srv
  but: Voir si /srv est un montage separe
  lecture: Une ligne = montage separe ; aucune = meme partition que son parent.
controles:
- controle: /srv monte a part
  bon: montage separe
  mauvais: /srv sur la partition de son parent
  gravite: moyenne
  risque: Une partition dediee permet d'y appliquer des options de montage restrictives (nosuid, lecture
    seule...) et d'en limiter la taille.
  action: 'Prevoir une partition (ou un volume LVM) dedie a /srv et la declarer dans /etc/fstab : se planifie,
    surtout sur un systeme en production.'
  playbook: null
  sans_playbook: 'partition dediee : repartitionnement a planifier, non automatisable'
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: monte
pieges:
- 'Repartitionner un systeme en service est risque : a planifier (ou a appliquer aux prochaines installations).'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R28 (niveau intermediaire)
