- repertoires
- sticky
- world-writable
resume: 'Repertoires modifiables par tous : bit sticky present. (regle dir_perms_world_writable_sticky_bits,
  ComplianceAsCode 0.1.82).'
observer:
- commande: find / -xdev -type d \( -perm -0002 -a ! -perm -1000 \) -print 2>/dev/null
  but: Chercher les repertoires ouverts a tous sans bit sticky
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: bit sticky sur tout repertoire modifiable par tous
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Sans bit sticky, un repertoire modifiable par tous (comme /tmp) laisse n'importe quel utilisateur
    supprimer ou remplacer les fichiers des autres. Seuls les repertoires temporaires prevus pour cela
    doivent etre modifiables par tous, et toujours avec le bit sticky.
  action: chmod +t REPERTOIRE (ou retirer l'ecriture pour tous).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
