id: cac-dir-perms-world-writable-sticky-bits
titre: 'Repertoires modifiables par tous : bit sticky present'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
