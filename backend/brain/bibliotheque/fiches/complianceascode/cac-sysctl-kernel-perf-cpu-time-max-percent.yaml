resume: Le parametre noyau kernel.perf_cpu_time_max_percent doit valoir 1, en memoire et de facon persistante.
  (regle sysctl_kernel_perf_cpu_time_max_percent, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.perf_cpu_time_max_percent
  but: Lire la valeur ACTIVE de kernel.perf_cpu_time_max_percent
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*kernel\.perf_cpu_time_max_percent[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.perf_cpu_time_max_percent = 1 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.perf_cpu_time_max_percent = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Limiter le temps processeur et la frequence d'echantillonnage de l'outil de mesure perf evite
    qu'il soit detourne pour degrader la disponibilite de la machine.
  action: Ecrire « kernel.perf_cpu_time_max_percent = 1 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: kernel.perf_cpu_time_max_percent
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.perf_cpu_time_max_percent
    attendu: '1'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
