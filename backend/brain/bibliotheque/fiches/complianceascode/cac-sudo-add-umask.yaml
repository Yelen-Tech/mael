  mauvais: option absente ou desactivee
  gravite: moyenne
  risque: 'Les fichiers crees par une commande lancee via sudo heritent du umask : un umask permissif
    peut laisser des fichiers de root lisibles ou modifiables par d''autres.'
  action: Ajouter « Defaults umask=0077 » avec visudo -f /etc/sudoers.d/sentinelle (jamais d'edition directe).
