id: cac-kernel-config-slub-debug
titre: Option de compilation du noyau CONFIG_SLUB_DEBUG = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_slub_debug
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_slub_debug
mots_cles:
- compilation
- config_slub_debug
- debug
- kernel
- noyau
- slub
resume: Le noyau doit etre compile avec CONFIG_SLUB_DEBUG=y. (regle kernel_config_slub_debug, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_SLUB_DEBUG( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_SLUB_DEBUG=y ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_SLUB_DEBUG = y
  bon: CONFIG_SLUB_DEBUG=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: Permet de verifier les structures de l'allocateur memoire du noyau et de remettre a zero la
    memoire liberee.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_SLUB_DEBUG
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
