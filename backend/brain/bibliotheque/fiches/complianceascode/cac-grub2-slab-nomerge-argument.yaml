resume: Le noyau doit demarrer avec slab_nomerge=yes. (regle grub2_slab_nomerge_argument, ComplianceAsCode
  0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : slab_nomerge=yes.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: slab_nomerge=yes doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument slab_nomerge=yes
  bon: slab_nomerge=yes dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: moyenne
  risque: 'Ne pas fusionner les caches memoire de tailles voisines isole les objets : un debordement dans
    un cache sans valeur ne peut plus ecraser les objets sensibles d''un autre.'
  action: Ajouter slab_nomerge=yes a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer la configuration
    (update-grub) et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: slab_nomerge=yes
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: slab_nomerge
    comparateur: egal
    attendu: 'yes'
  - commande: 1
    lecteur: grub
    champ: slab_nomerge
    comparateur: egal
    attendu: 'yes'
pieges:
- 'Le changement ne prend effet qu''apres redemarrage : planifier la fenetre de maintenance.'
