id: cac-sysctl-fs-protected-symlinks
titre: Parametre noyau fs.protected_symlinks = 1
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: parametres-noyau
  type_controle: parametre-noyau
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: sysctl_fs_protected_symlinks
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/sysctl_fs_protected_symlinks
mots_cles:
- fs.protected_symlinks
- noyau
- parametre
- protected
- symlinks
- sysctl
resume: Le parametre noyau fs.protected_symlinks doit valoir 1, en memoire et de facon persistante. (regle
  sysctl_fs_protected_symlinks, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n fs.protected_symlinks
  but: Lire la valeur ACTIVE de fs.protected_symlinks
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*fs\.protected_symlinks[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « fs.protected_symlinks = 1 » ; aucune ligne = non persistant.'
controles:
- controle: fs.protected_symlinks = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Dans un repertoire partage (comme /tmp), un lien symbolique n''est suivi que si son proprietaire
    est celui qui le suit ou celui du repertoire : un programme privilegie ne peut plus etre detourne
    vers un fichier sensible.'
  action: Ecrire « fs.protected_symlinks = 1 » dans /etc/sysctl.conf (lu en dernier) puis appliquer avec
    sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: fs.protected_symlinks
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: fs.protected_symlinks
    attendu: '1'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R14 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
