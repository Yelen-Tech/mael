id: cac-package-systemd-journal-remote-installed
titre: Paquet systemd-journal-remote installe
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: paquet-present
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_systemd-journal-remote_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/journald/package_systemd-journal-remote_installed
mots_cles:
- installe
- journal
- logiciel
- paquet
- paquets
- remote
- systemd
- systemd-journal-remote
resume: Le paquet systemd-journal-remote doit etre installe. (regle package_systemd-journal-remote_installed,
  ComplianceAsCode 0.1.82).
observer:
- commande: systemctl is-enabled -q rsyslog 2>/dev/null && echo 'SENTINELLE:SANS_OBJET'; dpkg-query -W
    -f='${binary:Package} ${Status}\n' systemd-journal-remote 2>/dev/null
  but: Savoir si systemd-journal-remote est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet systemd-journal-remote installe
  bon: installe
  mauvais: absent
  gravite: moyenne
  risque: Des journaux gardes uniquement sur la machine peuvent etre effaces par un attaquant devenu root.
    Les envoyer a un serveur distant (systemd-journal-upload) preserve les traces meme si la machine est
    compromise, et permet de correler les evenements de plusieurs machines.
  action: Installer systemd-journal-remote avec le gestionnaire de paquets.
  playbook: infra.paquet-installer
  parametres:
    paquet: systemd-journal-remote
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: installe
    attendu:
    - systemd-journal-remote
pieges:
- 'Regle limitee par la source a : service_disabled[rsyslog]. Hors de ce cas, la commande repond « sans
  objet » (aucun ecart).'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.1.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.2.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.2.1.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
