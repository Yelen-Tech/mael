id: cac-file-groupowner-etc-issue
titre: 'Groupe de /etc/issue : root'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: fichiers-systeme
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_etc_issue
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-banners/file_groupowner_etc_issue
mots_cles:
- chgrp
- fichier
- fichiers
- groupe
- issue
resume: 'Groupe de /etc/issue : root : groupe root. (regle file_groupowner_etc_issue, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/issue 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Les bannieres (/etc/issue, /etc/issue.net, /etc/motd) affichent l'avertissement legal avant
    ou apres la connexion. Si un autre compte peut les modifier, il peut retirer l'avertissement ou afficher
    un message trompeur (fausse consigne, hameconnage).
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/issue
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.6.5 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.6.5 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.6.5 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
