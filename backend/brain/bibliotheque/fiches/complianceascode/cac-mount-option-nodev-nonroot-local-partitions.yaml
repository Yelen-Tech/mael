observer:
- commande: mount | grep '^/dev\S* on /\S' | grep --invert-match 'nodev'
  but: Lister les partitions locales hors racine montees sans nodev
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: nodev sur toutes les partitions locales hors racine
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Les fichiers de peripherique n''ont leur place que dans /dev : l''option nodev empeche d''en
    creer ailleurs (dans /tmp, /home...) pour contourner les droits d''acces au materiel ou a la memoire.'
  action: Ajouter nodev aux options de ces partitions dans /etc/fstab, puis remonter.
