resume: Les repertoires modifiables par tous appartiennent a root. (regle dir_perms_world_writable_root_owned,
  ComplianceAsCode 0.1.82).
observer:
- commande: find / -xdev -type d -perm -0002 -uid +0 -print 2>/dev/null
  but: Chercher les repertoires ouverts a tous qui n'appartiennent pas a root
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: proprietaire root
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Laisser un compte utilisateur posseder un repertoire modifiable par tous est indesirable :
    le proprietaire peut alors supprimer ou remplacer les fichiers que d''autres utilisateurs y deposent.'
  action: chown root REPERTOIRE (apres enquete).
