resume: postfix n'ecoute que localement (inet_interfaces = loopback-only). (regle postfix_network_listening_disabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: dpkg -s postfix >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -Es '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?inet_interfaces[[:space:]]*='
    /etc/postfix/main.cf
  but: Lire inet_interfaces dans /etc/postfix/main.cf
  lecture: Valeur de inet_interfaces ; aucune ligne = non defini.
controles:
- controle: inet_interfaces = loopback-only
  bon: inet_interfaces = loopback-only
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Un postfix limite a la boucle locale accepte les messages de la machine (rapports cron...) sans
    s'exposer aux attaques venues du reseau.
  action: Ecrire « inet_interfaces = loopback-only » dans /etc/postfix/main.cf, puis redemarrer postfix.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/postfix/main.cf
    cle: inet_interfaces
    valeur: loopback-only
    format: egal_espaces
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: toutes_egales
    champ: inet_interfaces
    attendu: loopback-only
