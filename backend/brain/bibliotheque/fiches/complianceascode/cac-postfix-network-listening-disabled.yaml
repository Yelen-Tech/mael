id: cac-postfix-network-listening-disabled
titre: postfix n'ecoute que localement (inet_interfaces = loopback-only)
domaine: dns
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
