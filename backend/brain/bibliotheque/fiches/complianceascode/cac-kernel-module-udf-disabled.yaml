id: cac-kernel-module-udf-disabled
titre: Module noyau udf desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_udf_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_udf_disabled
mots_cles:
- module
- modules
- noyau
- udf
resume: Le module noyau udf ne doit pas pouvoir etre charge. (regle kernel_module_udf_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Rs 'udf' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si udf est interdit de chargement
  lecture: 'Attendu : « install udf /bin/false » (ou /bin/true) et « blacklist udf ».'
- commande: lsmod | grep -w 'udf'
  but: Voir si udf est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module udf non chargeable
  bon: install udf /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: faible
  risque: Chaque systeme de fichiers pris en charge est du code du noyau qu'un support piege (cle USB,
    image disque) peut atteindre. Retirer ceux dont on n'a pas besoin reduit la surface d'attaque locale.
  action: Ajouter « install udf /bin/false » et « blacklist udf » dans /etc/modprobe.d/udf.conf, puis
    decharger le module.
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: udf
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
  sans_playbook: 'udf est necessaire au provisionnement de Microsoft Azure : a decider selon l''hebergement'
pieges:
- 'Microsoft Azure a besoin d''udf pour provisionner ses machines virtuelles : ne pas le desactiver sur
  Azure.'
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
