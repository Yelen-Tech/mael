resume: Le parametre noyau net.ipv4.tcp_rfc1337 doit valoir 1, en memoire et de facon persistante. (regle
  sysctl_net_ipv4_tcp_rfc1337, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.tcp_rfc1337
  but: Lire la valeur ACTIVE de net.ipv4.tcp_rfc1337
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.tcp_rfc1337[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.tcp_rfc1337 = 1 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.tcp_rfc1337 = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Protege les connexions en attente de fermeture (TIME_WAIT) contre les paquets RST forges (RFC
    1337) : sans cela, un attaquant peut fermer prematurement des connexions ou en melanger les donnees.'
  action: Ecrire « net.ipv4.tcp_rfc1337 = 1 » dans /etc/sysctl.conf (lu en dernier) puis appliquer avec
    sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.tcp_rfc1337
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv4.tcp_rfc1337
    attendu: '1'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
