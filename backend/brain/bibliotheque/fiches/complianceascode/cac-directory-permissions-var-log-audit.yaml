id: cac-directory-permissions-var-log-audit
titre: Droits de /var/log/audit (0750 au plus)
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: droits-fichier
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: directory_permissions_var_log_audit
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/directory_permissions_var_log_audit
mots_cles:
- audit
- chmod
- droits
- fichier
- fichiers
- journalisation
- permissions
resume: 'Droits de /var/log/audit : 0750 ou plus strict (aucun droit en plus). (regle directory_permissions_var_log_audit,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /var/log/audit 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0750. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0750
  bon: 0750 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Si des utilisateurs peuvent ecrire dans les journaux d'audit, les traces peuvent etre modifiees
    ou detruites.
  action: chmod 0750 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /var/log/audit
    mode: '0750'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0750'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
