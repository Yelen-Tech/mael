id: cac-package-dhcp-removed
titre: Paquet dhcp / isc-dhcp-server absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: package_dhcp_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/dhcp/disabling_dhcp_server/package_dhcp_removed
mots_cles:
- dhcp
- installe
- isc-dhcp-server
- logiciel
- paquet
- paquets
- server
resume: Le paquet dhcp / isc-dhcp-server doit etre absent. (regle package_dhcp_removed, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' dhcp isc-dhcp-server 2>/dev/null
  but: Savoir si dhcp isc-dhcp-server est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet dhcp isc-dhcp-server absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: Retirer le serveur DHCP garantit qu'il ne peut pas etre reactive facilement ou par accident
    et perturber le fonctionnement du reseau.
  action: Desinstaller dhcp isc-dhcp-server (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: dhcp isc-dhcp-server
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - dhcp
    - isc-dhcp-server
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
