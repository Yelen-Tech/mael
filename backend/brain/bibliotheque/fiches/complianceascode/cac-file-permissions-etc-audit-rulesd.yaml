id: cac-file-permissions-etc-audit-rulesd
titre: Droits des fichiers *rules de /etc/audit/rules.d/ (0600 au plus)
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: droits-fichier
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: file_permissions_etc_audit_rulesd
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/file_permissions_auditd/file_permissions_etc_audit_rulesd
mots_cles:
- audit
- chmod
- droits
- fichier
- fichiers
- journalisation
- permissions
- rules
resume: 'Droits des fichiers *rules de /etc/audit/rules.d/ : 0600 ou plus strict (aucun droit en plus).
  (regle file_permissions_etc_audit_rulesd, ComplianceAsCode 0.1.82).'
observer:
- commande: find /etc/audit/rules.d/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*rules$'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0600. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0600
  bon: 0600 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Si des personnes non autorisees peuvent modifier la configuration de l'audit, elles peuvent
    desactiver la trace d'evenements critiques ou noyer les journaux pour degrader le systeme et gener
    les enquetes.
  action: chmod 0600 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /etc/audit/rules.d/
    regex: ^.*rules$
    nature: droits
    valeur: '0600'
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0600'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.3.4.5 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.2.4.5 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.2.4.5 (niveau 2)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
