id: cac-sshd-limit-user-access
titre: 'SSH : acces limite a des utilisateurs ou groupes (AllowUsers, AllowGroups...)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: ssh
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_limit_user_access
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_limit_user_access
mots_cles:
- acces ssh
- allowgroups
- allowusers
- restriction
- ssh
resume: 'SSH : acces limite a des utilisateurs ou groupes (AllowUsers, AllowGroups...). (regle sshd_limit_user_access,
  ComplianceAsCode 0.1.82).'
observer:
- commande: sshd -T 2>/dev/null | awk 'NR==1{ok=1} /^(allowusers|allowgroups|denyusers|denygroups) /{print}
    END{if(!ok) print "SENTINELLE:ILLISIBLE"}'
  but: Lire les restrictions d'acces de sshd
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: au moins une directive Allow/Deny Users/Groups
  bon: une ligne allowusers/allowgroups/denyusers/denygroups
  mauvais: tout compte peut se connecter
  gravite: moyenne
  risque: 'Designer explicitement les comptes ou groupes autorises a se connecter en SSH reduit le risque
    d''acces non autorise : un compte de service ou un compte oublie ne peut pas servir de porte d''entree.'
  action: Ajouter « AllowGroups ssh-autorises » (ou AllowUsers) dans /etc/ssh/sshd_config.d/, garder une
    session ouverte, recharger.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
