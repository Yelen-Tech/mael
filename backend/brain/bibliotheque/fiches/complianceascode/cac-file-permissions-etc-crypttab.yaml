id: cac-file-permissions-etc-crypttab
titre: Droits de /etc/crypttab (0600 au plus)
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: droits-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_permissions_etc_crypttab
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/file_permissions_etc_crypttab
mots_cles:
- chmod
- crypttab
- droits
- fichier
- fichiers
- permissions
resume: 'Droits de /etc/crypttab : 0600 ou plus strict (aucun droit en plus). (regle file_permissions_etc_crypttab,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/crypttab 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0600. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0600
  bon: 0600 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/crypttab decrit les disques chiffres et l''emplacement de leurs cles : il doit rester
    reserve a root (0600 au plus).'
  action: chmod 0600 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/crypttab
    mode: '0600'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0600'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
