- limits
- memoire
resume: Core dumps interdits pour tous les utilisateurs (* hard core 0). (regle disable_users_coredumps,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rhs '^[[:space:]]*\*[[:space:]]+hard[[:space:]]+core[[:space:]]+0' /etc/security/limits.conf
    /etc/security/limits.d/
  but: Chercher la limite « * hard core 0 »
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: '* hard core 0 present'
  bon: une ligne
  mauvais: aucune limite
  gravite: moyenne
  risque: 'Un vidage memoire (core dump) est une image de la memoire d''un programme au moment de son
    arret : il peut contenir mots de passe, cles et donnees sensibles, et ne sert qu''au debogage.'
  action: Ajouter « * hard core 0 » dans /etc/security/limits.d/60-sentinelle.conf.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
