id: cac-disable-users-coredumps
titre: Core dumps interdits pour tous les utilisateurs (* hard core 0)
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: parametres-noyau
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: disable_users_coredumps
  version: 0.1.82
