id: cac-firewall-single-service-active
titre: Exactement un pare-feu actif (ufw, nftables ou iptables)
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: firewall_single_service_active
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/firewall_single_service_active
mots_cles:
- firewall
- iptables
- nftables
- pare-feu
- ufw
resume: Exactement un pare-feu actif (ufw, nftables ou iptables). (regle firewall_single_service_active,
  ComplianceAsCode 0.1.82).
observer:
- commande: '(ufw status 2>&1 | awk ''/need to be root/{print "SENTINELLE:ILLISIBLE"} /^Status: active/{print
    "ufw"}''; systemctl is-active nftables netfilter-persistent 2>/dev/null | awk ''$1=="active"{print
    "actif"}'') | awk ''/^SENTINELLE:/{print; next} {n++} END{if (n != 1) print n+0" pare-feu actif(s),
    attendu : 1"}'''
  but: Compter les pare-feu reellement actifs (ufw active, nftables, netfilter-persistent)
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: un seul service de pare-feu actif
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Deux pare-feu actifs en meme temps se contredisent : le filtrage devient imprevisible et des
    ports peuvent rester ouverts sans qu''on le voie. Aucun pare-feu actif laisse la machine exposee au
    reseau.'
  action: Garder un seul outil (ufw OU nftables OU iptables) et desactiver les autres (systemctl disable
    --now).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
