resume: 'Mots de passe : algorithme de hachage (ENCRYPT_METHOD SHA512|YESCRYPT). (regle set_password_hashing_algorithm_logindefs,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -Es '^[[:space:]]*ENCRYPT_METHOD[[:space:]]' /etc/login.defs
  but: Lire ENCRYPT_METHOD dans /etc/login.defs
  lecture: Valeur de ENCRYPT_METHOD ; aucune ligne = non defini.
controles:
- controle: ENCRYPT_METHOD SHA512|YESCRYPT
  bon: ENCRYPT_METHOD SHA512|YESCRYPT
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: 'Les mots de passe doivent etre stockes sous forme d''empreinte par un algorithme robuste :
    un algorithme faible ne protege guere mieux que le texte en clair si /etc/shadow fuite. yescrypt ou
    SHA-512 rendent le cassage beaucoup plus couteux.'
  action: Ecrire « ENCRYPT_METHOD YESCRYPT » dans /etc/login.defs (SHA512 est aussi admis). Ne vaut que
    pour les mots de passe changes ensuite.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/login.defs
    cle: ENCRYPT_METHOD
    valeur: YESCRYPT
    format: espace
  evaluation:
