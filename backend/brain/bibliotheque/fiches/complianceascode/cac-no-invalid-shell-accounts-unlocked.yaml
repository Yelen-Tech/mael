id: cac-no-invalid-shell-accounts-unlocked
titre: Les comptes sans shell valide sont verrouilles
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: no_invalid_shell_accounts_unlocked
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/root_logins/no_invalid_shell_accounts_unlocked
mots_cles:
- comptes
- nologin
- shadow
- shell
- verrouillage
resume: Les comptes sans shell valide sont verrouilles. (regle no_invalid_shell_accounts_unlocked, ComplianceAsCode
  0.1.82).
observer:
- commande: 'awk -F: ''FILENAME=="/etc/shells"{s[$1]=1; next} FILENAME=="/etc/passwd"{if (!($7 in s))
    c[$1]=1; next} ($1 in c) && $2 !~ /^[!*]/ {print $1}'' /etc/shells /etc/passwd /etc/shadow || echo
    ''SENTINELLE:ILLISIBLE'''
  but: Lister les comptes non interactifs non verrouilles
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: comptes hors /etc/shells verrouilles
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Les comptes non interactifs (services, comptes systeme) ne doivent jamais servir a se connecter.
    Les verrouiller empeche leur usage detourne meme si un mot de passe leur a ete attribue.
  action: usermod -L COMPTE pour chaque compte liste.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
