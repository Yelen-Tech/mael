mots_cles:
- historique
- mots de passe
- pam_unix
- remember
resume: 'PAM : pas d''option remember sur pam_unix (utiliser pam_pwhistory). (regle accounts_password_pam_unix_no_remember,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -rEs '^\s*password\s+.*pam_unix\.so.*\bremember=' /etc/pam.d/common-password /etc/pam.d/common-auth
    /etc/pam.d/common-account /etc/pam.d/common-session
  but: Chercher l'option remember sur pam_unix
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: remember absent de pam_unix
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: L'option remember de pam_unix conserve les anciens mots de passe dans /etc/security/opasswd
    avec une gestion moins robuste que pam_pwhistory. L'historique doit etre gere par pam_pwhistory, qui
    applique aussi la politique a root.
  action: Retirer remember= de pam_unix.so et regler l'historique avec pam_pwhistory (remember=N).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
