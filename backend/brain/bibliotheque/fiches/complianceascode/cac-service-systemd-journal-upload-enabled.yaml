id: cac-service-systemd-journal-upload-enabled
titre: Service systemd-journal-upload active et demarre
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: service-actif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_systemd-journal-upload_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/journald/service_systemd-journal-upload_enabled
mots_cles:
- demarrage
- journal
- service
- services
- systemd
- systemd-journal-upload
- upload
resume: Le service systemd-journal-upload doit etre active et demarre. (regle service_systemd-journal-upload_enabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: dpkg -s systemd-journal-remote >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; systemctl
    is-enabled systemd-journal-upload.service 2>/dev/null; systemctl is-active systemd-journal-upload.service
    2>/dev/null
  but: Lire l'etat de demarrage et d'execution de systemd-journal-upload
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service systemd-journal-upload enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: moyenne
  risque: Des journaux gardes uniquement sur la machine peuvent etre effaces par un attaquant devenu root.
    Les envoyer a un serveur distant (systemd-journal-upload) preserve les traces meme si la machine est
    compromise, et permet de correler les evenements de plusieurs machines.
  action: systemctl enable --now systemd-journal-upload.service
  playbook: infra.service-activer
  parametres:
    service: systemd-journal-upload
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: actif
pieges:
- 'Regle limitee par la source a : machine and package[systemd-journal-remote]. Hors de ce cas, la commande
  repond « sans objet » (aucun ecart).'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.1.2.3 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.2.1.3 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.2.1.3 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
