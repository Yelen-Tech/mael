id: cac-sshd-set-loglevel-info
titre: 'SSH : niveau de journalisation (LogLevel INFO)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_set_loglevel_info
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_set_loglevel_info
mots_cles:
- journalisation
- journaux
- level
- loglevel
- logs
- niveau
- ssh
- sshd
- traces
resume: La directive sshd LogLevel doit valoir « INFO » (regle sshd_set_loglevel_info, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^loglevel '
  but: Lire la valeur EFFECTIVE de LogLevel
  lecture: 'Attendu : « loglevel info » ou « loglevel verbose ».'
- commande: grep -Ris '^[[:space:]]*LogLevel[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou LogLevel est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: LogLevel dans {INFO, VERBOSE}
  bon: LogLevel INFO ou LogLevel VERBOSE
  mauvais: toute autre valeur
  gravite: faible
  risque: Un niveau INFO ou VERBOSE journalise les connexions et deconnexions, indispensable en reponse
    a incident ; DEBUG noie l'information utile.
  action: Definir « LogLevel INFO » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: LogLevel
    valeur: INFO
  evaluation:
  - comparateur: dans
    attendu:
    - INFO
    - VERBOSE
    commande: 0
    lecteur: sshd_t
    champ: loglevel
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- '« LogLevel INFO » est la valeur par defaut : son absence du fichier est conforme.'
- 'Regle Sentinelle : la source exige INFO ; INFO, VERBOSE sont acceptes.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.14 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.14 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.14 (niveau 1)
verifie_le: '2026-09-17'
relu_par: Yelen Tech
