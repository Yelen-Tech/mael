observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: nosmep ne doit pas figurer.
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: nosmep ne doit pas figurer.
controles:
- controle: nosmep absent
  bon: nosmep absent
  mauvais: nosmep present
  gravite: moyenne
  risque: 'SMEP empeche le noyau d''executer du code place en memoire utilisateur : le desactiver (nosmep)
    rend bien plus simple l''exploitation d''une faille du noyau.'
  action: Retirer nosmep de GRUB_CMDLINE_LINUX dans /etc/default/grub, update-grub, redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: nosmep
    action: retirer
  evaluation:
