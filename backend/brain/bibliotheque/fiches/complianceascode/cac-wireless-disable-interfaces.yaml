observer:
- commande: ls -L -d /sys/class/net/*/wireless 2>/dev/null | xargs -r dirname | xargs -r basename -a
  but: Lister les interfaces sans fil
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucune interface wifi
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Une interface sans fil ouvre des attaques impossibles sur un reseau filaire : faux point d''acces,
    association malveillante, pont vers le reseau interne. Sur un serveur, elle doit etre desactivee.'
  action: Desactiver les interfaces listees (nmcli radio all off) ou retirer le materiel.
