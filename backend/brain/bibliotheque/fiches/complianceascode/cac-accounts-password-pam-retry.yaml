id: cac-accounts-password-pam-retry
titre: 'PAM : pam_pwquality.so dans /etc/pam.d/common-password (retry<=3)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: null
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_password_pam_retry
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_retry
mots_cles:
- authentification
- common
- pam
- pam_pwquality
- password
- pwquality
- retry
resume: /etc/pam.d/common-password doit appeler pam_pwquality.so avec retry<=3. (regle accounts_password_pam_retry,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*password[[:space:]].*pam_pwquality\.so' /etc/pam.d/common-password
  but: Lire la ligne pam_pwquality.so de /etc/pam.d/common-password
  lecture: 'Attendu : « password pam_pwquality.so retry<=3 » ; aucune ligne = module absent.'
controles:
- controle: password pam_pwquality.so retry<=3
  bon: password pam_pwquality.so retry<=3
  mauvais: module absent, ou option absente / plus faible
  gravite: moyenne
  risque: Limiter le nombre de nouvelles saisies par session oblige certains logiciels (comme SSH) a se
    reconnecter, ce qui ralentit et rend plus visibles les attaques par devinette. Ce n'est pas le verrouillage
    de compte, assure par pam_faillock.
  action: Ajouter ou completer la ligne password ... pam_pwquality.so dans /etc/pam.d/common-password
    (sur Debian/Ubuntu, de preference via pam-auth-update) en gardant une session root ouverte.
  playbook: null
  sans_playbook: 'pile PAM : a modifier avec pam-auth-update et une session root ouverte (une erreur peut
    bloquer toute connexion)'
  evaluation:
  - commande: 0
    lecteur: pam
    comparateur: arguments
    champ: pam_pwquality.so
    attendu:
    - nom: retry
      operation: au_plus
      valeur: '3'
pieges:
- 'Une erreur dans /etc/pam.d peut bloquer toute connexion : garder une session root ouverte pendant la
  modification.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R68 (niveau minimal)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
