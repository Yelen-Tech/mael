resume: Le noyau doit etre compile avec CONFIG_STRICT_MODULE_RWX=y. (regle kernel_config_strict_module_rwx,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_STRICT_MODULE_RWX( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_STRICT_MODULE_RWX=y ». La ligne « # Linux/... » donne l''architecture ;
    option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_STRICT_MODULE_RWX = y
  bon: CONFIG_STRICT_MODULE_RWX=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: 'Le code du noyau et des modules n''est pas modifiable, et leurs donnees ne sont pas executables
    : un attaquant ne peut ni reecrire le code ni executer du code depose dans les donnees.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_STRICT_MODULE_RWX
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
