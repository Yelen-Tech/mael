id: cac-package-rsh-server-removed
titre: Paquet rsh-server absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: null
    anssi: minimal
source:
  origine: complianceascode
  regle: package_rsh-server_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/r_services/package_rsh-server_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- rsh-server
- server
resume: Le paquet rsh-server doit etre absent. (regle package_rsh-server_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' rsh-server 2>/dev/null
  but: Savoir si rsh-server est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
  variantes:
    rhel: rpm -q rsh-server
controles:
- controle: paquet rsh-server absent
  bon: absent
  mauvais: installe
  gravite: elevee
  risque: 'rsh-server fournit un acces distant non chiffre, sans confidentialite ni integrite pour les
    mots de passe ni la session distante, avec une authentification tres faible : un utilisateur privilegie
    qui s''y connecte expose son mot de passe. Le paquet rsh-server fournit plusieurs services reseau
    obsoletes et non surs ; le retirer diminue le risque de leur activation accidentelle ou intentionnelle.'
  action: Desinstaller rsh-server (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: rsh-server
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - rsh-server
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
