id: cac-file-groupowner-cron-weekly
titre: 'Groupe de /etc/cron.weekly/ : root'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: planification
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_cron_weekly
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/cron_and_at/file_groupowner_cron_weekly
mots_cles:
- chgrp
- cron
- fichier
- fichiers
- groupe
- planification
- taches
- weekly
resume: 'Groupe de /etc/cron.weekly/ : root : groupe root. (regle file_groupowner_cron_weekly, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/cron.weekly/ 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Les taches de /etc/crontab et des repertoires cron s'executent en root. Qui peut y ecrire execute
    ce qu'il veut en root ; qui peut les lire decouvre les scripts de maintenance et leurs failles. Ils
    doivent appartenir a root et lui etre reserves.
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/cron.weekly/
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.4.1.5 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.4.1.5 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.4.1.5 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
