id: cac-package-chrony-installed
titre: Paquet chrony installe (si chronyd est l'outil retenu)
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: paquet-present
  niveaux:
    cis: 1
    anssi: renforce
source:
  origine: complianceascode
  regle: package_chrony_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/package_chrony_installed
mots_cles:
- chrony
- installe
- logiciel
- paquet
- paquets
resume: Le paquet chrony doit etre installe. (regle package_chrony_installed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' chrony 2>/dev/null
  but: Savoir si chrony est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet chrony installe
  bon: installe
  mauvais: absent
  gravite: moyenne
  risque: 'Une heure exacte est indispensable a l''authentification (Kerberos, certificats) et a la coherence
    des journaux entre machines : sans elle, reconstituer un incident devient impossible.'
  action: Installer chrony avec le gestionnaire de paquets.
  playbook: infra.paquet-installer
  parametres:
    paquet: chrony
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si chronyd est l''outil retenu (var_timesync_service). Demander
  ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.3.1.1 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R71 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
