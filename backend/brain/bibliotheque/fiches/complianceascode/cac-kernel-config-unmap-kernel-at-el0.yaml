resume: Le noyau doit etre compile avec CONFIG_UNMAP_KERNEL_AT_EL0=y. (regle kernel_config_unmap_kernel_at_el0,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_UNMAP_KERNEL_AT_EL0( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_UNMAP_KERNEL_AT_EL0=y ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_UNMAP_KERNEL_AT_EL0 = y
  bon: CONFIG_UNMAP_KERNEL_AT_EL0=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: 'Retire le noyau de l''espace d''adressage quand un programme s''execute (equivalent arm64 de
    l''isolation des tables de pages) : c''est la contre-mesure a l''attaque Meltdown.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_UNMAP_KERNEL_AT_EL0
    attendu: y
    architectures:
    - arm64
