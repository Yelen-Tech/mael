id: cac-file-owner-etc-issue-net
titre: 'Proprietaire de /etc/issue.net : root'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: fichiers-systeme
  type_controle: proprietaire-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_owner_etc_issue_net
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-banners/file_owner_etc_issue_net
mots_cles:
- chown
- fichier
- fichiers
- issue
- proprietaire
resume: 'Proprietaire de /etc/issue.net : root : proprietaire root. (regle file_owner_etc_issue_net, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/issue.net 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Les bannieres (/etc/issue, /etc/issue.net, /etc/motd) affichent l'avertissement legal avant
    ou apres la connexion. Si un autre compte peut les modifier, il peut retirer l'avertissement ou afficher
    un message trompeur (fausse consigne, hameconnage).
  action: chown root sur les fichiers concernes.
  playbook: infra.fichier-proprietaire
  parametres:
    chemin: /etc/issue.net
    proprietaire: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.6.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.6.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.6.6 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
