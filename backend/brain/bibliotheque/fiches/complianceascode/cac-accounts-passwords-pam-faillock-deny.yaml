id: cac-accounts-passwords-pam-faillock-deny
titre: 'Verrouillage apres echecs : echecs avant verrouillage (deny entre 1 et 4)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_passwords_pam_faillock_deny
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/locking_out_password_attempts/accounts_passwords_pam_faillock_deny
mots_cles:
- authentification
- deny
- echecs
- faillock
- force brute
- pam
- verrouillage
resume: pam_faillock doit avoir deny entre 1 et 4. (regle accounts_passwords_pam_faillock_deny, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*deny[[:space:]]*=' /etc/security/faillock.conf
  but: Lire deny dans faillock.conf
  lecture: « deny = N » ; aucune ligne = valeur par defaut (3).
- commande: grep -Es '^[[:space:]]*auth[[:space:]].*pam_faillock\.so' /etc/pam.d/common-auth
  but: Verifier que pam_faillock est utilise
  lecture: Lignes « auth ... pam_faillock.so preauth / authfail » ; aucune = verrouillage inactif.
controles:
- controle: deny entre 1 et 4
  bon: deny entre 1 et 4, pam_faillock actif
  mauvais: valeur hors bornes, ou pam_faillock non utilise
  gravite: moyenne
  risque: Limiter le nombre d'echecs de connexion en verrouillant le compte reduit le risque d'acces non
    autorise par devinette du mot de passe (force brute).
  action: Ecrire « deny = 4 » dans /etc/security/faillock.conf et activer pam_faillock (pam-auth-update
    sur Debian/Ubuntu).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/faillock.conf
    cle: deny
    valeur: '4'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: entre
    champ: deny
    attendu:
    - 1
    - 4
    defaut: '3'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- Un argument sur la ligne pam_faillock.so (ex. deny=5) l'emporte sur faillock.conf.
- Verrouiller trop vite (deny faible) facilite le deni de service sur les comptes.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.1.1 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R31 (niveau minimal)
verifie_le: '2026-09-18'
relu_par: Yelen Tech
