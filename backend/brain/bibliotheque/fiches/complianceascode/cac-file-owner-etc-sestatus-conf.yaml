id: cac-file-owner-etc-sestatus-conf
titre: 'Proprietaire de /etc/sestatus.conf : root'
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: controle-acces
  type_controle: proprietaire-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_owner_etc_sestatus_conf
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/selinux/file_owner_etc_sestatus_conf
mots_cles:
- chown
- conf
- fichier
- fichiers
- proprietaire
- sestatus
resume: 'Proprietaire de /etc/sestatus.conf : root : proprietaire root. (regle file_owner_etc_sestatus_conf,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/sestatus.conf 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/selinux et /etc/sestatus.conf portent la politique SELinux : qui peut les modifier peut
    la desactiver ou l''affaiblir. Ils doivent appartenir a root et n''etre modifiables que par lui (sur
    Debian/Ubuntu, sans objet si SELinux n''est pas installe).'
  action: chown root sur les fichiers concernes.
  playbook: infra.fichier-proprietaire
  parametres:
    chemin: /etc/sestatus.conf
    proprietaire: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
