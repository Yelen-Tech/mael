id: cac-mount-option-dev-shm-nodev
titre: Option nodev sur /dev/shm
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: montage
  type_controle: option-montage
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: mount_option_dev_shm_nodev
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/partitions/mount_option_dev_shm_nodev
mots_cles:
- memoire partagee
- montage
- nodev
- option
- partition
resume: /dev/shm doit etre monte avec l'option nodev. (regle mount_option_dev_shm_nodev, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /dev/shm
  but: Lire les options de montage ACTIVES de /dev/shm
  lecture: La colonne des options doit contenir nodev. Aucune ligne = pas de montage separe.
- commande: grep -E '[[:space:]]/dev/shm[[:space:]]' /etc/fstab
  but: Verifier la configuration PERSISTANTE
  lecture: La 4e colonne doit contenir nodev.
controles:
- controle: /dev/shm monte avec nodev
  bon: nodev present (actif et dans /etc/fstab)
  mauvais: nodev absent
  gravite: moyenne
  risque: 'Les fichiers de peripherique n''ont leur place que dans /dev : l''option nodev empeche d''en
    creer ailleurs (dans /tmp, /home...) pour contourner les droits d''acces au materiel ou a la memoire.'
  action: Ajouter nodev aux options de /dev/shm dans /etc/fstab puis remonter (mount -o remount /dev/shm).
  playbook: infra.montage-option
  parametres:
    point: /dev/shm
    option: nodev
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: option_presente
    attendu: nodev
  - commande: 1
    lecteur: fstab
    comparateur: option_presente
    attendu: nodev
pieges:
- 'Sur Debian/Ubuntu, /dev/shm est monte par systemd (nosuid,nodev d''office) et absent de /etc/fstab
  : l''absence de ligne fstab n''est pas un ecart. Pour noexec, ajouter une ligne « tmpfs /dev/shm tmpfs
  defaults,nodev,nosuid,noexec 0 0 » a la main (le playbook refuse un point absent de fstab).'
- 'Si /dev/shm n''est pas une partition separee, cette regle ne peut pas s''appliquer telle quelle : voir
  la regle de partition dediee.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.1.2.2.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.1.2.2.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.1.2.2.2 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
