resume: Aucun serveur de messagerie en ecoute hors boucle locale (port 25). (regle has_nonlocal_mta, ComplianceAsCode
  0.1.82).
observer:
- commande: ss -lntu | grep -E ':25\s' | grep -E -v '\s(127\.0\.0\.1|\[::1\]|::1):25\s'
  but: Chercher une ecoute du port 25 hors 127.0.0.1 / ::1
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: port 25 en boucle locale seulement
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Les serveurs de messagerie sont complexes et ont un long historique de failles. Hors serveur
    de messagerie, aucun ne doit ecouter sur le reseau : la remise locale suffit.'
  action: 'Limiter l''agent de messagerie a la boucle locale (postfix : inet_interfaces = loopback-only).'
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
