observer:
- commande: sysctl -n net.ipv4.conf.all.drop_gratuitous_arp
  but: Lire la valeur ACTIVE de net.ipv4.conf.all.drop_gratuitous_arp
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.conf\.all\.drop_gratuitous_arp[[:space:]]*=' /etc/sysctl.conf
    /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.conf.all.drop_gratuitous_arp = 1 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.conf.all.drop_gratuitous_arp = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Les annonces ARP spontanees (gratuitous ARP) sont l''outil classique de l''empoisonnement ARP
    : les ignorer empeche un attaquant du reseau local de s''inserer entre la machine et sa passerelle.'
  action: Ecrire « net.ipv4.conf.all.drop_gratuitous_arp = 1 » dans /etc/sysctl.conf (lu en dernier) puis
    appliquer avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.conf.all.drop_gratuitous_arp
    valeur: '1'
  evaluation:
