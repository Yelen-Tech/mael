id: cac-systemd-journal-upload-server-tls
titre: 'journald : cle, certificat et autorite TLS de systemd-journal-upload'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: systemd_journal_upload_server_tls
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/journald/systemd_journal_upload_server_tls
mots_cles:
- certificat
- journal-upload
- journald
- tls
resume: 'journald : cle, certificat et autorite TLS de systemd-journal-upload. (regle systemd_journal_upload_server_tls,
  ComplianceAsCode 0.1.82).'
observer:
- commande: cat /etc/systemd/journal-upload.conf /etc/systemd/journal-upload.conf.d/*.conf 2>/dev/null
    | awk -F= '/^(ServerKeyFile|ServerCertificateFile|TrustedCertificateFile)=/{v[$1]=1} END{n=split("ServerKeyFile
    ServerCertificateFile TrustedCertificateFile",k," "); for(i=1;i<=n;i++) if(!(k[i] in v)) print k[i]"
    manquant"}'
  but: Verifier les trois parametres TLS
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: ServerKeyFile, ServerCertificateFile et TrustedCertificateFile definis
  bon: aucune ligne (rien de manquant)
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Des journaux gardes a un seul endroit peuvent etre effaces ou modifies par accident ou par un
    attaquant. systemd-journal-upload doit connaitre le serveur distant (URL) et s'y connecter en TLS
    (cle, certificat, autorite).
  action: Renseigner les trois parametres dans /etc/systemd/journal-upload.conf.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- Ne s'applique que si journald est le service de journalisation retenu (sinon voir rsyslog).
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
