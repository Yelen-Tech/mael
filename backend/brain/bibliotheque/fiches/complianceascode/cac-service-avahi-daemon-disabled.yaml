id: cac-service-avahi-daemon-disabled
titre: Service avahi-daemon desactive et arrete
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_avahi-daemon_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/avahi/disable_avahi_group/service_avahi-daemon_disabled
mots_cles:
- avahi
- avahi-daemon
- daemon
- demarrage
- service
- services
- systemd
resume: Le service avahi-daemon doit etre desactive et arrete. (regle service_avahi-daemon_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg -s avahi-daemon >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; systemctl is-enabled
    avahi-daemon.service 2>/dev/null; systemctl is-active avahi-daemon.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de avahi-daemon
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service avahi-daemon disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: moyenne
  risque: Le service avahi-daemon garde un port reseau ouvert, donc expose aux attaques reseau. Sa fonctionnalite
    est pratique mais ne convient que si le reseau local est de confiance.
  action: systemctl disable --now avahi-daemon.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: avahi-daemon
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
pieges:
- 'Regle limitee par la source a : system_with_kernel and package[avahi]. Hors de ce cas, la commande
  repond « sans objet » (aucun ecart).'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.2 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
