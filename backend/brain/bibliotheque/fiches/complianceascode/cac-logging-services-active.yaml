id: cac-logging-services-active
titre: Un service de journalisation est actif (rsyslog, syslog-ng ou journald)
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: logging_services_active
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/logging_services_active
mots_cles:
- journald
- journalisation
- logs
- rsyslog
- syslog
resume: Un service de journalisation est actif (rsyslog, syslog-ng ou journald). (regle logging_services_active,
  ComplianceAsCode 0.1.82).
observer:
- commande: systemctl is-active rsyslog syslog-ng systemd-journald 2>/dev/null | grep -x active
  but: Verifier qu'au moins un service de journalisation tourne
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: au moins un service actif
  bon: au moins une ligne « active »
  mauvais: aucune ligne
  gravite: moyenne
  risque: 'Sans service de journalisation actif, rien n''est enregistre : impossible de detecter une attaque
    ni de la reconstituer ensuite.'
  action: Activer rsyslog ou systemd-journald (systemctl enable --now).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
