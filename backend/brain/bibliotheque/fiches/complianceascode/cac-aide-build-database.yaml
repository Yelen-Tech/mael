titre: 'AIDE : base de reference initialisee (/var/lib/aide/aide.db)'
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
