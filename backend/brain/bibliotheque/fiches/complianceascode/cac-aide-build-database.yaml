resume: 'AIDE : base de reference initialisee (/var/lib/aide/aide.db). (regle aide_build_database, ComplianceAsCode
  0.1.82).'
observer:
- commande: dpkg -s aide >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; ls /var/lib/aide/ >/dev/null
    || echo 'SENTINELLE:ILLISIBLE'; ls /var/lib/aide/aide.db 2>/dev/null
  but: Verifier la presence de la base AIDE
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: /var/lib/aide/aide.db present
  bon: une ligne
  mauvais: base absente
  gravite: moyenne
  risque: 'AIDE compare le systeme a une base de reference prise quand il etait sain : sans cette base,
    il ne peut rien detecter.'
  action: aideinit, puis cp /var/lib/aide/aide.db.new /var/lib/aide/aide.db ; conserver une copie hors
    ligne.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
