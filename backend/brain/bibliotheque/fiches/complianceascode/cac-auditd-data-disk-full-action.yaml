observer:
- commande: head -c0 /etc/audit/auditd.conf || echo 'SENTINELLE:ILLISIBLE'; grep -Es '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?disk_full_action[[:space:]]*='
    /etc/audit/auditd.conf
  but: Lire disk_full_action dans /etc/audit/auditd.conf
  lecture: Valeur de disk_full_action ; aucune ligne = non defini.
controles:
- controle: disk_full_action dans halt|single
  bon: une des valeurs halt|single
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Reagir a une erreur ou a un remplissage du disque d'audit (arret ou mode maintenance) evite
    de perdre des traces d'audit sans le savoir.
  action: Ecrire « disk_full_action = VALEUR » (une de halt|single) dans /etc/audit/auditd.conf.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/audit/auditd.conf
    cle: disk_full_action
    valeur: halt
    format: egal_espaces
