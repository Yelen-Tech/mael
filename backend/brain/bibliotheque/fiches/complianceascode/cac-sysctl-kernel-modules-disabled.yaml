id: cac-sysctl-kernel-modules-disabled
titre: Parametre noyau kernel.modules_disabled = 1
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: modules-noyau
  type_controle: parametre-noyau
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: sysctl_kernel_modules_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/restrictions/sysctl_kernel_modules_disabled
mots_cles:
- disabled
- kernel
- kernel.modules_disabled
- modules
- noyau
- parametre
- sysctl
resume: Le parametre noyau kernel.modules_disabled doit valoir 1, en memoire et de facon persistante.
  (regle sysctl_kernel_modules_disabled, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.modules_disabled
  but: Lire la valeur ACTIVE de kernel.modules_disabled
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*kernel\.modules_disabled[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.modules_disabled = 1 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.modules_disabled = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Un module noyau malveillant (rootkit) prend le controle complet de la machine. Interdire tout
    chargement de module une fois le demarrage termine ferme cette porte.
  action: Ecrire « kernel.modules_disabled = 1 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.modules_disabled
    attendu: '1'
    precedence: sysctl
  sans_playbook: 'irreversible sans redemarrage : le retour arriere automatique ne peut pas fonctionner'
pieges:
- 'kernel.modules_disabled = 1 ne peut plus etre remis a 0 sans redemarrer, et bloque les pilotes charges
  ensuite (materiel branche a chaud, reseau) : a activer en fin de demarrage, apres essai.'
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R10 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
