observer:
- commande: grep -Es '^[[:space:]]*PASS_MIN_DAYS[[:space:]]' /etc/login.defs
  but: Lire PASS_MIN_DAYS dans /etc/login.defs
  lecture: Valeur de PASS_MIN_DAYS ; aucune ligne = non defini.
controles:
- controle: PASS_MIN_DAYS au moins 1
  bon: PASS_MIN_DAYS 1 ou plus
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Sans duree de vie minimale, un utilisateur peut changer son mot de passe plusieurs fois de suite
    pour vider l'historique et revenir aussitot a son ancien mot de passe, ce qui annule la politique
    de non-reutilisation.
  action: Ecrire « PASS_MIN_DAYS 1 » dans /etc/login.defs.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/login.defs
    cle: PASS_MIN_DAYS
    valeur: '1'
    format: espace
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: au_moins
    champ: PASS_MIN_DAYS
    attendu: '1'
    sep: espace
