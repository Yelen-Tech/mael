id: cac-sshd-use-strong-ciphers
titre: 'SSH : uniquement des chiffrements forts (Ciphers)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: ssh
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_use_strong_ciphers
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_use_strong_ciphers
mots_cles:
- algorithmes
- cbc
- chiffrement
- ciphers
- ssh
resume: 'SSH : uniquement des chiffrements forts (Ciphers). (regle sshd_use_strong_ciphers, ComplianceAsCode
  0.1.82).'
observer:
- commande: 'sshd -T 2>/dev/null | awk ''$1=="ciphers"{v=1; n=split($2,c,","); for(i=1;i<=n;i++) if (index(",chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr,",
    ","c[i]",")==0) print "chiffrement faible : "c[i]} END{if(!v) print "SENTINELLE:ILLISIBLE"}'''
  but: Lister les chiffrements SSH hors de la liste forte
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: Ciphers limites a chacha20-poly1305, aes-gcm, aes-ctr
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Les chiffrements en mode CBC du protocole SSH presentent des faiblesses connues permettant de
    retrouver une partie du texte en clair. Les modes compteur (CTR), GCM et chacha20-poly1305 n'ont pas
    ces faiblesses et sont les seuls a autoriser.
  action: Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
    dans /etc/ssh/sshd_config.d/, puis recharger sshd.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'sshd -T exige root : sans sudo, resultat « indetermine ».'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
