resume: Le noyau doit etre compile avec CONFIG_X86_VSYSCALL_EMULATION=n. (regle kernel_config_x86_vsyscall_emulation,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_X86_VSYSCALL_EMULATION( is not set|=)' /boot/config-$(uname
    -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_X86_VSYSCALL_EMULATION is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_X86_VSYSCALL_EMULATION = n
  bon: '# CONFIG_X86_VSYSCALL_EMULATION is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: faible
  risque: La table vsyscall n'est plus necessaire aux programmes actuels et fournit des fragments de code
    a adresse fixe utiles aux attaques par ROP.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_X86_VSYSCALL_EMULATION
    attendu: n
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
