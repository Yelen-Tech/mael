id: cac-kernel-config-x86-vsyscall-emulation
titre: Option de compilation du noyau CONFIG_X86_VSYSCALL_EMULATION = n
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_x86_vsyscall_emulation
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_x86_vsyscall_emulation
mots_cles:
- compilation
