id: cac-file-owner-etc-chrony-keys
titre: 'Proprietaire de /etc/chrony.keys : root'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: synchronisation-heure
  type_controle: proprietaire-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_owner_etc_chrony_keys
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/file_owner_etc_chrony_keys
mots_cles:
- chown
- chrony
- fichier
- fichiers
- keys
- proprietaire
resume: 'Proprietaire de /etc/chrony.keys : root : proprietaire root. (regle file_owner_etc_chrony_keys,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/chrony.keys 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Le fichier de cles de chrony authentifie les serveurs de temps : qui le lit ou le modifie peut
    se faire passer pour un serveur et fausser l''heure de la machine.'
  action: chown root sur les fichiers concernes.
  playbook: infra.fichier-proprietaire
  parametres:
    chemin: /etc/chrony.keys
    proprietaire: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Chemin RHEL : sur Debian/Ubuntu la cle est dans /etc/chrony/chrony.keys (compte _chrony) ; ici « aucune
  ligne » ne prouve rien, verifier ce fichier a la main.'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
