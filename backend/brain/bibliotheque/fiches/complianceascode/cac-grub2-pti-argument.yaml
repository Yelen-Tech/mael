id: cac-grub2-pti-argument
titre: Argument de demarrage pti=on
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: demarrage
  type_controle: argument-demarrage
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: grub2_pti_argument
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/bootloader-grub2/grub2_pti_argument
mots_cles:
- argument
- demarrage
- grub
- noyau
- pti
resume: Le noyau doit demarrer avec pti=on. (regle grub2_pti_argument, ComplianceAsCode 0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : pti=on.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: pti=on doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument pti=on
  bon: pti=on dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: faible
  risque: L'isolation des tables de pages du noyau (PTI) protege contre Meltdown et renforce la randomisation
    des adresses du noyau (KASLR).
  action: Ajouter pti=on a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer la configuration (update-grub)
    et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: pti=on
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: pti
    comparateur: egal
    attendu: 'on'
  - commande: 1
    lecteur: grub
    champ: pti
    comparateur: egal
    attendu: 'on'
pieges:
- 'Le changement ne prend effet qu''apres redemarrage : planifier la fenetre de maintenance.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R8 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
