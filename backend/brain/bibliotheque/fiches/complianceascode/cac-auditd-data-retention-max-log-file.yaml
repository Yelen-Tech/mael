id: cac-auditd-data-retention-max-log-file
titre: 'auditd : taille maximale d''un journal (6 Mo au moins)'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: configuration
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: auditd_data_retention_max_log_file
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/configure_auditd_data_retention/auditd_data_retention_max_log_file
mots_cles:
- auditd
- file
- journal
- max_log_file
- retention
- taille
resume: 'auditd : taille maximale d''un journal (6 Mo au moins). (regle auditd_data_retention_max_log_file,
  ComplianceAsCode 0.1.82).'
observer:
- commande: head -c0 /etc/audit/auditd.conf || echo 'SENTINELLE:ILLISIBLE'; grep -Es '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?max_log_file[[:space:]]*='
    /etc/audit/auditd.conf
  but: Lire max_log_file dans /etc/audit/auditd.conf
  lecture: Valeur de max_log_file ; aucune ligne = non defini.
controles:
- controle: max_log_file au moins 6
  bon: max_log_file = 6 ou plus
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: 'L''espace total des journaux d''audit doit suffire a conserver les traces sur la duree exigee
    : il depend de la taille maximale d''un fichier et du nombre de fichiers conserves.'
  action: Ecrire « max_log_file = 6 » (ou plus) dans /etc/audit/auditd.conf.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/audit/auditd.conf
    cle: max_log_file
    valeur: '6'
    format: egal_espaces
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: au_moins
    champ: max_log_file
    attendu: '6'
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
