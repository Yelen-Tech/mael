id: cac-sshd-set-keepalive
titre: 'SSH : deconnexion des sessions inactives (nombre de relances) (ClientAliveCountMax 3)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_set_keepalive
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_set_keepalive
mots_cles:
- alive
- client
- clientalivecountmax
- count
- deconnexion
- inactif
- inactive
- inactivite
- relances
- session
- ssh
- sshd
- timeout
resume: La directive sshd ClientAliveCountMax doit valoir « 3 » (regle sshd_set_keepalive, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^clientalivecountmax '
  but: Lire la valeur EFFECTIVE de ClientAliveCountMax
  lecture: 'Attendu : « clientalivecountmax N » avec 1 <= N <= 3. Une valeur plus stricte est conforme.'
- commande: grep -Ris '^[[:space:]]*ClientAliveCountMax[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou ClientAliveCountMax est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: ClientAliveCountMax <= 3
  bon: ClientAliveCountMax entre 1 et 3
  mauvais: 0, absent avec un defaut plus eleve, ou superieur a 3
  gravite: moyenne
  risque: 'Limite le nombre de relances sans reponse avant de fermer une session inactive : la session
    se termine peu apres l''intervalle d''inactivite.'
  action: Definir « ClientAliveCountMax 3 » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: ClientAliveCountMax
    valeur: '3'
  evaluation:
  - comparateur: max
    attendu: '3'
    commande: 0
    lecteur: sshd_t
    champ: clientalivecountmax
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- 'Regle Sentinelle : la source exige exactement 3 ; une valeur plus stricte (entre 1 et 3) est acceptee.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.7 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.7 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.7 (niveau 1)
verifie_le: '2026-09-17'
relu_par: assistant IA (Claude), par delegation du responsable du projet
