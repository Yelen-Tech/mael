id: cac-grub2-mce-argument
titre: Argument de demarrage mce=0
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: demarrage
  type_controle: argument-demarrage
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: grub2_mce_argument
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/bootloader-grub2/grub2_mce_argument
mots_cles:
- argument
- demarrage
- grub
- mce
- noyau
resume: Le noyau doit demarrer avec mce=0. (regle grub2_mce_argument, ComplianceAsCode 0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : mce=0.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: mce=0 doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument mce=0
  bon: mce=0 dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: moyenne
  risque: 'Laisser tourner la machine apres une erreur memoire non corrigee peut aider une attaque de
    type Rowhammer a insister jusqu''a reussir : mce=0 arrete le systeme a la premiere.'
  action: Ajouter mce=0 a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer la configuration (update-grub)
    et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: mce=0
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: mce
    comparateur: egal
    attendu: '0'
  - commande: 1
    lecteur: grub
    champ: mce
    comparateur: egal
    attendu: '0'
pieges:
- 'Le changement ne prend effet qu''apres redemarrage : planifier la fenetre de maintenance.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R8 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
