id: cac-partition-for-home
titre: Partition separee pour /home
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: montage
  type_controle: partition-separee
  niveaux:
    cis: 2
    anssi: intermediaire
source:
  origine: complianceascode
  regle: partition_for_home
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/disk_partitioning/partition_for_home
mots_cles:
- disque
- home
- montage
- partition
- separee
- utilisateurs
resume: /home doit etre une partition (ou un montage) separe. (regle partition_for_home, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /home
  but: Voir si /home est un montage separe
  lecture: Une ligne = montage separe ; aucune = meme partition que son parent.
controles:
- controle: /home monte a part
  bon: montage separe
  mauvais: /home sur la partition de son parent
  gravite: faible
  risque: Une partition dediee a /home permet des options de montage plus strictes et empeche les utilisateurs
    de remplir le disque utilise par le systeme, les journaux et l'audit.
  action: 'Prevoir une partition (ou un volume LVM) dedie a /home et la declarer dans /etc/fstab : se
    planifie, surtout sur un systeme en production.'
  playbook: null
  sans_playbook: 'partition dediee : repartitionnement a planifier, non automatisable'
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: monte
pieges:
- 'Repartitionner un systeme en service est risque : a planifier (ou a appliquer aux prochaines installations).'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.1.2.3.1 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.1.2.3.1 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.1.2.3.1 (niveau 2)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R28 (niveau intermediaire)
