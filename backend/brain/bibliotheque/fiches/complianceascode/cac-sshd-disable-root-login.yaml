id: cac-sshd-disable-root-login
titre: 'SSH : connexion directe du compte root (PermitRootLogin no)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: sshd_disable_root_login
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_disable_root_login
mots_cles:
- administrateur
- compte
- connexion
- login
- permit
- permitrootlogin
- root
- ssh
- sshd
- superutilisateur
resume: La directive sshd PermitRootLogin doit valoir « no » (regle sshd_disable_root_login, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^permitrootlogin '
  but: Lire la valeur EFFECTIVE de PermitRootLogin
  lecture: 'Attendu : « permitrootlogin no ». Toute autre valeur est un ecart.'
- commande: grep -Ris '^[[:space:]]*PermitRootLogin[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou PermitRootLogin est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: PermitRootLogin = no
  bon: PermitRootLogin no
  mauvais: toute autre valeur
  gravite: elevee
  risque: 'La connexion directe en root offre une cible unique a la force brute et supprime la tracabilite
    : se connecter avec un compte nominatif puis elever ses privileges permet de savoir qui a fait quoi.'
  action: Definir « PermitRootLogin no » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: PermitRootLogin
    valeur: 'no'
  evaluation:
  - comparateur: egal
    attendu: 'no'
    commande: 0
    lecteur: sshd_t
    champ: permitrootlogin
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- 'Regle Sentinelle : gravite portee a elevee (cible unique de force brute et perte de tracabilite ; aligne
  sur la fiche manuelle ssh-durcissement).'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.20 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.20 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.20 (niveau 1)
- nom: ANSSI
