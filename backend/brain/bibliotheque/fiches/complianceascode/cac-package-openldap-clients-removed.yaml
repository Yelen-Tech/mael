resume: Le paquet ldap-utils / openldap-clients doit etre absent. (regle package_openldap-clients_removed,
  ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' ldap-utils openldap-clients 2>/dev/null
  but: Savoir si ldap-utils openldap-clients est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet ldap-utils openldap-clients absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: Si le systeme n'a pas besoin de servir de client LDAP, retirer ce logiciel est recommande pour
    reduire la surface d'attaque potentielle.
  action: Desinstaller ldap-utils openldap-clients (apt purge) apres avoir verifie qu'aucun service n'en
    depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: ldap-utils openldap-clients
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - ldap-utils
    - openldap-clients
pieges:
