id: cac-service-chronyd-enabled
titre: Service chrony active et demarre (si chronyd est l'outil retenu)
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: service-actif
  niveaux:
    cis: 1
    anssi: renforce
source:
  origine: complianceascode
  regle: service_chronyd_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/service_chronyd_enabled
mots_cles:
- chrony
- demarrage
- service
- services
- systemd
resume: Le service chrony doit etre active et demarre. (regle service_chronyd_enabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled chrony.service 2>/dev/null; systemctl is-active chrony.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de chrony
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service chrony enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: moyenne
  risque: 'Une heure exacte est indispensable a l''authentification (Kerberos, certificats) et a la coherence
    des journaux entre machines : sans elle, reconstituer un incident devient impossible.'
  action: systemctl enable --now chrony.service
  playbook: infra.service-activer
  parametres:
    service: chrony
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si chronyd est l''outil retenu (var_timesync_service). Demander
  ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.3.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.3.1.1 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R71 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
