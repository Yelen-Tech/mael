resume: Le noyau doit etre compile avec CONFIG_REFCOUNT_FULL=y. (regle kernel_config_refcount_full, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_REFCOUNT_FULL( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_REFCOUNT_FULL=y ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_REFCOUNT_FULL = y
  bon: CONFIG_REFCOUNT_FULL=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: Protege les compteurs de references contre les debordements, qui menent a des utilisations apres
    liberation (use-after-free) exploitables.
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_REFCOUNT_FULL
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
