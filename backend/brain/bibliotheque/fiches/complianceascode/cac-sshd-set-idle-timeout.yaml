id: cac-sshd-set-idle-timeout
titre: 'SSH : deconnexion des sessions inactives (intervalle) (ClientAliveInterval 300)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_set_idle_timeout
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_set_idle_timeout
mots_cles:
- alive
- client
- clientaliveinterval
- deconnexion
- delai
- inactif
- inactive
- inactivite
- interval
- session
- ssh
- sshd
- timeout
resume: La directive sshd ClientAliveInterval doit valoir « 300 » (regle sshd_set_idle_timeout, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^clientaliveinterval '
  but: Lire la valeur EFFECTIVE de ClientAliveInterval
  lecture: 'Attendu : « clientaliveinterval N » avec 1 <= N <= 300. Une valeur plus stricte est conforme.'
- commande: grep -Ris '^[[:space:]]*ClientAliveInterval[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou ClientAliveInterval est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: ClientAliveInterval <= 300
  bon: ClientAliveInterval entre 1 et 300
  mauvais: 0, absent avec un defaut plus eleve, ou superieur a 300
  gravite: moyenne
  risque: Fermer rapidement une session inactive reduit le risque qu'une personne non autorisee reprenne
    une session d'administration laissee ouverte.
  action: Definir « ClientAliveInterval 300 » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: ClientAliveInterval
    valeur: '300'
  evaluation:
  - comparateur: max
    attendu: '300'
    commande: 0
    lecteur: sshd_t
    champ: clientaliveinterval
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- 'Regle Sentinelle : la source exige exactement 300 ; une valeur plus stricte (entre 1 et 300) est acceptee.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.7 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.7 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.7 (niveau 1)
verifie_le: '2026-09-17'
