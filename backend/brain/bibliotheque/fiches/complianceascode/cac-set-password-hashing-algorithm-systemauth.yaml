id: cac-set-password-hashing-algorithm-systemauth
titre: 'PAM : pam_unix.so dans /etc/pam.d/common-password (yescrypt)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: set_password_hashing_algorithm_systemauth
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/set_password_hashing_algorithm/set_password_hashing_algorithm_systemauth
mots_cles:
- authentification
- common
- pam
- pam_unix
- password
- unix
- yescrypt
resume: /etc/pam.d/common-password doit appeler pam_unix.so avec yescrypt. (regle set_password_hashing_algorithm_systemauth,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*password[[:space:]].*pam_unix\.so' /etc/pam.d/common-password
  but: Lire la ligne pam_unix.so de /etc/pam.d/common-password
  lecture: 'Attendu : « password pam_unix.so yescrypt » ; aucune ligne = module absent.'
controles:
- controle: password pam_unix.so yescrypt
  bon: password pam_unix.so yescrypt
  mauvais: module absent, ou option absente / plus faible
  gravite: moyenne
  risque: 'Les mots de passe doivent etre stockes sous forme d''empreinte par un algorithme robuste :
    un algorithme faible ne protege guere mieux que le texte en clair si /etc/shadow fuite. yescrypt ou
    SHA-512 rendent le cassage beaucoup plus couteux.'
  action: Ajouter ou completer la ligne password ... pam_unix.so dans /etc/pam.d/common-password (sur
    Debian/Ubuntu, de preference via pam-auth-update) en gardant une session root ouverte.
  playbook: null
  sans_playbook: 'pile PAM : a modifier avec pam-auth-update et une session root ouverte (une erreur peut
    bloquer toute connexion)'
  evaluation:
  - commande: 0
    lecteur: pam
    comparateur: arguments
    champ: pam_unix.so
    attendu:
    - nom: yescrypt
pieges:
- 'Une erreur dans /etc/pam.d peut bloquer toute connexion : garder une session root ouverte pendant la
  modification.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
