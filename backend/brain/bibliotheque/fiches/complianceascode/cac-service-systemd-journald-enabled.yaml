id: cac-service-systemd-journald-enabled
titre: Service systemd-journald active et demarre
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: service-actif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_systemd-journald_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/journald/service_systemd-journald_enabled
mots_cles:
- demarrage
- journald
- service
- services
- systemd
- systemd-journald
resume: Le service systemd-journald doit etre active et demarre. (regle service_systemd-journald_enabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: systemctl is-enabled systemd-journald.service 2>/dev/null; systemctl is-active systemd-journald.service
    2>/dev/null
  but: Lire l'etat de demarrage et d'execution de systemd-journald
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service systemd-journald enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: moyenne
  risque: 'journald collecte les journaux du noyau, du demarrage et des services : sans lui, la cause
    d''une panne ou d''un incident ne peut pas etre retrouvee.'
  action: systemctl enable --now systemd-journald.service
  playbook: infra.service-activer
  parametres:
    service: systemd-journald
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: actif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.1.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.1.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
