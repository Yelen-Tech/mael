id: cac-disable-host-auth
titre: 'SSH : authentification par hote desactivee (HostbasedAuthentication no)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: disable_host_auth
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/disable_host_auth
mots_cles:
- authentication
- authentification
- confiance
- hostbased
- hostbasedauthentication
- hote
- ssh
- sshd
resume: La directive sshd HostbasedAuthentication doit valoir « no » (regle disable_host_auth, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^hostbasedauthentication '
  but: Lire la valeur EFFECTIVE de HostbasedAuthentication
  lecture: 'Attendu : « hostbasedauthentication no ». Toute autre valeur est un ecart.'
- commande: grep -Ris '^[[:space:]]*HostbasedAuthentication[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou HostbasedAuthentication est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: HostbasedAuthentication = no
  bon: HostbasedAuthentication no
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Avec une relation de confiance entre hotes, la compromission d'une machine permet a l'attaquant
    de rebondir sans effort vers les autres.
  action: Definir « HostbasedAuthentication no » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: HostbasedAuthentication
    valeur: 'no'
  evaluation:
  - comparateur: egal
    attendu: 'no'
    commande: 0
    lecteur: sshd_t
    champ: hostbasedauthentication
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- '« HostbasedAuthentication no » est la valeur par defaut : son absence du fichier est conforme.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.10 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.10 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.10 (niveau 1)
verifie_le: '2026-09-17'
relu_par: assistant IA (Claude), par delegation du responsable du projet
