id: cac-accounts-user-dot-user-ownership
titre: Fichiers d'initialisation (.bashrc...) possedes par leur utilisateur
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: sessions
  type_controle: detection
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: accounts_user_dot_user_ownership
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-session/accounts_user_dot_user_ownership
mots_cles:
- bashrc
- fichiers d'initialisation
- proprietaire
resume: Fichiers d'initialisation (.bashrc...) possedes par leur utilisateur. (regle accounts_user_dot_user_ownership,
  ComplianceAsCode 0.1.82).
observer:
- commande: find /home -mindepth 2 -maxdepth 2 -name '.*' -type f -printf '%u %p\n' 2>/dev/null | awk
    'BEGIN{while ((getline l < "/etc/passwd") > 0) {split(l, c, ":"); if (c[3] >= 1000) h[c[6]] = c[1]}}
    {d = $2; sub(/\/[^\/]*$/, "", d)} (d in h) && $1 != h[d] {print $2" appartient a "$1" (attendu "h[d]")"}'
  but: Comparer le proprietaire des fichiers caches a l'utilisateur du repertoire
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: proprietaire = utilisateur
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Les fichiers d'initialisation configurent l'environnement de shell a la connexion. Une modification
    malveillante de ces fichiers peut compromettre les comptes a la connexion.
  action: chown UTILISATEUR /home/UTILISATEUR/.FICHIER
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
