id: cac-sysctl-net-ipv4-ip-forward
titre: Parametre noyau net.ipv4.ip_forward = 0
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: parametres-reseau
  type_controle: parametre-noyau
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: sysctl_net_ipv4_ip_forward
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-kernel/network_host_parameters/sysctl_net_ipv4_ip_forward
mots_cles:
- forward
- ipv4
- net.ipv4.ip_forward
- noyau
- parametre
- passerelle
- routage
- sysctl
- transfert
resume: Le parametre noyau net.ipv4.ip_forward doit valoir 0, en memoire et de facon persistante. (regle
  sysctl_net_ipv4_ip_forward, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.ip_forward
  but: Lire la valeur ACTIVE de net.ipv4.ip_forward
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.ip_forward[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.ip_forward = 0 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.ip_forward = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Une machine qui transmet les paquets d''un reseau a l''autre joue le role de routeur : un attaquant
    peut s''en servir pour passer d''un reseau a un autre en contournant le cloisonnement. A reserver
    aux routeurs.'
  action: Ecrire « net.ipv4.ip_forward = 0 » dans /etc/sysctl.conf (lu en dernier) puis appliquer avec
    sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.ip_forward
    valeur: '0'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '0'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv4.ip_forward
    attendu: '0'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
