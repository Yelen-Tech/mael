resume: La configuration de sudo doit contenir « Defaults use_pty ». (regle sudo_add_use_pty, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Rhs '^[[:space:]]*Defaults' /etc/sudoers /etc/sudoers.d/
  but: Lire les options globales de sudo
  lecture: 'Attendu : une ligne contenant use_pty ; « !use_pty » = desactive.'
controles:
- controle: Defaults use_pty
  bon: Defaults use_pty
  mauvais: option absente ou desactivee
  gravite: moyenne
  risque: Executer les commandes sudo dans un pseudo-terminal separe empeche un programme malveillant
    lance par sudo de garder la main sur le terminal de l'utilisateur une fois la commande terminee.
  action: Ajouter « Defaults use_pty » avec visudo -f /etc/sudoers.d/sentinelle (jamais d'edition directe).
  playbook: infra.sudo-defaults
  parametres:
    option: use_pty
  evaluation:
  - commande: 0
    lecteur: sudo_defaults
    comparateur: option
    champ: use_pty
pieges:
- '/etc/sudoers n''est lisible que par root : lancer la lecture avec sudo.'
- 'Une erreur de syntaxe dans sudoers bloque sudo : toujours passer par visudo.'
