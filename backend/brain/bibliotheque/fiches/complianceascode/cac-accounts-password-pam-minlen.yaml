id: cac-accounts-password-pam-minlen
titre: 'Mots de passe : longueur minimale des mots de passe (minlen au moins 14)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_password_pam_minlen
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_minlen
mots_cles:
- complexite
- longueur
- minimale
- minlen
- mot de passe
- mots
- mots de passe
- pam
- passe
- politique
- pwquality
resume: pwquality doit imposer minlen au moins 14 (longueur minimale des mots de passe). (regle accounts_password_pam_minlen,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*minlen[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de minlen configuree pour pwquality
  lecture: « minlen = N » ; aucune ligne = valeur par defaut du module (8).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: minlen au moins 14
  bon: minlen au moins 14, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: Plus un mot de passe est court, moins il y a de combinaisons a tester pour le trouver. Chaque
    caractere en plus multiplie le temps et les moyens necessaires pour le casser.
  action: Ecrire « minlen = 14 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: minlen
    valeur: '14'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: au_moins
    champ: minlen
    attendu: '14'
    defaut: '8'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
