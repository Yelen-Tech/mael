id: cac-file-permissions-sshd-private-key
titre: Droits des fichiers *_key de /etc/ssh/ (0600 au plus)
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: ssh
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_permissions_sshd_private_key
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/file_permissions_sshd_private_key
mots_cles:
- chmod
- droits
- fichier
- fichiers
- permissions
resume: 'Droits des fichiers *_key de /etc/ssh/ : 0600 ou plus strict (aucun droit en plus). (regle file_permissions_sshd_private_key,
  ComplianceAsCode 0.1.82).'
observer:
- commande: find /etc/ssh/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*_key$' -printf '%m
    %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0600. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0600
  bon: 0600 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Une personne qui obtient la cle privee d'hote SSH peut se faire passer pour le serveur (attaque
    de l'intercepteur) et recueillir les identifiants des utilisateurs.
  action: chmod 0600 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /etc/ssh/
    regex: ^.*_key$
    nature: droits
    valeur: '0600'
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0600'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
