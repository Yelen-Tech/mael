id: cac-kernel-config-ia32-emulation
titre: Option de compilation du noyau CONFIG_IA32_EMULATION = n (x86 uniquement)
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_ia32_emulation
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_ia32_emulation
mots_cles:
- compilation
- config_ia32_emulation
- emulation
- ia32
- kernel
- noyau
resume: Le noyau doit etre compile avec CONFIG_IA32_EMULATION=n. (regle kernel_config_ia32_emulation,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_IA32_EMULATION( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_IA32_EMULATION is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_IA32_EMULATION = n
  bon: '# CONFIG_IA32_EMULATION is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: moyenne
  risque: 'La compatibilite 32 bits ajoute une seconde interface d''appels systeme, source reguliere de
    failles : la desactiver reduit la surface d''attaque.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_IA32_EMULATION
    attendu: n
    architectures:
    - x86
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
