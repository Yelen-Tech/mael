id: cac-package-rsyslog-installed
titre: Paquet rsyslog installe
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: paquet-present
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_rsyslog_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/package_rsyslog_installed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- rsyslog
resume: Le paquet rsyslog doit etre installe. (regle package_rsyslog_installed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' rsyslog 2>/dev/null
  but: Savoir si rsyslog est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet rsyslog installe
  bon: installe
  mauvais: absent
  gravite: moyenne
  risque: 'rsyslog recoit et range les journaux du systeme et des services : sans lui (ou un equivalent
    actif), les evenements de securite ne sont pas enregistres.'
  action: Installer rsyslog avec le gestionnaire de paquets.
  playbook: infra.paquet-installer
  parametres:
    paquet: rsyslog
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: installe
    attendu:
    - rsyslog
pieges: []
referentiels:
