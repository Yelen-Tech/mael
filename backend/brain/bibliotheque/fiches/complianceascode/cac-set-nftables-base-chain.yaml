id: cac-set-nftables-base-chain
titre: 'nftables : chaines de base input, forward et output (si nftables est l''outil retenu)'
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: set_nftables_base_chain
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-nftables/set_nftables_base_chain
mots_cles:
- chaine
- hook
- nftables
- pare-feu
resume: 'nftables : chaines de base input, forward et output. (regle set_nftables_base_chain, ComplianceAsCode
  0.1.82).'
observer:
- commande: nft list ruleset | grep -E 'hook (input|forward|output)'
  but: Lister les chaines de base
  lecture: 'Attendu : une ligne par chaine de base (hook input, forward, output) ; une chaine manquante
    = ecart.'
controles:
- controle: chaines input, forward, output presentes
  bon: 3 lignes « type filter hook ... »
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Sans chaine de base accrochee a input, forward et output, les paquets de ces chemins ne passent
    par aucune regle nftables et ne sont pas filtres.
  action: Creer les chaines de base dans /etc/nftables.conf (type filter hook input/forward/output).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si nftables est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
