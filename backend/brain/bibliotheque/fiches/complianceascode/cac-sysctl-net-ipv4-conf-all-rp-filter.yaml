resume: Le parametre noyau net.ipv4.conf.all.rp_filter doit valoir 1, en memoire et de facon persistante.
  (regle sysctl_net_ipv4_conf_all_rp_filter, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.conf.all.rp_filter
  but: Lire la valeur ACTIVE de net.ipv4.conf.all.rp_filter
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.conf\.all\.rp_filter[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.conf.all.rp_filter = 1 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.conf.all.rp_filter = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Le filtrage par chemin inverse rejette les paquets dont l''adresse source n''aurait pas pu
    arriver par cette interface : il bloque une grande partie des adresses usurpees. A eviter seulement
    sur les routeurs de reseaux complexes.'
  action: Ecrire « net.ipv4.conf.all.rp_filter = 1 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.conf.all.rp_filter
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv4.conf.all.rp_filter
    attendu: '1'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
