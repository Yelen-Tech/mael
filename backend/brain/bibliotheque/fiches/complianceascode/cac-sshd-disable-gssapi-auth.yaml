id: cac-sshd-disable-gssapi-auth
titre: 'SSH : authentification GSSAPI desactivee (GSSAPIAuthentication no)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: sshd_disable_gssapi_auth
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_disable_gssapi_auth
mots_cles:
- authentication
- authentification
- gssapi
- gssapiauthentication
- kerberos
- ssh
- sshd
resume: La directive sshd GSSAPIAuthentication doit valoir « no » (regle sshd_disable_gssapi_auth, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^gssapiauthentication '
  but: Lire la valeur EFFECTIVE de GSSAPIAuthentication
  lecture: 'Attendu : « gssapiauthentication no ». Toute autre valeur est un ecart.'
- commande: grep -Ris '^[[:space:]]*GSSAPIAuthentication[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou GSSAPIAuthentication est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: GSSAPIAuthentication = no
  bon: GSSAPIAuthentication no
  mauvais: toute autre valeur
  gravite: moyenne
  risque: L'authentification GSSAPI expose ce mecanisme aux machines distantes et augmente la surface
    d'attaque du systeme.
  action: Definir « GSSAPIAuthentication no » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: GSSAPIAuthentication
    valeur: 'no'
  evaluation:
  - comparateur: egal
    attendu: 'no'
    commande: 0
    lecteur: sshd_t
    champ: gssapiauthentication
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- '« GSSAPIAuthentication no » est la valeur par defaut : son absence du fichier est conforme.'
- 'Controle CIS de niveau 2 : verifier qu''aucune authentification Kerberos/Active Directory ne passe
  par SSH avant de corriger.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.9 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.9 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.9 (niveau 2)
verifie_le: '2026-09-17'
relu_par: Yelen Tech
