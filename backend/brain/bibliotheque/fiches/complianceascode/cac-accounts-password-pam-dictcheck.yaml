id: cac-accounts-password-pam-dictcheck
titre: 'Mots de passe : refus des mots du dictionnaire (dictcheck 1)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_pam_dictcheck
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_dictcheck
mots_cles:
- complexite
- dictcheck
- dictionnaire
- mot de passe
- mots
- mots de passe
- pam
- politique
- pwquality
- refus
resume: pwquality doit imposer dictcheck 1 (refus des mots du dictionnaire). (regle accounts_password_pam_dictcheck,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*dictcheck[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de dictcheck configuree pour pwquality
  lecture: « dictcheck = N » ; aucune ligne = valeur par defaut du module (1).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: dictcheck 1
  bon: dictcheck 1, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: 'Les mots de passe formes de mots du dictionnaire sont les premiers testes par les attaques
    par devinette : ils sont trouves en quelques secondes.'
  action: Ecrire « dictcheck = 1 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: dictcheck
    valeur: '1'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: toutes_egales
    champ: dictcheck
    attendu: '1'
    defaut: '1'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.2.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.2.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.2.6 (niveau 1)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
