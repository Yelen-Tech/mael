id: cac-accounts-root-gid-zero
titre: Le groupe principal de root est le GID 0
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_root_gid_zero
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/root_logins/accounts_root_gid_zero
mots_cles:
- gid
- groupe
- passwd
- root
resume: Le groupe principal de root est le GID 0. (regle accounts_root_gid_zero, ComplianceAsCode 0.1.82).
observer:
- commande: 'awk -F: ''$1 == "root" && $4 != 0 {print $1":"$4}'' /etc/passwd'
  but: Lire le groupe principal de root
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: root en GID 0
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: Les fichiers crees par root heritent de son groupe principal. Si ce n'est pas le groupe 0, ils
    peuvent devenir accessibles par megarde aux membres d'un autre groupe.
  action: usermod -g 0 root
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
