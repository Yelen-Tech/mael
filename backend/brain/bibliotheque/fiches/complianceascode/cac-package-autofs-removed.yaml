id: cac-package-autofs-removed
titre: Paquet autofs absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_autofs_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/package_autofs_removed
mots_cles:
- autofs
- installe
- logiciel
- paquet
- paquets
resume: Le paquet autofs doit etre absent. (regle package_autofs_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' autofs 2>/dev/null
  but: Savoir si autofs est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet autofs absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: Avec le montage automatique active, toute personne ayant un acces physique peut brancher une
    cle USB ou un disque et en utiliser le contenu, meme sans avoir les droits de le monter elle-meme.
  action: Desinstaller autofs (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: autofs
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - autofs
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
