id: cac-sshd-use-strong-kex
titre: 'SSH : uniquement des echanges de cles forts (KexAlgorithms)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: ssh
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_use_strong_kex
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_use_strong_kex
mots_cles:
- algorithmes
- echange de cles
- kex
- kexalgorithms
- ssh
resume: 'SSH : uniquement des echanges de cles forts (KexAlgorithms). (regle sshd_use_strong_kex, ComplianceAsCode
  0.1.82).'
observer:
- commande: 'sshd -T 2>/dev/null | awk ''$1=="kexalgorithms"{v=1; n=split($2,c,","); for(i=1;i<=n;i++)
    if (index(",curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,sntrup761x25519-sha512@openssh.com,",
    ","c[i]",")==0) print "echange de cles faible : "c[i]} END{if(!v) print "SENTINELLE:ILLISIBLE"}'''
  but: Lister les algorithmes d'echange de cles hors de la liste forte
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: KexAlgorithms limites a curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,sntrup761x25519-sha512@openssh.com
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: L'echange de cles etablit les cles de session qui protegent toute la connexion. Un algorithme
    faible (ex. diffie-hellman-group1-sha1, group14-sha1) permet a un attaquant dote de moyens de calcul
    de casser la session ou de forcer un algorithme plus faible lors de la negociation.
  action: KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256,sntrup761x25519-sha512@openssh.com
    dans /etc/ssh/sshd_config.d/, puis recharger sshd.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
