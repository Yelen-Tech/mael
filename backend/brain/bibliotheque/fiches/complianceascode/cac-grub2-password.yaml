id: cac-grub2-password
titre: GRUB protege par un superutilisateur et un mot de passe chiffre
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: demarrage
  type_controle: detection
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: grub2_password
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/bootloader-grub2/non-uefi/grub2_password
mots_cles:
- demarrage
- grub
- mot de passe
- pbkdf2
- superusers
resume: GRUB protege par un superutilisateur et un mot de passe chiffre. (regle grub2_password, ComplianceAsCode
  0.1.82).
observer:
- commande: head -c0 /boot/grub/grub.cfg || echo 'SENTINELLE:ILLISIBLE'; awk '/^[[:space:]]*set[[:space:]]+superusers=/{s=1}
    /^[[:space:]]*password_pbkdf2[[:space:]].*grub\.pbkdf2\.sha512/{p=1} END{if (!s) print "superusers
    absent"; if (!p) print "password_pbkdf2 absent"}' /boot/grub/grub.cfg
  but: Chercher superusers et password_pbkdf2 dans grub.cfg
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: superusers + password_pbkdf2 grub.pbkdf2.sha512
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: Sans mot de passe GRUB, une personne ayant acces a la console peut modifier les arguments de
    demarrage (par exemple demarrer en mode mono-utilisateur) et obtenir un shell root sans aucun mot
    de passe.
  action: 'grub-mkpasswd-pbkdf2, puis dans /etc/grub.d/40_custom : set superusers="admin" et password_pbkdf2
    admin <empreinte> ; update-grub.'
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
