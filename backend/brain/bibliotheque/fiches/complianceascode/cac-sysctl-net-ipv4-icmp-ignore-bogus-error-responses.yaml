resume: Le parametre noyau net.ipv4.icmp_ignore_bogus_error_responses doit valoir 1, en memoire et de
  facon persistante. (regle sysctl_net_ipv4_icmp_ignore_bogus_error_responses, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.icmp_ignore_bogus_error_responses
  but: Lire la valeur ACTIVE de net.ipv4.icmp_ignore_bogus_error_responses
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.icmp_ignore_bogus_error_responses[[:space:]]*=' /etc/sysctl.conf
    /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.icmp_ignore_bogus_error_responses = 1 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.icmp_ignore_bogus_error_responses = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Ignorer les reponses d'erreur ICMP non conformes evite qu'un attaquant remplisse les journaux
    de messages inutiles pour noyer les evenements importants.
  action: Ecrire « net.ipv4.icmp_ignore_bogus_error_responses = 1 » dans /etc/sysctl.conf (lu en dernier)
    puis appliquer avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.icmp_ignore_bogus_error_responses
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
