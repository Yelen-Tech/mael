id: cac-kernel-config-proc-kcore
titre: Option de compilation du noyau CONFIG_PROC_KCORE = n
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_proc_kcore
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_proc_kcore
mots_cles:
- compilation
- config_proc_kcore
- kcore
- kernel
- noyau
- proc
resume: Le noyau doit etre compile avec CONFIG_PROC_KCORE=n. (regle kernel_config_proc_kcore, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_PROC_KCORE( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_PROC_KCORE is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_PROC_KCORE = n
  bon: '# CONFIG_PROC_KCORE is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: faible
  risque: '/proc/kcore expose la memoire du noyau sous forme de fichier : il aide un attaquant a y trouver
    des cibles.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_PROC_KCORE
    attendu: n
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R15 (niveau eleve)
