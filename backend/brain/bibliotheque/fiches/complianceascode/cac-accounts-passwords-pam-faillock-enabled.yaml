id: cac-accounts-passwords-pam-faillock-enabled
titre: 'PAM : pam_faillock.so dans /etc/pam.d/common-auth (present)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_passwords_pam_faillock_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/locking_out_password_attempts/accounts_passwords_pam_faillock_enabled
mots_cles:
- auth
- authentification
- common
- faillock
- pam
- pam_faillock
resume: /etc/pam.d/common-auth doit appeler pam_faillock.so. (regle accounts_passwords_pam_faillock_enabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*auth[[:space:]].*pam_faillock\.so' /etc/pam.d/common-auth
  but: Lire la ligne pam_faillock.so de /etc/pam.d/common-auth
  lecture: 'Attendu : « auth pam_faillock.so » ; aucune ligne = module absent.'
controles:
- controle: auth pam_faillock.so
  bon: auth pam_faillock.so
  mauvais: module absent, ou option absente / plus faible
  gravite: moyenne
  risque: 'Sans pam_faillock, aucun verrouillage n''intervient apres des echecs successifs : un attaquant
    peut tenter des mots de passe sans limite (force brute).'
  action: Ajouter ou completer la ligne auth ... pam_faillock.so dans /etc/pam.d/common-auth (sur Debian/Ubuntu,
    de preference via pam-auth-update) en gardant une session root ouverte.
  playbook: null
  sans_playbook: 'pile PAM : a modifier avec pam-auth-update et une session root ouverte (une erreur peut
    bloquer toute connexion)'
  evaluation:
  - commande: 0
    lecteur: pam
    comparateur: arguments
    champ: pam_faillock.so
    attendu: []
pieges:
- 'Une erreur dans /etc/pam.d peut bloquer toute connexion : garder une session root ouverte pendant la
  modification.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
