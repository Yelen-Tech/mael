id: cac-kernel-module-jffs2-disabled
titre: Module noyau jffs2 desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_jffs2_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_jffs2_disabled
mots_cles:
- jffs2
- module
- modules
- noyau
resume: Le module noyau jffs2 ne doit pas pouvoir etre charge. (regle kernel_module_jffs2_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Rs 'jffs2' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si jffs2 est interdit de chargement
  lecture: 'Attendu : « install jffs2 /bin/false » (ou /bin/true) et « blacklist jffs2 ».'
- commande: lsmod | grep -w 'jffs2'
  but: Voir si jffs2 est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module jffs2 non chargeable
  bon: install jffs2 /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: faible
  risque: Chaque systeme de fichiers pris en charge est du code du noyau qu'un support piege (cle USB,
    image disque) peut atteindre. Retirer ceux dont on n'a pas besoin reduit la surface d'attaque locale.
  action: Ajouter « install jffs2 /bin/false » et « blacklist jffs2 » dans /etc/modprobe.d/jffs2.conf,
    puis decharger le module.
  playbook: infra.module-interdit
  parametres:
    module: jffs2
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: jffs2
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
pieges:
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
