- idle
- idle-delay
- inactivite
- veille
- verrouillage
resume: 'GNOME : mise en veille apres 900 s d''inactivite au plus (idle-delay). (regle dconf_gnome_screensaver_idle_delay,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s gdm3 >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -EsR '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?idle-delay[[:space:]]*='
    /etc/dconf/db/
  but: Lire idle-delay dans /etc/dconf/db/
  lecture: Valeur de idle-delay ; aucune ligne = non defini.
controles:
- controle: idle-delay entre 1 et 900
  bon: idle-delay=uint32 900
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Un poste laisse ouvert pendant une absence peut etre utilise par n'importe qui. Mettre la session
    en veille apres une courte inactivite (15 minutes au plus) prepare son verrouillage automatique.
  action: Ecrire idle-delay=uint32 900 (section [org/gnome/desktop/session]), verrouiller, puis dconf
    update.
  playbook: null
  sans_playbook: 'fichier a sections ou repertoire (dconf, sssd) : correction manuelle'
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: entre
    champ: idle-delay
    attendu:
    - 1
    - '900'
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
