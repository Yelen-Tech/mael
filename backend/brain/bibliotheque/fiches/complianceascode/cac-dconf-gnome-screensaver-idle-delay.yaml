titre: 'GNOME : mise en veille apres 900 s d''inactivite au plus (idle-delay)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
