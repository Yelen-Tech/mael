resume: 'AppArmor : aucun processus avec profil defini mais non confine. (regle all_apparmor_profiles_in_enforce_complain_mode,
  ComplianceAsCode 0.1.82).'
observer:
- commande: aa-status 2>/dev/null | awk 'NR==1{ok=1} /processes are unconfined but have a profile defined/
    && $1+0 > 0 {print} END{if(!ok) print "SENTINELLE:ILLISIBLE"}'
  but: Compter les processus non confines malgre un profil
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: 0 processus non confine avec profil
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Un processus qui a un profil AppArmor mais tourne sans confinement (lance avant le chargement
    du profil, par exemple) echappe a toute restriction : il faut le redemarrer sous son profil.'
  action: Charger les profils (aa-enforce ou aa-complain /etc/apparmor.d/*) puis redemarrer les processus
    concernes.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
