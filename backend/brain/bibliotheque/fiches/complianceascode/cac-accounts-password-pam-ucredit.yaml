id: cac-accounts-password-pam-ucredit
titre: 'Mots de passe : majuscules exigees dans les mots de passe (ucredit au plus -1)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_password_pam_ucredit
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_ucredit
mots_cles:
- complexite
- dans
- exigees
- majuscules
- mot de passe
- mots
- mots de passe
- pam
- passe
- politique
- pwquality
- ucredit
resume: pwquality doit imposer ucredit au plus -1 (majuscules exigees dans les mots de passe). (regle
  accounts_password_pam_ucredit, ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*ucredit[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de ucredit configuree pour pwquality
  lecture: « ucredit = N » ; aucune ligne = valeur par defaut du module (0).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: ucredit au plus -1
  bon: ucredit au plus -1, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: Un mot de passe complexe resiste plus longtemps aux attaques par devinette et par force brute.
    Exiger au moins une majuscule agrandit l'espace des combinaisons a tester.
  action: Ecrire « ucredit = -1 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: ucredit
    valeur: '-1'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: au_plus
    champ: ucredit
    attendu: '-1'
    defaut: '0'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.2.3 (niveau 1)
- nom: CIS
