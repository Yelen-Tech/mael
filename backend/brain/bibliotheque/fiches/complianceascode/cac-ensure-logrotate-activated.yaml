resume: logrotate tourne periodiquement (rotation quotidienne). (regle ensure_logrotate_activated, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*daily' /etc/logrotate.conf
  but: Lire la frequence de rotation par defaut
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: rotation daily dans logrotate.conf
  bon: une ligne « daily »
  mauvais: autre frequence
  gravite: moyenne
  risque: 'Des journaux qui ne tournent pas grossissent jusqu''a remplir la partition de /var/log : les
    nouveaux evenements, souvent ceux d''une attaque en cours, ne sont plus enregistres.'
  action: Ecrire « daily » dans /etc/logrotate.conf (et verifier logrotate.timer ou cron.daily).
