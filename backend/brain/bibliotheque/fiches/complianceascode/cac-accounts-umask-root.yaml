resume: 'umask de root (/root/.bashrc, /root/.profile : 0027 ou plus strict). (regle accounts_umask_root,
  ComplianceAsCode 0.1.82).'
observer:
- commande: head -c0 /root/.bashrc || echo 'SENTINELLE:ILLISIBLE'; grep -Es '^[[:space:]]*umask[[:space:]]'
    /root/.bashrc /root/.profile
  but: Lire umask dans /root/.bashrc, /root/.profile
  lecture: Valeur de umask ; aucune ligne = non defini.
controles:
- controle: umask de root au moins aussi strict que 0027
  bon: umask 0027
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Le umask determine les droits appliques aux fichiers a leur creation. Un umask mal configure
    peut donner a des fichiers des droits excessifs, lisibles ou inscriptibles par des utilisateurs non
    autorises.
  action: Ecrire « umask 0027 » dans /root/.bashrc ou /root/.profile.
  playbook: infra.cle-valeur
  parametres:
    fichier: /root/.bashrc
    cle: umask
    valeur: '0027'
    format: espace
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: umask
    champ: umask
    attendu: '0027'
    sep: espace
pieges:
- '/root n''est lisible que par root : lancer la lecture avec sudo (sinon aucune ligne, a ne pas prendre
