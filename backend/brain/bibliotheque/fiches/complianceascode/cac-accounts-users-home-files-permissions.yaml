resume: Fichiers des repertoires personnels en 0750 au plus (hors fichiers caches). (regle accounts_users_home_files_permissions,
  ComplianceAsCode 0.1.82).
observer:
- commande: find /home -mindepth 2 -xdev ! -path '*/.*' -perm /0027 -printf '%m %p\n' 2>/dev/null
  but: Chercher les fichiers trop ouverts sous /home
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: pas d'ecriture groupe ni d'acces pour les autres
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Des droits excessifs sur les fichiers des repertoires personnels permettent a des utilisateurs
    tiers de les lire ou de les modifier.
  action: chmod 0750 /home/UTILISATEUR/FICHIER (ou g-w,o-rwx).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
