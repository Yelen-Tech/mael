id: cac-audit-rules-session-events-utmp
titre: Audit des modifications de /var/run/utmp
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: audit_rules_session_events_utmp
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_rules_session_events_utmp
mots_cles:
- audit
- auditctl
- auditd
- journalisation
- modification
- surveillance
- temporaire
- tracabilite
- utmp
resume: Toute ecriture ou changement d'attribut de /var/run/utmp doit etre trace par auditd (-w /var/run/utmp
  -p wa). (regle audit_rules_session_events_utmp, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -w /var/run/utmp -p wa
  bon: regle -w /var/run/utmp -p wa chargee et persistante
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: 'Ces fichiers enregistrent connexions et echecs de connexion : une modification manuelle peut
    signaler un attaquant qui efface les traces de son intrusion.'
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -w /var/run/utmp -p wa -k mael
  evaluation:
  - lecteur: audit
    comparateur: surveille
    champ: /var/run/utmp
    attendu: wa
    commande: 0
  - lecteur: audit
    comparateur: surveille
    champ: /var/run/utmp
    attendu: wa
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R73 (niveau renforce)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
