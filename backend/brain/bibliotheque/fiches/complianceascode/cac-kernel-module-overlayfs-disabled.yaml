id: cac-kernel-module-overlayfs-disabled
titre: Module noyau overlay desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==24.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_overlayfs_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_overlayfs_disabled
mots_cles:
- module
- modules
- noyau
- overlay
resume: Le module noyau overlay ne doit pas pouvoir etre charge. (regle kernel_module_overlayfs_disabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs 'overlay' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si overlay est interdit de chargement
  lecture: 'Attendu : « install overlay /bin/false » (ou /bin/true) et « blacklist overlay ».'
- commande: lsmod | grep -w 'overlay'
  but: Voir si overlay est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module overlay non chargeable
  bon: install overlay /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: faible
  risque: 'overlayfs a connu plusieurs failles d''elevation de privileges : sans conteneurs, le desactiver
    retire cette surface d''attaque.'
  action: Ajouter « install overlay /bin/false » et « blacklist overlay » dans /etc/modprobe.d/overlay.conf,
    puis decharger le module.
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: overlay
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
  sans_playbook: 'overlay est necessaire a Docker, containerd et Podman : a decider selon l''usage'
pieges:
- 'Desactiver overlay casse tous les conteneurs (Docker, containerd, Podman) : verifier qu''aucun n''est
  utilise avant.'
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.1.1.6 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.1.1.6 (niveau 2)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
