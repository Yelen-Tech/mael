id: cac-set-ufw-loopback-traffic
titre: 'ufw : trafic de boucle locale (lo) autorise, 127.0.0.0/8 refuse ailleurs (si ufw est l''outil
  retenu)'
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: set_ufw_loopback_traffic
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ufw/set_ufw_loopback_traffic
mots_cles:
- boucle locale
- lo
- loopback
- ufw
resume: 'ufw : trafic de boucle locale (lo) autorise, 127.0.0.0/8 refuse ailleurs. (regle set_ufw_loopback_traffic,
  ComplianceAsCode 0.1.82).'
observer:
- commande: ufw status verbose
  but: Lire les regles d'ufw
  lecture: 'Attendu : allow in/out on lo, deny in from 127.0.0.0/8 et ::1.'
controles:
- controle: regles de boucle locale presentes
  bon: 4 regles de boucle locale
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Le trafic de boucle locale est genere entre processus de la machine et est essentiel a son
    fonctionnement. La boucle locale est le seul endroit ou ce trafic doit apparaitre : les autres interfaces
    doivent l''ignorer, comme mesure anti-usurpation.'
  action: ufw allow in on lo ; ufw allow out on lo ; ufw deny in from 127.0.0.0/8 ; ufw deny in from ::1
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si ufw est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
