id: cac-kernel-config-retpoline
titre: Option de compilation du noyau CONFIG_RETPOLINE = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_retpoline
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_retpoline
mots_cles:
- compilation
- config_retpoline
- kernel
- noyau
- retpoline
resume: Le noyau doit etre compile avec CONFIG_RETPOLINE=y. (regle kernel_config_retpoline, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_(MITIGATION_)?RETPOLINE( is not set|=)' /boot/config-$(uname
    -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_RETPOLINE=y ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_RETPOLINE = y
  bon: CONFIG_RETPOLINE=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: Les retpolines sont la protection du noyau contre Spectre variante 2 (injection dans la prediction
    des branchements indirects).
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_RETPOLINE
    attendu: y
    noms:
    - CONFIG_RETPOLINE
    - CONFIG_MITIGATION_RETPOLINE
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
- 'Depuis le noyau 6.9 l''option s''appelle CONFIG_MITIGATION_RETPOLINE : les deux noms sont lus.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R15 (niveau eleve)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
