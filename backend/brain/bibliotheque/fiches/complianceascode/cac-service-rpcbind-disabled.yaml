id: cac-service-rpcbind-disabled
titre: Service rpcbind desactive et arrete
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_rpcbind_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/nfs_and_rpc/disabling_nfs/disabling_nfs_services/service_rpcbind_disabled
mots_cles:
- demarrage
- rpcbind
- service
- services
- systemd
resume: Le service rpcbind doit etre desactive et arrete. (regle service_rpcbind_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled rpcbind.service 2>/dev/null; systemctl is-active rpcbind.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de rpcbind
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service rpcbind disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: faible
  risque: Si le systeme n'utilise pas de services bases sur rpc, desactiver rpcbind est recommande pour
    reduire la surface d'attaque.
  action: systemctl disable --now rpcbind.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: rpcbind
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.12 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.12 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.12 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
