id: cac-kernel-config-hardened-usercopy
titre: Option de compilation du noyau CONFIG_HARDENED_USERCOPY = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_hardened_usercopy
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_hardened_usercopy
mots_cles:
- compilation
- config_hardened_usercopy
- hardened
- kernel
- noyau
- usercopy
resume: Le noyau doit etre compile avec CONFIG_HARDENED_USERCOPY=y. (regle kernel_config_hardened_usercopy,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_HARDENED_USERCOPY( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_HARDENED_USERCOPY=y ». La ligne « # Linux/... » donne l''architecture ;
    option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_HARDENED_USERCOPY = y
  bon: CONFIG_HARDENED_USERCOPY=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: elevee
  risque: 'Verifie les limites des copies entre noyau et espace utilisateur : bloque des familles entieres
    de debordements de tas et de fuites de memoire du noyau. Le mode de repli (fallback) ne fait qu''avertir
    au lieu de bloquer : il doit etre desactive.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_HARDENED_USERCOPY
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R15 (niveau eleve)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
