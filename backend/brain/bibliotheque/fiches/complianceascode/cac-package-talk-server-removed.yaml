  risque: Le logiciel talk presente un risque de securite car ses protocoles de communication ne sont
    pas chiffres. Retirer le paquet talk-server diminue le risque d'activation accidentelle ou intentionnelle
    des services talk.
  action: Desinstaller talk-server (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: talk-server
