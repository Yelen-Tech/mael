id: cac-ntp-single-service-active
titre: Un seul service de synchronisation de l'heure actif
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: ntp_single_service_active
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/ntp_single_service_active
mots_cles:
- chrony
- heure
- ntp
- synchronisation
- timesyncd
resume: Un seul service de synchronisation de l'heure actif. (regle ntp_single_service_active, ComplianceAsCode
  0.1.82).
observer:
- commande: 'systemctl is-active chrony systemd-timesyncd ntp 2>/dev/null | awk ''$1=="active"{n++} END{if
    (n != 1) print n+0" service(s) de synchronisation actif(s), attendu : 1"}'''
  but: Compter les services de synchronisation de l'heure actifs
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: exactement un service actif
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Deux services de synchronisation actifs se contredisent et rendent l'heure instable ; aucun
    service laisse l'horloge deriver. Un seul doit etre actif.
  action: Garder chrony OU systemd-timesyncd et desactiver l'autre (systemctl disable --now).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
