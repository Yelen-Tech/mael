id: cac-accounts-passwords-pam-faillock-interval
titre: 'Verrouillage apres echecs : fenetre de comptage des echecs (s) (fail_interval au moins 900)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: null
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_passwords_pam_faillock_interval
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/locking_out_password_attempts/accounts_passwords_pam_faillock_interval
mots_cles:
- authentification
- echecs
- fail
- fail_interval
- faillock
- force brute
- interval
- pam
- verrouillage
resume: pam_faillock doit avoir fail_interval au moins 900. (regle accounts_passwords_pam_faillock_interval,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*fail_interval[[:space:]]*=' /etc/security/faillock.conf
  but: Lire fail_interval dans faillock.conf
  lecture: « fail_interval = N » ; aucune ligne = valeur par defaut (900).
- commande: grep -Es '^[[:space:]]*auth[[:space:]].*pam_faillock\.so' /etc/pam.d/common-auth
  but: Verifier que pam_faillock est utilise
  lecture: Lignes « auth ... pam_faillock.so preauth / authfail » ; aucune = verrouillage inactif.
controles:
- controle: fail_interval au moins 900
  bon: fail_interval au moins 900, pam_faillock actif
  mauvais: valeur hors bornes, ou pam_faillock non utilise
  gravite: moyenne
  risque: Limiter le nombre d'echecs de connexion en verrouillant le compte reduit le risque d'acces non
    autorise par devinette du mot de passe (force brute).
  action: Ecrire « fail_interval = 900 » dans /etc/security/faillock.conf et activer pam_faillock (pam-auth-update
    sur Debian/Ubuntu).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/faillock.conf
    cle: fail_interval
    valeur: '900'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: entre
    champ: fail_interval
    attendu:
    - 900
    - null
    defaut: '900'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- Un argument sur la ligne pam_faillock.so (ex. deny=5) l'emporte sur faillock.conf.
- Verrouiller trop vite (deny faible) facilite le deni de service sur les comptes.
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R31 (niveau minimal)
verifie_le: '2026-09-18'
relu_par: Yelen Tech
