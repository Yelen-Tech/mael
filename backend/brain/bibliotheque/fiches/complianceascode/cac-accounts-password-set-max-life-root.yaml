id: cac-accounts-password-set-max-life-root
titre: 'Mot de passe de root : duree de vie maximale (365 jours au plus)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: authentification
  type_controle: detection
  niveaux:
    cis: null
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_password_set_max_life_root
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/password_expiration/accounts_password_set_max_life_root
mots_cles:
- chage
- expiration
- root
- shadow
resume: 'Mot de passe de root : duree de vie maximale (365 jours au plus). (regle accounts_password_set_max_life_root,
  ComplianceAsCode 0.1.82).'
observer:
- commande: 'awk -F: ''$1 == "root" && $2 ~ /^\$/ && ($5 == "" || $5 < 1 || $5 > 365) {print $1" "$5}''
    /etc/shadow || echo ''SENTINELLE:ILLISIBLE'''
  but: Lire la duree maximale du mot de passe de root
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: duree maximale de root entre 1 et 365
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Tout mot de passe finit par pouvoir etre casse ou divulgue : sans duree de vie maximale sur
    les comptes existants, un mot de passe compromis reste valable indefiniment. Modifier login.defs ne
    change pas les comptes deja crees.'
  action: chage -M 365 root
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R31 (niveau minimal)
