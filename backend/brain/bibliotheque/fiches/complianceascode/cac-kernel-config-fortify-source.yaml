id: cac-kernel-config-fortify-source
titre: Option de compilation du noyau CONFIG_FORTIFY_SOURCE = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_fortify_source
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_fortify_source
mots_cles:
- compilation
- config_fortify_source
- fortify
- kernel
- noyau
- source
resume: Le noyau doit etre compile avec CONFIG_FORTIFY_SOURCE=y. (regle kernel_config_fortify_source,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_FORTIFY_SOURCE( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_FORTIFY_SOURCE=y ». La ligne « # Linux/... » donne l''architecture ; option
    absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_FORTIFY_SOURCE = y
  bon: CONFIG_FORTIFY_SOURCE=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: 'Ajoute des controles de taille aux fonctions de copie de memoire et de chaines du noyau : certains
    debordements sont bloques a la compilation ou a l''execution.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_FORTIFY_SOURCE
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
