id: cac-package-sssd-installed
titre: Paquet sssd installe
domaine: paquets
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: paquets
  type_controle: paquet-present
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: package_sssd_installed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/sssd/package_sssd_installed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- sssd
resume: Le paquet sssd doit etre installe. (regle package_sssd_installed, ComplianceAsCode 0.1.82).
observer:
- commande: grep -qsE 'pam_(sss|ldap|krb5)' /etc/pam.d/common-auth || echo 'SENTINELLE:SANS_OBJET'; dpkg-query
    -W -f='${binary:Package} ${Status}\n' sssd 2>/dev/null
  but: Savoir si sssd est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
  variantes:
    rhel: rpm -q sssd
controles:
- controle: paquet sssd installe
  bon: installe
  mauvais: absent
  gravite: moyenne
  risque: 'Quand l''authentification passe par un annuaire (IPA, AD, LDAP), sssd permet de la chiffrer
    et de verifier le serveur : sans lui, des identifiants peuvent circuler en clair ou etre envoyes a
    un faux annuaire.'
  action: Installer sssd avec le gestionnaire de paquets.
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: installe
    attendu:
    - sssd
  sans_playbook: 'installer sssd ne sert qu''avec un annuaire a configurer (IPA, AD, LDAP) : decision
    et configuration humaines'
pieges:
- 'Installer sssd seul ne securise rien : il faut le configurer vers l''annuaire (TLS, validation du certificat).'
- 'ANSSI R67 ne vise que l''authentification par annuaire distant (IPA, AD, LDAP) : sans module PAM distant,
  la regle est sans objet.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R67 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
