id: cac-sshd-set-login-grace-time
titre: 'SSH : delai accorde pour s''authentifier (LoginGraceTime 60)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_set_login_grace_time
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_set_login_grace_time
mots_cles:
- authentification
- connexion
- delai
- grace
- login
- logingracetime
- ssh
- sshd
- time
- timeout
resume: La directive sshd LoginGraceTime doit valoir « 60 » (regle sshd_set_login_grace_time, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^logingracetime '
  but: Lire la valeur EFFECTIVE de LoginGraceTime
  lecture: 'Attendu : « logingracetime N » avec 1 <= N <= 60. Une valeur plus stricte est conforme.'
- commande: grep -Ris '^[[:space:]]*LoginGraceTime[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou LoginGraceTime est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: LoginGraceTime <= 60
  bon: LoginGraceTime entre 1 et 60
  mauvais: 0, absent avec un defaut plus eleve, ou superieur a 60
  gravite: moyenne
  risque: Un delai court pour s'authentifier limite la force brute et le nombre de connexions non authentifiees
    simultanees.
  action: Definir « LoginGraceTime 60 » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: LoginGraceTime
    valeur: '60'
  evaluation:
  - comparateur: max
    attendu: '60'
    commande: 0
    lecteur: sshd_t
    champ: logingracetime
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- 'Regle Sentinelle : la source exige exactement 60 ; une valeur plus stricte (entre 1 et 60) est acceptee.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.13 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.13 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.13 (niveau 1)
verifie_le: '2026-09-17'
relu_par: assistant IA (Claude), par delegation du responsable du projet
