resume: Audit des modifications de l'environnement reseau (nom d'hote, /etc/hosts, /etc/issue...). (regle
  audit_rules_networkconfig_modification, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -w /etc/issue -p wa; -w /etc/issue.net -p wa; -w /etc/hosts -p wa; -w /etc/networks -p wa;
    -w /etc/network/ -p wa; -a always,exit -S sethostname; -a always,exit -S setdomainname
  bon: toutes les regles chargees et persistantes
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: 'L''environnement reseau (nom d''hote, /etc/hosts, /etc/issue...) ne doit changer que par action
    de l''administrateur : toute modification doit etre tracee.'
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -w /etc/issue -p wa -k mael | -w /etc/issue.net -p wa -k mael | -w /etc/hosts -p wa -k mael
      | -w /etc/networks -p wa -k mael | -w /etc/network/ -p wa -k mael | -a always,exit -F arch=b32 -S
      sethostname -k mael | -a always,exit -F arch=b64 -S sethostname -k mael | -a always,exit -F arch=b32
      -S setdomainname -k mael | -a always,exit -F arch=b64 -S setdomainname -k mael
  evaluation:
