resume: Le parametre noyau kernel.randomize_va_space doit valoir 2, en memoire et de facon persistante.
  (regle sysctl_kernel_randomize_va_space, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.randomize_va_space
  but: Lire la valeur ACTIVE de kernel.randomize_va_space
  lecture: 'Attendu : 2.'
- commande: grep -Rs '^[[:space:]]*kernel\.randomize_va_space[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.randomize_va_space = 2 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.randomize_va_space = 2
  bon: 2 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: La randomisation de l'espace d'adressage (ASLR) empeche un attaquant de prevoir ou se trouvent
    son code injecte et le code existant qu'il voudrait reutiliser (ROP).
  action: Ecrire « kernel.randomize_va_space = 2 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: kernel.randomize_va_space
    valeur: '2'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '2'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.randomize_va_space
    attendu: '2'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
