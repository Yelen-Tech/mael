observer:
- commande: head -c0 /etc/audit/auditd.conf || echo 'SENTINELLE:ILLISIBLE'; grep -Es '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?disk_error_action[[:space:]]*='
    /etc/audit/auditd.conf
  but: Lire disk_error_action dans /etc/audit/auditd.conf
  lecture: Valeur de disk_error_action ; aucune ligne = non defini.
controles:
- controle: disk_error_action dans syslog|single|halt
  bon: une des valeurs syslog|single|halt
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Reagir a une erreur ou a un remplissage du disque d'audit (arret ou mode maintenance) evite
    de perdre des traces d'audit sans le savoir.
  action: Ecrire « disk_error_action = VALEUR » (une de syslog|single|halt) dans /etc/audit/auditd.conf,
    puis redemarrer auditd.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/audit/auditd.conf
    cle: disk_error_action
    valeur: syslog
    format: egal_espaces
