id: cac-accounts-password-set-max-life-existing
titre: 'Mots de passe existants : duree de vie maximale (365 jours au plus)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_set_max_life_existing
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/password_expiration/accounts_password_set_max_life_existing
mots_cles:
- chage
- existants
- expiration
- mots de passe
- shadow
resume: 'Mots de passe existants : duree de vie maximale (365 jours au plus). (regle accounts_password_set_max_life_existing,
  ComplianceAsCode 0.1.82).'
observer:
- commande: 'awk -F: ''$2 ~ /^\$/ && ($5 == "" || $5 < 1 || $5 > 365) {print $1" "$5}'' /etc/shadow ||
    echo ''SENTINELLE:ILLISIBLE'''
  but: Lister les comptes a mot de passe dont la duree maximale est trop longue
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: 5e champ de /etc/shadow entre 1 et 365
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Tout mot de passe finit par pouvoir etre casse ou divulgue : sans duree de vie maximale sur
    les comptes existants, un mot de passe compromis reste valable indefiniment. Modifier login.defs ne
    change pas les comptes deja crees.'
  action: chage -M 365 COMPTE pour chaque compte liste.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
