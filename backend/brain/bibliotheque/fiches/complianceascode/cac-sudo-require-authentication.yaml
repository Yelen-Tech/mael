id: cac-sudo-require-authentication
titre: 'sudo : pas de NOPASSWD ni de !authenticate'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: sudo
  type_controle: detection
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: sudo_require_authentication
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/sudo/sudo_require_authentication
mots_cles:
- nopasswd
- sans mot de passe
- sudo
- sudoers
resume: 'sudo : pas de NOPASSWD ni de !authenticate. (regle sudo_require_authentication, ComplianceAsCode
  0.1.82).'
observer:
- commande: head -c0 /etc/sudoers || echo 'SENTINELLE:ILLISIBLE'; grep -riEs '^[^#]*(nopasswd|!authenticate)'
    /etc/sudoers /etc/sudoers.d/
  but: Chercher NOPASSWD et !authenticate dans la configuration de sudo
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucune ligne NOPASSWD ou !authenticate
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Sans nouvelle authentification (NOPASSWD, !authenticate, delai trop long), quiconque prend le
    controle d'une session ouverte devient root sans connaitre le mot de passe.
  action: Retirer NOPASSWD / !authenticate avec visudo (prevoir l'impact sur les scripts d'automatisation).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Les images cloud donnent souvent NOPASSWD au compte par defaut (ex. ubuntu) : ecart frequent, a traiter
  avec l''exploitant.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
