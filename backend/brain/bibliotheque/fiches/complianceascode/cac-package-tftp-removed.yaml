id: cac-package-tftp-removed
titre: Paquet tftp absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: null
    anssi: minimal
source:
  origine: complianceascode
  regle: package_tftp_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/tftp/package_tftp_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- tftp
resume: Le paquet tftp doit etre absent. (regle package_tftp_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' tftp 2>/dev/null
  but: Savoir si tftp est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
  variantes:
    rhel: rpm -q tftp
controles:
- controle: paquet tftp absent
  bon: absent
  mauvais: installe
  gravite: faible
  risque: Retirer TFTP est recommande, sauf besoin specifique (par exemple un serveur d'amorcage). Dans
    ce cas, configurer les services avec beaucoup de prudence.
  action: Desinstaller tftp (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: tftp
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - tftp
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
