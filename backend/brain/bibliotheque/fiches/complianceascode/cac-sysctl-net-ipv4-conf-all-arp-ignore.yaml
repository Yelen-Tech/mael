resume: Le parametre noyau net.ipv4.conf.all.arp_ignore doit valoir 2, en memoire et de facon persistante.
  (regle sysctl_net_ipv4_conf_all_arp_ignore, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.conf.all.arp_ignore
  but: Lire la valeur ACTIVE de net.ipv4.conf.all.arp_ignore
  lecture: 'Attendu : 2.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.conf\.all\.arp_ignore[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.conf.all.arp_ignore = 2 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.conf.all.arp_ignore = 2
  bon: 2 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Ne repondre aux requetes ARP que pour une adresse de l'interface qui les recoit, et du meme
    sous-reseau, evite de devoiler les autres adresses de la machine et les confusions entre interfaces.
    A etudier selon l'usage de la machine.
  action: Ecrire « net.ipv4.conf.all.arp_ignore = 2 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.conf.all.arp_ignore
    valeur: '2'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '2'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv4.conf.all.arp_ignore
    attendu: '2'
    precedence: sysctl
pieges:
