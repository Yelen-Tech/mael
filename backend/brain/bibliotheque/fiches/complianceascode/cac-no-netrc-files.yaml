resume: Aucun fichier .netrc (mots de passe FTP en clair). (regle no_netrc_files, ComplianceAsCode 0.1.82).
observer:
- commande: find /home -xdev -name .netrc 2>/dev/null
  but: Chercher les fichiers .netrc
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun .netrc
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Des mots de passe non chiffres pour des serveurs FTP distants peuvent etre stockes dans les
    fichiers .netrc.
  action: Supprimer les fichiers .netrc (ils peuvent contenir des mots de passe en clair).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
