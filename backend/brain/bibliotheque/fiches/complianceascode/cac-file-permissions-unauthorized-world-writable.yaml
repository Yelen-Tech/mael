- droits
- fichiers
- modifiable par tous
- world-writable
resume: Aucun fichier modifiable par tout le monde. (regle file_permissions_unauthorized_world_writable,
  ComplianceAsCode 0.1.82).
observer:
- commande: find / -xdev -type f -perm -0002 2>/dev/null
  but: Chercher les fichiers modifiables par tous (partition racine)
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun fichier en ecriture pour les autres
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Les donnees d'un fichier modifiable par tous peuvent etre modifiees par n'importe quel utilisateur.
    Dans presque tous les cas, une combinaison de droits utilisateur et de groupe suffit a l'acces legitime,
    sans le risque des fichiers modifiables par tous.
  action: chmod o-w FICHIER (apres verification de l'application concernee).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- '-xdev limite la recherche a la partition racine : relancer pour chaque partition locale (findmnt).'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
