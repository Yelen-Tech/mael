id: cac-file-permissions-unauthorized-world-writable
titre: Aucun fichier modifiable par tout le monde
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: fichiers-systeme
  type_controle: detection
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: file_permissions_unauthorized_world_writable
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/file_permissions_unauthorized_world_writable
