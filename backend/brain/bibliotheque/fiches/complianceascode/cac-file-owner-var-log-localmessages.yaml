id: cac-file-owner-var-log-localmessages
titre: 'Proprietaire des fichiers motif .*localmessages.* de /var/log/ : syslog ou root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: proprietaire-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_owner_var_log_localmessages
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_owner_var_log_localmessages
mots_cles:
- chown
- fichier
- fichiers
- localmessages
- motif
- proprietaire
resume: 'Proprietaire des fichiers motif .*localmessages.* de /var/log/ : syslog ou root : proprietaire
  syslog ou root. (regle file_owner_var_log_localmessages, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -maxdepth 1 -type f -regextype posix-extended -regex '.*localmessages.*' -printf
    '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu syslog ou root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = syslog ou root
  bon: proprietaire syslog ou root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'localmessages recoit les messages de certains scripts de demarrage, dont le client DHCP : a
    reserver au personnel autorise.'
  action: chown syslog ou root sur les fichiers concernes.
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*localmessages.*
    nature: proprietaire
    valeur: syslog
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - root
    - syslog
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
