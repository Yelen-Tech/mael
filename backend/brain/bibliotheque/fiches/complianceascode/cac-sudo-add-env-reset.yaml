- sudoers
resume: La configuration de sudo doit contenir « Defaults env_reset ». (regle sudo_add_env_reset, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Rhs '^[[:space:]]*Defaults' /etc/sudoers /etc/sudoers.d/
  but: Lire les options globales de sudo
  lecture: 'Attendu : une ligne contenant env_reset ; « !env_reset » = desactive.'
controles:
- controle: Defaults env_reset
  bon: Defaults env_reset
  mauvais: option absente ou desactivee
  gravite: moyenne
  risque: Sans remise a zero de l'environnement, des variables choisies par l'utilisateur (LD_PRELOAD,
    PATH...) passent a la commande executee en root et peuvent la detourner ou faire fuir des informations.
  action: Ajouter « Defaults env_reset » avec visudo -f /etc/sudoers.d/sentinelle (jamais d'edition directe).
  playbook: infra.sudo-defaults
  parametres:
    option: env_reset
  evaluation:
  - commande: 0
    lecteur: sudo_defaults
    comparateur: option
    champ: env_reset
pieges:
- '/etc/sudoers n''est lisible que par root : lancer la lecture avec sudo.'
- 'Une erreur de syntaxe dans sudoers bloque sudo : toujours passer par visudo.'
