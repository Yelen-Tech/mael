source:
  origine: complianceascode
  regle: sudo_add_env_reset
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/sudo/sudo_add_env_reset
mots_cles:
