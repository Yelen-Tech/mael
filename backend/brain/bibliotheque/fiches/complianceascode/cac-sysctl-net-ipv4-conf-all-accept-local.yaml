observer:
- commande: sysctl -n net.ipv4.conf.all.accept_local
  but: Lire la valeur ACTIVE de net.ipv4.conf.all.accept_local
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.conf\.all\.accept_local[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.conf.all.accept_local = 0 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.conf.all.accept_local = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Refuser les paquets venus de l'exterieur avec une adresse source locale (127.0.0.0/8) empeche
    un attaquant de se faire passer pour la machine elle-meme aupres de ses propres services.
  action: Ecrire « net.ipv4.conf.all.accept_local = 0 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.conf.all.accept_local
    valeur: '0'
  evaluation:
  - commande: 0
