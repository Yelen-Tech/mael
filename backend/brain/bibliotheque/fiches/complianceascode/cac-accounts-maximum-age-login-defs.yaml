id: cac-accounts-maximum-age-login-defs
titre: 'Mots de passe : duree de vie maximale (PASS_MAX_DAYS au plus 365)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_maximum_age_login_defs
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/password_expiration/accounts_maximum_age_login_defs
mots_cles:
- days
- duree de vie
- expiration
- login.defs
- mots de passe
- pass
- pass_max_days
resume: 'Mots de passe : duree de vie maximale (PASS_MAX_DAYS au plus 365). (regle accounts_maximum_age_login_defs,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -Es '^[[:space:]]*PASS_MAX_DAYS[[:space:]]' /etc/login.defs
  but: Lire PASS_MAX_DAYS dans /etc/login.defs
  lecture: Valeur de PASS_MAX_DAYS ; aucune ligne = non defini.
controles:
- controle: PASS_MAX_DAYS entre 1 et 365
  bon: PASS_MAX_DAYS 365 ou moins
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Tout mot de passe finit par pouvoir etre casse ou divulgue. Sans duree de vie maximale, un mot
    de passe compromis reste valable indefiniment. A l'inverse, une duree trop courte pousse les utilisateurs
    a noter leur mot de passe.
  action: Ecrire « PASS_MAX_DAYS 365 » dans /etc/login.defs (comptes nouveaux ; chage -M pour les existants).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/login.defs
    cle: PASS_MAX_DAYS
    valeur: '365'
    format: espace
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: entre
    champ: PASS_MAX_DAYS
    attendu:
    - 1
    - '365'
    sep: espace
pieges:
- 'login.defs ne s''applique qu''aux comptes CREES ensuite : voir aussi la fiche des mots de passe existants
  (chage).'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
