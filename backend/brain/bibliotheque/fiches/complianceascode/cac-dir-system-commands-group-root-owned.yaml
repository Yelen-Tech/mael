id: cac-dir-system-commands-group-root-owned
titre: Les repertoires de commandes systeme ont le groupe root
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: detection
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: dir_system_commands_group_root_owned
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/dir_system_commands_group_root_owned
mots_cles:
- /usr/bin
- binaires
- commandes
- groupe
- repertoires
resume: Les repertoires de commandes systeme ont le groupe root. (regle dir_system_commands_group_root_owned,
  ComplianceAsCode 0.1.82).
observer:
- commande: find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin ! -group root -type d
    -printf '%g %p\n' 2>/dev/null
  but: Chercher les repertoires de commandes hors du groupe root
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: groupe root
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Les repertoires des commandes systeme (/usr/bin, /usr/sbin...) doivent appartenir a root :
    un autre compte pourrait y remplacer une commande par un programme piege, execute ensuite par les
    administrateurs et les services.'
  action: chgrp root REPERTOIRE
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
