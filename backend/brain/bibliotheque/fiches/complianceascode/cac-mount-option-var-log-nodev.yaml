id: cac-mount-option-var-log-nodev
titre: Option nodev sur /var/log
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: option-montage
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: mount_option_var_log_nodev
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/partitions/mount_option_var_log_nodev
mots_cles:
- montage
- nodev
- option
- partition
resume: /var/log doit etre monte avec l'option nodev. (regle mount_option_var_log_nodev, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /var/log
  but: Lire les options de montage ACTIVES de /var/log
  lecture: La colonne des options doit contenir nodev. Aucune ligne = pas de montage separe.
- commande: grep -E '[[:space:]]/var/log[[:space:]]' /etc/fstab
  but: Verifier la configuration PERSISTANTE
  lecture: La 4e colonne doit contenir nodev.
controles:
- controle: /var/log monte avec nodev
  bon: nodev present (actif et dans /etc/fstab)
  mauvais: nodev absent
  gravite: moyenne
  risque: 'Les fichiers de peripherique n''ont leur place que dans /dev : l''option nodev empeche d''en
    creer sur la partition des journaux pour contourner les droits d''acces au materiel.'
  action: Ajouter nodev aux options de /var/log dans /etc/fstab puis remonter (mount -o remount /var/log).
  playbook: infra.montage-option
  parametres:
    point: /var/log
    option: nodev
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: option_presente
    attendu: nodev
  - commande: 1
    lecteur: fstab
    comparateur: option_presente
    attendu: nodev
pieges:
- 'Si /var/log n''est pas une partition separee, cette regle ne peut pas s''appliquer telle quelle : voir
  la regle de partition dediee.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.1.2.6.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 1.1.2.6.2 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 1.1.2.6.2 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
