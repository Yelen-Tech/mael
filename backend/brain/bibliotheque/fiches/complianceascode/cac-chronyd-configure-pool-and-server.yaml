- server
resume: 'chrony : serveurs de temps configures (server / pool). (regle chronyd_configure_pool_and_server,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s chrony >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -hEs '^(server|pool)[[:space:]]'
    /etc/chrony/chrony.conf /etc/chrony/sources.d/*.sources /etc/chrony/conf.d/*.conf
  but: Lire les sources de temps de chrony
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: au moins une ligne server ou pool
  bon: une ligne server/pool
  mauvais: aucune source de temps
  gravite: moyenne
  risque: 'Sans serveur de temps configure, chrony ne synchronise rien : l''horloge derive, les journaux
    ne concordent plus entre machines et l''analyse d''un incident devient impossible.'
  action: Ajouter « pool SERVEUR iburst » (ou server) dans /etc/chrony/sources.d/, puis redemarrer chrony.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
