id: cac-package-cups-removed
titre: Paquet cups absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: package_cups_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/printing/package_cups_removed
mots_cles:
- cups
- installe
- logiciel
- paquet
- paquets
resume: Le paquet cups doit etre absent. (regle package_cups_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' cups 2>/dev/null
  but: Savoir si cups est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet cups absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: Si le systeme n'a pas besoin d'imprimer ni d'accepter des travaux d'impression venant d'autres
    systemes, retirer CUPS est recommande pour reduire la surface d'attaque potentielle.
  action: Desinstaller cups (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: cups
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - cups
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.11 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.11 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.11 (niveau 1)
