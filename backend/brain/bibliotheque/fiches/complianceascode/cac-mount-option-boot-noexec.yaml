id: cac-mount-option-boot-noexec
titre: Option noexec sur /boot
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: montage
  type_controle: option-montage
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: mount_option_boot_noexec
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/partitions/mount_option_boot_noexec
mots_cles:
- boot
- montage
- noexec
- option
- partition
resume: /boot doit etre monte avec l'option noexec. (regle mount_option_boot_noexec, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /boot
  but: Lire les options de montage ACTIVES de /boot
  lecture: La colonne des options doit contenir noexec. Aucune ligne = pas de montage separe.
- commande: grep -E '[[:space:]]/boot[[:space:]]' /etc/fstab
  but: Verifier la configuration PERSISTANTE
  lecture: La 4e colonne doit contenir noexec.
controles:
- controle: /boot monte avec noexec
  bon: noexec present (actif et dans /etc/fstab)
  mauvais: noexec absent
  gravite: moyenne
  risque: '/boot contient le noyau et le chargeur de demarrage : aucun programme n''a a s''y executer
    une fois la machine demarree.'
  action: Ajouter noexec aux options de /boot dans /etc/fstab puis remonter (mount -o remount /boot).
  playbook: infra.montage-option
  parametres:
    point: /boot
    option: noexec
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: option_presente
    attendu: noexec
  - commande: 1
    lecteur: fstab
    comparateur: option_presente
    attendu: noexec
pieges:
- 'Si /boot n''est pas une partition separee, cette regle ne peut pas s''appliquer telle quelle : voir
  la regle de partition dediee.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R28 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
