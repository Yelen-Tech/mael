id: cac-kernel-config-bug
titre: Option de compilation du noyau CONFIG_BUG = y
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_bug
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_bug
mots_cles:
- compilation
- config_bug
- kernel
- noyau
resume: Le noyau doit etre compile avec CONFIG_BUG=y. (regle kernel_config_bug, ComplianceAsCode 0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_BUG( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « CONFIG_BUG=y ». La ligne « # Linux/... » donne l''architecture ; option absente
    = inexistante dans ce noyau.'
controles:
- controle: CONFIG_BUG = y
  bon: CONFIG_BUG=y
  mauvais: 'autre valeur (option absente : indetermine)'
  gravite: moyenne
  risque: 'Sans cette option, le noyau ne signale plus certaines erreurs graves : elles passent inapercues
    au lieu d''etre detectees.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_BUG
    attendu: y
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R19 (niveau eleve)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
