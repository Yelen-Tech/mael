id: cac-file-groupowner-etc-ipsec-secrets
titre: 'Groupe de /etc/ipsec.secrets : root'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: groupe-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_groupowner_etc_ipsec_secrets
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ipsec/file_groupowner_etc_ipsec_secrets
mots_cles:
- chgrp
- fichier
- fichiers
- groupe
- ipsec
- secrets
resume: 'Groupe de /etc/ipsec.secrets : root : groupe root. (regle file_groupowner_etc_ipsec_secrets,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s libreswan >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; stat -c '%a %U %G %n' /etc/ipsec.secrets
    2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/ipsec.secrets contient les secrets des tunnels IPsec (cles partagees, cles privees) :
    il doit appartenir a root.'
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/ipsec.secrets
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - root
pieges:
- 'Regle limitee par la source a : package[libreswan]. Hors de ce cas, la commande repond « sans objet
  » (aucun ecart).'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
