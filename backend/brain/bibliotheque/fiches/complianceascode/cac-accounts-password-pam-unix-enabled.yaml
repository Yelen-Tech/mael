id: cac-accounts-password-pam-unix-enabled
titre: 'PAM : pam_unix.so dans /etc/pam.d/common-auth (present)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_pam_unix_enabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/accounts_password_pam_unix_enabled
mots_cles:
- auth
- authentification
- common
- pam
- pam_unix
- unix
resume: /etc/pam.d/common-auth doit appeler pam_unix.so. (regle accounts_password_pam_unix_enabled, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*auth[[:space:]].*pam_unix\.so' /etc/pam.d/common-auth
  but: Lire la ligne pam_unix.so de /etc/pam.d/common-auth
  lecture: 'Attendu : « auth pam_unix.so » ; aucune ligne = module absent.'
controles:
- controle: auth pam_unix.so
  bon: auth pam_unix.so
  mauvais: module absent, ou option absente / plus faible
  gravite: moyenne
  risque: 'pam_unix verifie le mot de passe des comptes locaux : sans lui dans la pile d''authentification,
    l''acces n''est plus conditionne a une authentification correcte de l''utilisateur.'
  action: Ajouter ou completer la ligne auth ... pam_unix.so dans /etc/pam.d/common-auth (sur Debian/Ubuntu,
    de preference via pam-auth-update) en gardant une session root ouverte.
  playbook: null
  sans_playbook: 'pile PAM : a modifier avec pam-auth-update et une session root ouverte (une erreur peut
    bloquer toute connexion)'
  evaluation:
  - commande: 0
    lecteur: pam
    comparateur: arguments
    champ: pam_unix.so
    attendu: []
pieges:
- 'Une erreur dans /etc/pam.d peut bloquer toute connexion : garder une session root ouverte pendant la
  modification.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
