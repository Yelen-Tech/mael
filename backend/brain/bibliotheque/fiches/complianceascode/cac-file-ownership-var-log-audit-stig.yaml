id: cac-file-ownership-var-log-audit-stig
titre: 'Proprietaire de tous les fichiers de /var/log/audit/ : root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: proprietaire-fichier
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: file_ownership_var_log_audit_stig
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/file_ownership_var_log_audit_stig
mots_cles:
- audit
- chown
- fichier
- fichiers
- journalisation
- proprietaire
- tous
resume: 'Proprietaire de tous les fichiers de /var/log/audit/ : root : proprietaire root. (regle file_ownership_var_log_audit_stig,
  ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/audit/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*$' -printf '%m
    %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les journaux d''audit revelent la configuration et l''activite du systeme : leur divulgation
    renseigne un attaquant.'
  action: chown root sur les fichiers concernes.
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/audit/
    regex: ^.*$
    nature: proprietaire
    valeur: root
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
