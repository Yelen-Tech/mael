id: cac-accounts-passwords-pam-faillock-unlock-time
titre: 'Verrouillage apres echecs : duree de verrouillage (s) (unlock_time au moins 900)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: minimal
source:
  origine: complianceascode
  regle: accounts_passwords_pam_faillock_unlock_time
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/locking_out_password_attempts/accounts_passwords_pam_faillock_unlock_time
mots_cles:
- authentification
- echecs
- faillock
- force brute
- pam
- time
- unlock
- unlock_time
- verrouillage
resume: pam_faillock doit avoir unlock_time au moins 900. (regle accounts_passwords_pam_faillock_unlock_time,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*unlock_time[[:space:]]*=' /etc/security/faillock.conf
  but: Lire unlock_time dans faillock.conf
  lecture: « unlock_time = N » ; aucune ligne = valeur par defaut (600).
- commande: grep -Es '^[[:space:]]*auth[[:space:]].*pam_faillock\.so' /etc/pam.d/common-auth
  but: Verifier que pam_faillock est utilise
  lecture: Lignes « auth ... pam_faillock.so preauth / authfail » ; aucune = verrouillage inactif.
controles:
- controle: unlock_time au moins 900
  bon: unlock_time au moins 900, pam_faillock actif (0 = deverrouillage par l'administrateur, accepte)
  mauvais: valeur hors bornes, ou pam_faillock non utilise
  gravite: moyenne
  risque: Limiter le nombre d'echecs de connexion en verrouillant le compte reduit le risque d'acces non
    autorise par devinette du mot de passe (force brute).
  action: Ecrire « unlock_time = 900 » dans /etc/security/faillock.conf et activer pam_faillock (pam-auth-update
    sur Debian/Ubuntu).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/faillock.conf
    cle: unlock_time
    valeur: '900'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: entre
    champ: unlock_time
    attendu:
    - 900
    - null
    defaut: '600'
    accepte:
    - '0'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- Un argument sur la ligne pam_faillock.so (ex. deny=5) l'emporte sur faillock.conf.
- Verrouiller trop vite (deny faible) facilite le deni de service sur les comptes.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.1.2 (niveau 1)
- nom: CIS
