id: cac-service-timesyncd-configured
titre: 'systemd-timesyncd : serveurs NTP configures (NTP= / FallbackNTP=)'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: synchronisation-heure
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_timesyncd_configured
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/service_timesyncd_configured
mots_cles:
- heure
- ntp
- serveur
- timesyncd
resume: 'systemd-timesyncd : serveurs NTP configures (NTP= / FallbackNTP=). (regle service_timesyncd_configured,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s systemd-timesyncd >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -hEs '^[[:space:]]*(NTP|FallbackNTP)=[^[:space:]]+'
    /etc/systemd/timesyncd.conf /etc/systemd/timesyncd.conf.d/*.conf
  but: Lire les serveurs de timesyncd
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: NTP= ou FallbackNTP= renseigne
  bon: une ligne
  mauvais: aucun serveur explicite
  gravite: moyenne
  risque: 'Sans serveur de temps choisi (NTP=), systemd-timesyncd depend des serveurs par defaut, eventuellement
    injoignables ou non maitrises : l''heure peut deriver ou etre fournie par une source non fiable.'
  action: Ecrire « NTP=serveur1 serveur2 » dans /etc/systemd/timesyncd.conf.d/60-sentinelle.conf.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: presente
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
