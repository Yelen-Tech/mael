id: cac-file-owner-etc-ipsec-conf
titre: 'Proprietaire de /etc/ipsec.conf : root'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: proprietaire-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_owner_etc_ipsec_conf
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ipsec/file_owner_etc_ipsec_conf
mots_cles:
- chown
- conf
- fichier
- fichiers
- ipsec
- proprietaire
resume: 'Proprietaire de /etc/ipsec.conf : root : proprietaire root. (regle file_owner_etc_ipsec_conf,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s libreswan >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; stat -c '%a %U %G %n' /etc/ipsec.conf
    2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/ipsec.conf definit les tunnels IPsec : qui peut le modifier peut desactiver le chiffrement
    ou detourner les connexions. Il doit appartenir a root.'
  action: chown root sur les fichiers concernes.
  playbook: infra.fichier-proprietaire
  parametres:
    chemin: /etc/ipsec.conf
    proprietaire: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Regle limitee par la source a : package[libreswan]. Hors de ce cas, la commande repond « sans objet
  » (aucun ecart).'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
