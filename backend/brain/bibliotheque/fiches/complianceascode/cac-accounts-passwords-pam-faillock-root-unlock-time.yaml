id: cac-accounts-passwords-pam-faillock-root-unlock-time
titre: 'Verrouillage apres echecs : duree de verrouillage de root (s) (root_unlock_time au moins 60)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: accounts_passwords_pam_faillock_root_unlock_time
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/locking_out_password_attempts/accounts_passwords_pam_faillock_root_unlock_time
mots_cles:
- authentification
- echecs
- faillock
- force brute
- pam
- root
- root_unlock_time
- time
- unlock
- verrouillage
resume: pam_faillock doit avoir root_unlock_time au moins 60. (regle accounts_passwords_pam_faillock_root_unlock_time,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*root_unlock_time[[:space:]]*=' /etc/security/faillock.conf
  but: Lire root_unlock_time dans faillock.conf
  lecture: « root_unlock_time = N » ; aucune ligne = valeur par defaut (non definie).
- commande: grep -Es '^[[:space:]]*auth[[:space:]].*pam_faillock\.so' /etc/pam.d/common-auth
  but: Verifier que pam_faillock est utilise
  lecture: Lignes « auth ... pam_faillock.so preauth / authfail » ; aucune = verrouillage inactif.
controles:
- controle: root_unlock_time au moins 60
  bon: root_unlock_time au moins 60, pam_faillock actif
  mauvais: valeur hors bornes, ou pam_faillock non utilise
  gravite: moyenne
  risque: Verrouiller aussi root apres des echecs successifs reduit le risque qu'un attaquant devine son
    mot de passe par force brute.
  action: Ecrire « root_unlock_time = 60 » dans /etc/security/faillock.conf et activer pam_faillock (pam-auth-update
    sur Debian/Ubuntu).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/faillock.conf
    cle: root_unlock_time
    valeur: '60'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: entre
    champ: root_unlock_time
    attendu:
    - 60
    - null
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- Un argument sur la ligne pam_faillock.so (ex. deny=5) l'emporte sur faillock.conf.
- Verrouiller trop vite (deny faible) facilite le deni de service sur les comptes.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.1.3 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.1.3 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.1.3 (niveau 2)
verifie_le: '2026-09-18'
