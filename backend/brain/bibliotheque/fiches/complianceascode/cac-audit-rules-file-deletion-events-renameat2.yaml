id: cac-audit-rules-file-deletion-events-renameat2
titre: Audit de l'appel systeme renameat2
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: audit_rules_file_deletion_events_renameat2
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_file_deletion_events/audit_rules_file_deletion_events_renameat2
mots_cles:
- appel
- audit
- auditctl
- auditd
- fichier
- journalisation
- renameat2
- renommage
- suppression
- syscall
- systeme
- tracabilite
resume: L'appel systeme renameat2 doit etre trace par auditd, en 32 et 64 bits (-a always,exit -F arch=b32/b64
  -S renameat2). (regle audit_rules_file_deletion_events_renameat2, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -a always,exit -S renameat2 (b32 et b64)
  bon: regles arch=b32 et arch=b64 pour renameat2
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: Tracer les suppressions et renommages de fichiers aide au diagnostic et revele les processus
    malveillants qui effacent des journaux pour masquer leur presence.
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -a always,exit -F arch=b32 -S renameat2 -F auid>=1000 -F auid!=unset -k mael | -a always,exit
      -F arch=b64 -S renameat2 -F auid>=1000 -F auid!=unset -k mael
  evaluation:
  - lecteur: audit
    comparateur: appels
    champ: renameat2
    commande: 0
  - lecteur: audit
    comparateur: appels
    champ: renameat2
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R73 (niveau renforce)
verifie_le: '2026-09-18'
relu_par: Yelen Tech
