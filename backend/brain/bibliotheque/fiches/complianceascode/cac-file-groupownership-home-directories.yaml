id: cac-file-groupownership-home-directories
titre: Chaque repertoire personnel a le groupe principal de son utilisateur
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: sessions
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupownership_home_directories
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-session/file_groupownership_home_directories
mots_cles:
- groupe
- home
- repertoire personnel
resume: Chaque repertoire personnel a le groupe principal de son utilisateur. (regle file_groupownership_home_directories,
  ComplianceAsCode 0.1.82).
observer:
- commande: 'find /home -mindepth 1 -maxdepth 1 -type d -printf ''%G %p\n'' 2>/dev/null | awk ''BEGIN{while
    ((getline l < "/etc/passwd") > 0) {split(l, c, ":"); if (c[3] >= 1000) g[c[6]] = c[4]}} ($2 in g)
    && $1 != g[$2] {print $2" : groupe "$1" (attendu "g[$2]")"}'''
  but: Comparer le groupe de chaque repertoire personnel au groupe principal
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: groupe = groupe principal
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Si le repertoire personnel d'un utilisateur n'a pas son groupe principal, les membres d'un autre
    groupe peuvent acceder a ses fichiers, et ceux qui devraient y acceder peuvent en etre prives.
  action: chgrp GROUPE_PRINCIPAL /home/UTILISATEUR
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
