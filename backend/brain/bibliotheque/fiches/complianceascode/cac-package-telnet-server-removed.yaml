id: cac-package-telnet-server-removed
titre: Paquet telnet-server absent
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: services-inutiles
  type_controle: paquet-absent
  niveaux:
    cis: null
    anssi: minimal
source:
  origine: complianceascode
  regle: package_telnet-server_removed
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/obsolete/telnet/package_telnet-server_removed
mots_cles:
- installe
- logiciel
- paquet
- paquets
- server
- telnet
- telnet-server
resume: Le paquet telnet-server doit etre absent. (regle package_telnet-server_removed, ComplianceAsCode
  0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' telnet-server 2>/dev/null
  but: Savoir si telnet-server est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
  variantes:
    rhel: rpm -q telnet-server
controles:
- controle: paquet telnet-server absent
  bon: absent
  mauvais: installe
  gravite: elevee
  risque: 'Fournir ou installer par defaut des fonctionnalites superflues est nefaste : ces capacites
    inutiles, souvent negligees, restent non sures et offrent des vecteurs d''attaque supplementaires.
    Le service telnet fournit un acces distant non chiffre, sans confidentialite ni integrite pour les
    mots de passe ni la session distante ; un utilisateur privilegie qui s''y connecte expose son mot
    de passe. Retirer le paquet telnet-server diminue le risque d''activation accidentelle ou intentionnelle
    du service telnet.'
  action: Desinstaller telnet-server (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: telnet-server
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - telnet-server
pieges:
- 'Un paquet peut etre requis par une application metier : confirmer avec l''exploitant avant de le retirer.'
referentiels:
