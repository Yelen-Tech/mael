resume: Le parametre noyau net.ipv6.conf.default.accept_ra_rtr_pref doit valoir 0, en memoire et de facon
  persistante. (regle sysctl_net_ipv6_conf_default_accept_ra_rtr_pref, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv6.conf.default.accept_ra_rtr_pref
  but: Lire la valeur ACTIVE de net.ipv6.conf.default.accept_ra_rtr_pref
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*net\.ipv6\.conf\.default\.accept_ra_rtr_pref[[:space:]]*=' /etc/sysctl.conf
    /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv6.conf.default.accept_ra_rtr_pref = 0 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv6.conf.default.accept_ra_rtr_pref = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Une annonce de routeur IPv6 forgee suffit a imposer une fausse passerelle, un faux prefixe
    ou une adresse a la machine : un attaquant du reseau local detourne ainsi le trafic (homme du milieu).
    Sur un serveur a configuration statique, ces annonces doivent etre ignorees.'
  action: Ecrire « net.ipv6.conf.default.accept_ra_rtr_pref = 0 » dans /etc/sysctl.conf (lu en dernier)
    puis appliquer avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv6.conf.default.accept_ra_rtr_pref
    valeur: '0'
