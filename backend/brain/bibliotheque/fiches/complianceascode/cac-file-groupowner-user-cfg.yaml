id: cac-file-groupowner-user-cfg
titre: 'Groupe de /boot/grub/user.cfg : root'
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: demarrage
  type_controle: groupe-fichier
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: file_groupowner_user_cfg
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/bootloader-grub2/non-uefi/file_groupowner_user_cfg
mots_cles:
- boot
- chargeur
- chgrp
- demarrage
- fichier
- fichiers
- groupe
- grub
- user
resume: 'Groupe de /boot/grub/user.cfg : root : groupe root. (regle file_groupowner_user_cfg, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /boot/grub/user.cfg 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: grub.cfg et user.cfg decident quel noyau demarre et avec quels arguments (mode mono-utilisateur,
    protections desactivees...). Qui peut les modifier prend la main au prochain demarrage ; qui peut
    les lire y trouve les faiblesses de la configuration. Ils doivent etre reserves a root.
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /boot/grub/user.cfg
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R29 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
