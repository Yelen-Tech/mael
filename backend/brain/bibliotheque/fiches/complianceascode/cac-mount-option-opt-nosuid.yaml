id: cac-mount-option-opt-nosuid
titre: Option nosuid sur /opt
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: montage
  type_controle: option-montage
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: mount_option_opt_nosuid
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/partitions/mount_option_opt_nosuid
mots_cles:
- montage
- nosuid
- option
- partition
resume: /opt doit etre monte avec l'option nosuid. (regle mount_option_opt_nosuid, ComplianceAsCode 0.1.82).
observer:
- commande: findmnt -kn /opt
  but: Lire les options de montage ACTIVES de /opt
  lecture: La colonne des options doit contenir nosuid. Aucune ligne = pas de montage separe.
- commande: grep -E '[[:space:]]/opt[[:space:]]' /etc/fstab
  but: Verifier la configuration PERSISTANTE
  lecture: La 4e colonne doit contenir nosuid.
controles:
- controle: /opt monte avec nosuid
  bon: nosuid present (actif et dans /etc/fstab)
  mauvais: nosuid absent
  gravite: moyenne
  risque: 'Un programme SUID ou SGID s''execute avec les droits de son proprietaire, souvent root : l''option
    nosuid empeche qu''un tel programme depose sur cette partition serve a elever ses privileges.'
  action: Ajouter nosuid aux options de /opt dans /etc/fstab puis remonter (mount -o remount /opt).
  playbook: infra.montage-option
  parametres:
    point: /opt
    option: nosuid
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: option_presente
    attendu: nosuid
  - commande: 1
    lecteur: fstab
    comparateur: option_presente
    attendu: nosuid
pieges:
- 'Si /opt n''est pas une partition separee, cette regle ne peut pas s''appliquer telle quelle : voir
  la regle de partition dediee.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R28 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
