id: cac-grub2-spectre-v2-argument
titre: Argument de demarrage spectre_v2=on
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: demarrage
  type_controle: argument-demarrage
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: grub2_spectre_v2_argument
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/bootloader-grub2/grub2_spectre_v2_argument
mots_cles:
- argument
- demarrage
- grub
- noyau
- spectre
- spectre_v2
resume: Le noyau doit demarrer avec spectre_v2=on. (regle grub2_spectre_v2_argument, ComplianceAsCode
  0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : spectre_v2=on.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: spectre_v2=on doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument spectre_v2=on
  bon: spectre_v2=on dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: elevee
  risque: 'La faille Spectre v2 permet a un attaquant de lire de la memoire a laquelle il ne devrait pas
    avoir acces : spectre_v2=on force les protections.'
  action: Ajouter spectre_v2=on a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer la configuration
    (update-grub) et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: spectre_v2=on
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: spectre_v2
    comparateur: egal
    attendu: 'on'
  - commande: 1
    lecteur: grub
    champ: spectre_v2
    comparateur: egal
    attendu: 'on'
pieges:
- 'Le changement ne prend effet qu''apres redemarrage : planifier la fenetre de maintenance.'
