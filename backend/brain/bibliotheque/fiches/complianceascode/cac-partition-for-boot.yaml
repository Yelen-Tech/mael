id: cac-partition-for-boot
titre: Partition separee pour /boot
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: montage
  type_controle: partition-separee
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: partition_for_boot
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/disk_partitioning/partition_for_boot
mots_cles:
- boot
- disque
- montage
- partition
- separee
resume: /boot doit etre une partition (ou un montage) separe. (regle partition_for_boot, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /boot
  but: Voir si /boot est un montage separe
  lecture: Une ligne = montage separe ; aucune = meme partition que son parent.
controles:
- controle: /boot monte a part
  bon: montage separe
  mauvais: /boot sur la partition de son parent
  gravite: moyenne
  risque: Une partition dediee a /boot, qui contient le noyau et le chargeur de demarrage, permet d'en
    restreindre l'acces et les options de montage.
  action: 'Prevoir une partition (ou un volume LVM) dedie a /boot et la declarer dans /etc/fstab : se
    planifie, surtout sur un systeme en production.'
  playbook: null
  sans_playbook: 'partition dediee : repartitionnement a planifier, non automatisable'
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: monte
pieges:
- 'Repartitionner un systeme en service est risque : a planifier (ou a appliquer aux prochaines installations).'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R28 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
