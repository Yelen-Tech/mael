id: cac-file-groupowner-etc-crypttab
titre: 'Groupe de /etc/crypttab : root'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: fichiers-systeme
  type_controle: groupe-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_groupowner_etc_crypttab
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/file_groupowner_etc_crypttab
mots_cles:
- chgrp
- crypttab
- fichier
- fichiers
- groupe
resume: 'Groupe de /etc/crypttab : root : groupe root. (regle file_groupowner_etc_crypttab, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/crypttab 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/crypttab decrit les disques chiffres et l''emplacement de leurs cles : qui peut le modifier
    peut empecher leur ouverture ou pointer vers une cle qu''il controle. Il doit appartenir a root.'
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/crypttab
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
