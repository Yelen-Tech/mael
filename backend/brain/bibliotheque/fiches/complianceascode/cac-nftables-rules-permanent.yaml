id: cac-nftables-rules-permanent
titre: 'nftables : regles chargees au demarrage (/etc/nftables.conf) (si nftables est l''outil retenu)'
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: nftables_rules_permanent
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-nftables/nftables_rules_permanent
mots_cles:
- demarrage
- nftables
- nftables.conf
- persistant
resume: 'nftables : regles chargees au demarrage (/etc/nftables.conf). (regle nftables_rules_permanent,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -Es '^[[:space:]]*(include|table)' /etc/nftables.conf
  but: Verifier que la configuration persistante declare les regles
  lecture: Au moins une ligne include ou table = regles chargees au demarrage ; aucune = ecart.
controles:
- controle: regles presentes dans /etc/nftables.conf
  bon: lignes include ou table
  mauvais: au moins une ligne
  gravite: moyenne
  risque: 'Les regles nftables chargees a chaud disparaissent au redemarrage : sans /etc/nftables.conf,
    la machine redemarre sans pare-feu.'
  action: Enregistrer les regles dans /etc/nftables.conf (nft list ruleset > ...) et systemctl enable
    nftables.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si nftables est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 4.2.10 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 4.3.10 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 4.3.10 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
