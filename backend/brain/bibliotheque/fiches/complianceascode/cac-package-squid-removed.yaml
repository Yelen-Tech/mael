resume: Le paquet squid doit etre absent. (regle package_squid_removed, ComplianceAsCode 0.1.82).
observer:
- commande: dpkg-query -W -f='${binary:Package} ${Status}\n' squid 2>/dev/null
  but: Savoir si squid est installe
  lecture: « install ok installed » = installe ; aucune ligne ou « deinstall » = absent.
controles:
- controle: paquet squid absent
  bon: absent
  mauvais: installe
  gravite: moyenne
  risque: S'il n'est pas necessaire de fournir un logiciel de serveur mandataire, le retirer constitue
    une protection contre son activation.
  action: Desinstaller squid (apt purge) apres avoir verifie qu'aucun service n'en depend.
  playbook: infra.paquet-retirer
  parametres:
    paquet: squid
  evaluation:
  - commande: 0
    lecteur: dpkg
    comparateur: absent
    attendu:
    - squid
pieges:
