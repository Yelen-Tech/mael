- repertoires personnels
resume: Repertoires personnels en 0750 au plus. (regle file_permissions_home_directories, ComplianceAsCode
  0.1.82).
observer:
- commande: 'awk -F: ''($3 >= 1000 && $7 !~ /(nologin|false)$/) {print $6}'' /etc/passwd | xargs -r stat
    -c ''%a %U %G %n'' 2>/dev/null'
  but: Lire les droits des repertoires personnels
  lecture: '1re colonne = droits : au plus 0750.'
controles:
- controle: droits <= 0750
  bon: 0750 ou plus strict
  mauvais: droits plus larges
  gravite: moyenne
  risque: Des droits excessifs sur les repertoires personnels peuvent permettre a d'autres utilisateurs
    un acces non autorise aux fichiers.
  action: chmod 0750 /home/COMPTE
  playbook: null
  sans_playbook: 'droits calcules (PATH, repertoires personnels) : correction au cas par cas'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0750'
