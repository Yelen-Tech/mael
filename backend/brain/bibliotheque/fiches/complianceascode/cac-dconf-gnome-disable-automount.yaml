id: cac-dconf-gnome-disable-automount
titre: 'GNOME : montage automatique des supports desactive (automount=false)'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: dconf_gnome_disable_automount
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/gnome/gnome_media_settings/dconf_gnome_disable_automount
mots_cles:
- amovibles
- automount
- gnome
- supports
- usb
resume: 'GNOME : montage automatique des supports desactive (automount=false). (regle dconf_gnome_disable_automount,
  ComplianceAsCode 0.1.82).'
observer:
- commande: dpkg -s gdm3 >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -EsR '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?automount[[:space:]]*='
    /etc/dconf/db/
  but: Lire automount dans /etc/dconf/db/
  lecture: Valeur de automount ; aucune ligne = non defini.
controles:
- controle: automount=false
  bon: automount=false
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Desactiver le montage automatique dans GNOME empeche l'introduction de logiciels malveillants
    par des supports amovibles, mais prive aussi les utilisateurs de bureau de leur usage legitime.
  action: Ecrire automount=false dans /etc/dconf/db/local.d/00-security-settings (section [org/gnome/desktop/media-handling]),
    verrouiller, puis dconf update.
  playbook: null
  sans_playbook: 'fichier a sections ou repertoire (dconf, sssd) : correction manuelle'
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: toutes_egales
    champ: automount
    attendu: 'false'
