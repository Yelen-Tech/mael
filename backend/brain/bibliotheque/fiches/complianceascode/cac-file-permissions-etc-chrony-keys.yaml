id: cac-file-permissions-etc-chrony-keys
titre: Droits de /etc/chrony.keys (0640 au plus)
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: synchronisation-heure
  type_controle: droits-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_permissions_etc_chrony_keys
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/file_permissions_etc_chrony_keys
mots_cles:
- chmod
- chrony
- droits
- fichier
- fichiers
- keys
- permissions
resume: 'Droits de /etc/chrony.keys : 0640 ou plus strict (aucun droit en plus). (regle file_permissions_etc_chrony_keys,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/chrony.keys 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0640. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0640
  bon: 0640 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Le fichier de cles de chrony authentifie les serveurs de temps : qui le lit ou le modifie peut
    se faire passer pour un serveur et fausser l''heure de la machine.'
  action: chmod 0640 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/chrony.keys
    mode: '0640'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0640'
pieges:
- 'Chemin RHEL : sur Debian/Ubuntu la cle est dans /etc/chrony/chrony.keys (compte _chrony) ; ici « aucune
  ligne » ne prouve rien, verifier ce fichier a la main.'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
