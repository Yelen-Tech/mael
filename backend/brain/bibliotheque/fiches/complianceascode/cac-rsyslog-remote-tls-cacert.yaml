resume: 'rsyslog : certificat d''autorite pour l''envoi TLS (DefaultNetstreamDriverCAFile). (regle rsyslog_remote_tls_cacert,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -Es 'DefaultNetstreamDriverCAFile' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
  but: Chercher le certificat d'autorite de l'envoi TLS
  lecture: Une ligne = conforme ; aucune = ecart.
controles:
- controle: DefaultNetstreamDriverCAFile defini
  bon: une ligne
  mauvais: aucune ligne
  gravite: moyenne
  risque: Sans certificat d'autorite, rsyslog ne peut pas verifier l'identite du serveur de journaux ;
    avec le pilote TLS actif, le service refuse meme de demarrer.
  action: global(DefaultNetstreamDriverCAFile="/chemin/ca.pem") dans /etc/rsyslog.conf.
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
