id: cac-file-permissions-sshd-config
titre: Droits de /etc/ssh/sshd_config (0600 au plus)
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: ssh
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_permissions_sshd_config
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/file_permissions_sshd_config
mots_cles:
- chmod
- config
- droits
- fichier
- fichiers
- permissions
- sshd
resume: 'Droits de /etc/ssh/sshd_config : 0600 ou plus strict (aucun droit en plus). (regle file_permissions_sshd_config,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/ssh/sshd_config 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0600. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0600
  bon: 0600 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les fichiers de configuration de SSH activent ou desactivent ses fonctions : un compte non
    autorise qui peut les modifier (ou les lire, pour y reperer une faiblesse) peut ouvrir un acces ou
    affaiblir le service. Ils doivent appartenir a root et n''etre modifiables que par lui.'
  action: chmod 0600 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/ssh/sshd_config
    mode: '0600'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0600'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.1 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
