id: cac-file-groupowner-etc-chrony-keys
titre: 'Groupe de /etc/chrony.keys : chrony'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: synchronisation-heure
  type_controle: groupe-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: file_groupowner_etc_chrony_keys
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ntp/file_groupowner_etc_chrony_keys
mots_cles:
- chgrp
- chrony
- fichier
- fichiers
- groupe
- keys
resume: 'Groupe de /etc/chrony.keys : chrony : groupe chrony. (regle file_groupowner_etc_chrony_keys,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/chrony.keys 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu chrony. Aucune ligne = fichier absent.'
controles:
- controle: groupe = chrony
  bon: groupe chrony
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Le fichier de cles de chrony authentifie les serveurs de temps : qui le lit ou le modifie peut
    se faire passer pour un serveur et fausser l''heure de la machine.'
  action: chgrp chrony sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/chrony.keys
    groupe: chrony
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - chrony
pieges:
- 'Chemin RHEL : sur Debian/Ubuntu la cle est dans /etc/chrony/chrony.keys (compte _chrony) ; ici « aucune
  ligne » ne prouve rien, verifier ce fichier a la main.'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
