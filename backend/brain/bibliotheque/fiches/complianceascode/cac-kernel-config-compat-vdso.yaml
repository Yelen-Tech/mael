id: cac-kernel-config-compat-vdso
titre: Option de compilation du noyau CONFIG_COMPAT_VDSO = n
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: compilation-noyau
  type_controle: option-compilation
  niveaux:
    cis: null
    anssi: eleve
source:
  origine: complianceascode
  regle: kernel_config_compat_vdso
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/kernel_build_config/kernel_config_compat_vdso
mots_cles:
- compat
- compilation
- config_compat_vdso
- kernel
- noyau
- vdso
resume: Le noyau doit etre compile avec CONFIG_COMPAT_VDSO=n. (regle kernel_config_compat_vdso, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -E '^# Linux/|^(# )?CONFIG_COMPAT_VDSO( is not set|=)' /boot/config-$(uname -r)
  but: Lire l'option dans la configuration du noyau en cours
  lecture: 'Attendu : « # CONFIG_COMPAT_VDSO is not set ». La ligne « # Linux/... » donne l''architecture
    ; option absente = inexistante dans ce noyau.'
controles:
- controle: CONFIG_COMPAT_VDSO = n
  bon: '# CONFIG_COMPAT_VDSO is not set (ou option inexistante dans ce noyau)'
  mauvais: autre valeur
  gravite: faible
  risque: 'La compatibilite VDSO place le vDSO a une adresse fixe : elle desactive l''ASLR sur cette zone
    et degrade les performances.'
  action: 'Utiliser un noyau compile avec cette option (noyau de la distribution ou recompilation) : ce
    n''est pas un reglage a chaud.'
  playbook: null
  sans_playbook: 'option de compilation du noyau : changer de noyau ou le recompiler, non automatisable'
  evaluation:
  - commande: 0
    lecteur: kconfig
    comparateur: egal
    champ: CONFIG_COMPAT_VDSO
    attendu: n
pieges:
- '/boot/config-<version> peut manquer (images cloud, conteneurs) : essayer /proc/config.gz si disponible.'
- 'Regle issue du guide ANSSI : un ecart est frequent sur les noyaux generiques, a qualifier plutot qu''a
  corriger seul.'
referentiels:
- nom: ANSSI
