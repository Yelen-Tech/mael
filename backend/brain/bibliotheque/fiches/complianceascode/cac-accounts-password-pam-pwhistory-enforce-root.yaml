id: cac-accounts-password-pam-pwhistory-enforce-root
titre: 'PAM : pam_pwhistory.so dans /etc/pam.d/common-password (enforce_for_root)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_pam_pwhistory_enforce_root
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/locking_out_password_attempts/accounts_password_pam_pwhistory_enforce_root
mots_cles:
- authentification
- common
- enforce
- pam
- pam_pwhistory
- password
- pwhistory
- root
resume: /etc/pam.d/common-password doit appeler pam_pwhistory.so avec enforce_for_root. (regle accounts_password_pam_pwhistory_enforce_root,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*password[[:space:]].*pam_pwhistory\.so' /etc/pam.d/common-password
  but: Lire la ligne pam_pwhistory.so de /etc/pam.d/common-password
  lecture: 'Attendu : « password pam_pwhistory.so enforce_for_root » ; aucune ligne = module absent.'
controles:
- controle: password pam_pwhistory.so enforce_for_root
  bon: password pam_pwhistory.so enforce_for_root
  mauvais: module absent, ou option absente / plus faible
  gravite: moyenne
  risque: 'Sans enforce_for_root, root echappe a l''historique : il peut reprendre un ancien mot de passe
    deja compromis.'
  action: Ajouter ou completer la ligne password ... pam_pwhistory.so dans /etc/pam.d/common-password
    (sur Debian/Ubuntu, de preference via pam-auth-update) en gardant une session root ouverte.
  playbook: null
  sans_playbook: 'pile PAM : a modifier avec pam-auth-update et une session root ouverte (une erreur peut
    bloquer toute connexion)'
  evaluation:
  - commande: 0
    lecteur: pam
    comparateur: arguments
    champ: pam_pwhistory.so
    attendu:
    - nom: enforce_for_root
pieges:
- 'Une erreur dans /etc/pam.d peut bloquer toute connexion : garder une session root ouverte pendant la
  modification.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
