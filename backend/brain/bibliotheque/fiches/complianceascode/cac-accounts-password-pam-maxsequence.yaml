id: cac-accounts-password-pam-maxsequence
titre: 'Mots de passe : longueur maximale d''une sequence (abcd, 1234) (maxsequence entre 1 et 3)'
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: option-pam
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_password_pam_maxsequence
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-pam/password_quality/password_quality_pwquality/accounts_password_pam_maxsequence
mots_cles:
- abcd
- complexite
- longueur
- maximale
- maxsequence
- mot de passe
- mots de passe
- pam
- politique
- pwquality
- sequence
resume: pwquality doit imposer maxsequence entre 1 et 3 (longueur maximale d'une sequence (abcd, 1234)).
  (regle accounts_password_pam_maxsequence, ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs '^[[:space:]]*maxsequence[[:space:]]*=' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/
  but: Lire la valeur de maxsequence configuree pour pwquality
  lecture: « maxsequence = N » ; aucune ligne = valeur par defaut du module (0).
- commande: grep -s 'pam_pwquality' /etc/pam.d/common-password
  but: Verifier que pam_pwquality est bien applique
  lecture: Une ligne « password requisite pam_pwquality.so » ; aucune = politique non appliquee.
controles:
- controle: maxsequence entre 1 et 3
  bon: maxsequence entre 1 et 3, module pam_pwquality actif
  mauvais: valeur plus faible, ou module non applique
  gravite: moyenne
  risque: 'Les suites de caracteres (abcd, 1234) sont parmi les premiers motifs testes par les attaques
    par devinette : les limiter oblige a des mots de passe moins previsibles.'
  action: Ecrire « maxsequence = 3 » dans /etc/security/pwquality.conf (paquet libpam-pwquality).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/security/pwquality.conf
    cle: maxsequence
    valeur: '3'
    format: egal_espaces
  evaluation:
  - lecteur: affectations
    comparateur: entre
    champ: maxsequence
    attendu:
    - 1
    - 3
    defaut: '0'
    commande: 0
  - commande: 1
    lecteur: lignes
    comparateur: presente
pieges:
- 'Des arguments sur la ligne pam_pwquality.so (ex. minlen=8) l''emportent sur pwquality.conf : les lire
  aussi.'
- La politique ne s'applique qu'aux NOUVEAUX mots de passe.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.3.3.2.5 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.3.3.2.5 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.3.3.2.5 (niveau 1)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
