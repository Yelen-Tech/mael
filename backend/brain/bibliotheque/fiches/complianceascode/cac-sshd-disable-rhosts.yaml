id: cac-sshd-disable-rhosts
titre: 'SSH : fichiers .rhosts ignores (IgnoreRhosts yes)'
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
  services:
  - openssh
taxonomie:
  theme: ssh
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: sshd_disable_rhosts
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/ssh_server/sshd_disable_rhosts
mots_cles:
- authentification
- confiance
- ignore
- ignorerhosts
- rhosts
- ssh
- sshd
resume: La directive sshd IgnoreRhosts doit valoir « yes » (regle sshd_disable_rhosts, ComplianceAsCode
  0.1.82).
observer:
- commande: sudo sshd -T 2>/dev/null | grep -i '^ignorerhosts '
  but: Lire la valeur EFFECTIVE de IgnoreRhosts
  lecture: 'Attendu : « ignorerhosts yes ». Toute autre valeur est un ecart.'
- commande: grep -Ris '^[[:space:]]*IgnoreRhosts[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
    2>/dev/null
  but: Trouver ou IgnoreRhosts est defini dans les fichiers
  lecture: Chaque ligne donne le fichier et la valeur ecrite ; aucune ligne = valeur par defaut.
controles:
- controle: IgnoreRhosts = yes
  bon: IgnoreRhosts yes
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les fichiers .rhosts etablissent des relations de confiance : la compromission d''une machine
    permet de rebondir sans effort vers les autres.'
  action: Definir « IgnoreRhosts yes » dans /etc/ssh/sshd_config (ou un fichier de /etc/ssh/sshd_config.d/),
    controler avec sshd -t, puis recharger SSH en gardant une session ouverte.
  playbook: infra.ssh-directive
  parametres:
    directive: IgnoreRhosts
    valeur: 'yes'
  evaluation:
  - comparateur: egal
    attendu: 'yes'
    commande: 0
    lecteur: sshd_t
    champ: ignorerhosts
pieges:
- sshd -T exige les droits root ; sans sudo, la commande ne renvoie rien.
- 'Plusieurs fichiers peuvent definir la directive (Include /etc/ssh/sshd_config.d/*.conf) : la PREMIERE
  occurrence gagne ; sshd -T donne la valeur effective.'
- '« IgnoreRhosts yes » est la valeur par defaut : son absence du fichier est conforme.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.11 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.11 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 5.1.11 (niveau 1)
verifie_le: '2026-09-17'
relu_par: assistant IA (Claude), par delegation du responsable du projet
