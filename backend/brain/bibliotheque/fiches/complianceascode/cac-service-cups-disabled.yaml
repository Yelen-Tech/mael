id: cac-service-cups-disabled
titre: Service cups desactive et arrete
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: services-inutiles
  type_controle: service-inactif
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: service_cups_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/printing/service_cups_disabled
mots_cles:
- cups
- demarrage
- service
- services
- systemd
resume: Le service cups doit etre desactive et arrete. (regle service_cups_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled cups.service 2>/dev/null; systemctl is-active cups.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de cups
  lecture: 'Attendu : « disabled » ou « masked » (ou service absent) puis « inactive ».'
controles:
- controle: service cups disabled/inactive
  bon: disabled ou masked, inactive (ou absent)
  mauvais: enabled ou active
  gravite: moyenne
  risque: 'CUPS ecoute sur le reseau pour l''impression : sur une machine qui n''imprime pas, c''est un
    service expose sans raison. Couper les services inutiles reduit la surface d''attaque.'
  action: systemctl disable --now cups.service (ou mask) apres verification du besoin.
  playbook: infra.service-desactiver
  parametres:
    service: cups
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: inactif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.1.11 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.1.11 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.1.11 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
