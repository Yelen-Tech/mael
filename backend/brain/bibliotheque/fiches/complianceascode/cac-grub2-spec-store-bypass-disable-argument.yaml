id: cac-grub2-spec-store-bypass-disable-argument
titre: Argument de demarrage spec_store_bypass_disable=seccomp
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: demarrage
  type_controle: argument-demarrage
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: grub2_spec_store_bypass_disable_argument
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/bootloader-grub2/grub2_spec_store_bypass_disable_argument
mots_cles:
- argument
- bypass
- demarrage
- disable
- grub
- noyau
- spec
- spec_store_bypass_disable
- store
resume: Le noyau doit demarrer avec spec_store_bypass_disable=seccomp. (regle grub2_spec_store_bypass_disable_argument,
  ComplianceAsCode 0.1.82).
observer:
- commande: cat /proc/cmdline
  but: Lire les arguments du demarrage EN COURS
  lecture: 'Attendu : spec_store_bypass_disable=seccomp.'
- commande: grep -E '^GRUB_CMDLINE_LINUX' /etc/default/grub
  but: Verifier la configuration persistante de GRUB
  lecture: spec_store_bypass_disable=seccomp doit figurer dans GRUB_CMDLINE_LINUX.
controles:
- controle: argument spec_store_bypass_disable=seccomp
  bon: spec_store_bypass_disable=seccomp dans /proc/cmdline et /etc/default/grub
  mauvais: argument absent ou valeur plus faible
  gravite: moyenne
  risque: La faille Speculative Store Bypass (Spectre v4) permet de lire, par canal auxiliaire, de la
    memoire normalement inaccessible, par exemple depuis un code isole (bac a sable).
  action: Ajouter spec_store_bypass_disable=seccomp a GRUB_CMDLINE_LINUX dans /etc/default/grub, regenerer
    la configuration (update-grub) et redemarrer.
  playbook: infra.grub-argument
  parametres:
    argument: spec_store_bypass_disable=seccomp
    action: ajouter
  evaluation:
  - commande: 0
    lecteur: cmdline
    champ: spec_store_bypass_disable
    comparateur: egal
    attendu: seccomp
  - commande: 1
    lecteur: grub
    champ: spec_store_bypass_disable
    comparateur: egal
    attendu: seccomp
pieges:
- 'Le changement ne prend effet qu''apres redemarrage : planifier la fenetre de maintenance.'
