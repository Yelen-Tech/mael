id: cac-kernel-module-hfs-disabled
titre: Module noyau hfs desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_hfs_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_hfs_disabled
mots_cles:
- hfs
- module
- modules
- noyau
resume: Le module noyau hfs ne doit pas pouvoir etre charge. (regle kernel_module_hfs_disabled, ComplianceAsCode
  0.1.82).
observer:
- commande: grep -Rs 'hfs' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si hfs est interdit de chargement
  lecture: 'Attendu : « install hfs /bin/false » (ou /bin/true) et « blacklist hfs ».'
- commande: lsmod | grep -w 'hfs'
  but: Voir si hfs est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module hfs non chargeable
  bon: install hfs /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: faible
  risque: Chaque systeme de fichiers pris en charge est du code du noyau qu'un support piege (cle USB,
    image disque) peut atteindre. Retirer ceux dont on n'a pas besoin reduit la surface d'attaque locale.
  action: Ajouter « install hfs /bin/false » et « blacklist hfs » dans /etc/modprobe.d/hfs.conf, puis
    decharger le module.
  playbook: infra.module-interdit
  parametres:
    module: hfs
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: hfs
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
pieges:
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
