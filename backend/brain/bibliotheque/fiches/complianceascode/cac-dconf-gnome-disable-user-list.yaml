observer:
- commande: dpkg -s gdm3 >/dev/null 2>&1 || echo 'SENTINELLE:SANS_OBJET'; grep -EsR '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?disable-user-list[[:space:]]*='
    /etc/dconf/db/ /etc/gdm3/greeter.dconf-defaults
  but: Lire disable-user-list dans /etc/dconf/db/, /etc/gdm3/greeter.dconf-defaults
  lecture: Valeur de disable-user-list ; aucune ligne = non defini.
controles:
- controle: disable-user-list=true
  bon: disable-user-list=true
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: 'Laisser la liste des utilisateurs active est un risque de securite : toute personne ayant un
    acces physique peut enumerer rapidement les comptes connus sans se connecter.'
  action: Ecrire disable-user-list=true (section [org/gnome/login-screen]), verrouiller, puis dconf update.
