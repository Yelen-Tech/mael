id: cac-file-permissions-sshd-drop-in-config
titre: Droits de tous les fichiers de /etc/ssh/sshd_config.d/ (0600 au plus)
domaine: acces
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: ssh
  type_controle: droits-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_permissions_sshd_drop_in_config
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/ssh/file_permissions_sshd_drop_in_config
mots_cles:
- chmod
- config
- droits
- fichier
- fichiers
- permissions
- sshd
- tous
resume: 'Droits de tous les fichiers de /etc/ssh/sshd_config.d/ : 0600 ou plus strict (aucun droit en
  plus). (regle file_permissions_sshd_drop_in_config, ComplianceAsCode 0.1.82).'
observer:
- commande: find /etc/ssh/sshd_config.d/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*$' -printf
    '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0600. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0600
  bon: 0600 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les fichiers de configuration de SSH activent ou desactivent ses fonctions : un compte non
    autorise qui peut les modifier (ou les lire, pour y reperer une faiblesse) peut ouvrir un acces ou
    affaiblir le service. Ils doivent appartenir a root et n''etre modifiables que par lui.'
  action: chmod 0600 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichiers-motif
  parametres:
    dossier: /etc/ssh/sshd_config.d/
    regex: ^.*$
    nature: droits
    valeur: '0600'
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0600'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 5.1.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 5.1.1 (niveau 1)
verifie_le: '2026-09-18'
relu_par: Yelen Tech
