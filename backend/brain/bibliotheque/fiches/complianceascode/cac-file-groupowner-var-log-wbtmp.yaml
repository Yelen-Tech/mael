id: cac-file-groupowner-var-log-wbtmp
titre: 'Groupe des fichiers motif .*(b|w)tmp((\.|-)[^\/]+)? de /var/log/ : utmp ou root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_var_log_wbtmp
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_groupowner_var_log_wbtmp
mots_cles:
- chgrp
- fichier
- fichiers
- groupe
- motif
- temporaire
resume: 'Groupe des fichiers motif .*(b|w)tmp((\.|-)[^\/]+)? de /var/log/ : utmp ou root : groupe utmp
  ou root. (regle file_groupowner_var_log_wbtmp, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -maxdepth 1 -type f -regextype posix-extended -regex '.*(b|w)tmp((\.|-)[^\/]+)?'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu utmp ou root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = utmp ou root
  bon: groupe utmp ou root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: lastlog, wtmp et btmp gardent l'historique des connexions reussies et des echecs. Modifiables
    par un compte non autorise, ils permettent d'effacer la trace d'une intrusion ; lisibles, ils revelent
    qui se connecte et quand.
  action: chgrp utmp ou root sur les fichiers concernes.
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*(b|w)tmp((\.|-)[^\/]+)?
    nature: groupe
    valeur: utmp
    recursif: non
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - root
    - utmp
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
