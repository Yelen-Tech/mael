id: cac-audit-rules-usergroup-modification-shadow
titre: Audit des modifications de /etc/shadow
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: 2
    anssi: renforce
source:
  origine: complianceascode
  regle: audit_rules_usergroup_modification_shadow
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_rules_usergroup_modification_shadow
mots_cles:
- audit
- auditctl
- auditd
- comptes
- journalisation
- modification
- mots de passe
- shadow
- surveillance
- tracabilite
resume: Toute ecriture ou changement d'attribut de /etc/shadow doit etre trace par auditd (-w /etc/shadow
  -p wa). (regle audit_rules_usergroup_modification_shadow, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -w /etc/shadow -p wa
  bon: regle -w /etc/shadow -p wa chargee et persistante
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: 'Surveiller les fichiers de comptes et de groupes signale toute creation ou modification : un
    compte, un groupe ou un changement inattendu doit etre verifie (ajout d''un compte cache par un attaquant).'
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -w /etc/shadow -p wa -k mael
  evaluation:
  - lecteur: audit
    comparateur: surveille
    champ: /etc/shadow
    attendu: wa
    commande: 0
  - lecteur: audit
    comparateur: surveille
    champ: /etc/shadow
    attendu: wa
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
