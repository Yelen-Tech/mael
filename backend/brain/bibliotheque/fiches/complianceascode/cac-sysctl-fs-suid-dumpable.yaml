id: cac-sysctl-fs-suid-dumpable
titre: Parametre noyau fs.suid_dumpable = 0
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: parametres-noyau
  type_controle: parametre-noyau
  niveaux:
    cis: 1
    anssi: intermediaire
source:
  origine: complianceascode
  regle: sysctl_fs_suid_dumpable
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/restrictions/coredumps/sysctl_fs_suid_dumpable
mots_cles:
- dumpable
- fs.suid_dumpable
- noyau
- parametre
- suid
- sysctl
resume: Le parametre noyau fs.suid_dumpable doit valoir 0, en memoire et de facon persistante. (regle
  sysctl_fs_suid_dumpable, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n fs.suid_dumpable
  but: Lire la valeur ACTIVE de fs.suid_dumpable
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*fs\.suid_dumpable[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/ /run/sysctl.d/
    /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « fs.suid_dumpable = 0 » ; aucune ligne = non persistant.'
controles:
- controle: fs.suid_dumpable = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Le vidage memoire d''un programme setuid peut contenir des donnees privilegiees (empreintes
    de mots de passe, cles) : l''interdire evite qu''un utilisateur les recupere.'
  action: Ecrire « fs.suid_dumpable = 0 » dans /etc/sysctl.conf (lu en dernier) puis appliquer avec sysctl
    --system.
  playbook: infra.sysctl
  parametres:
    cle: fs.suid_dumpable
    valeur: '0'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '0'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: fs.suid_dumpable
    attendu: '0'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
referentiels:
