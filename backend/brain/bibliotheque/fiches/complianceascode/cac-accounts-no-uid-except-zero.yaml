id: cac-accounts-no-uid-except-zero
titre: Seul root a l'UID 0
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: accounts_no_uid_except_zero
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/root_logins/accounts_no_uid_except_zero
mots_cles:
- comptes
- passwd
- root
- superutilisateur
- uid
- uid 0
resume: Seul root a l'UID 0. (regle accounts_no_uid_except_zero, ComplianceAsCode 0.1.82).
observer:
- commande: 'awk -F: ''$3 == 0 && $1 != "root" {print $1}'' /etc/passwd'
  but: Lister les comptes autres que root avec l'UID 0
  lecture: Chaque ligne est un element en defaut ; aucune ligne = conforme.
controles:
- controle: aucun autre compte en UID 0
  bon: aucune ligne
  mauvais: au moins une ligne
  gravite: elevee
  risque: Tout compte d'UID 0 a les pleins pouvoirs de root. Un second compte d'UID 0 est un acces privilegie
    de plus a deviner, souvent signe d'une porte derobee. Plusieurs administrateurs doivent passer par
    sudo, qui trace qui fait quoi.
  action: 'Supprimer, verrouiller ou changer l''UID des comptes listes (enqueter : porte derobee possible).'
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation:
  - commande: 0
    lecteur: lignes
    comparateur: vide
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
