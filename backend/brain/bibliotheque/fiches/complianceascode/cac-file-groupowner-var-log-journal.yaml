id: cac-file-groupowner-var-log-journal
titre: 'Groupe des fichiers motif .*\.journal[~]? de /var/log/ : systemd-journal ou root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_var_log_journal
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_groupowner_var_log_journal
mots_cles:
- chgrp
- fichier
- fichiers
- groupe
- journal
- motif
resume: 'Groupe des fichiers motif .*\.journal[~]? de /var/log/ : systemd-journal ou root : groupe systemd-journal
  ou root. (regle file_groupowner_var_log_journal, ComplianceAsCode 0.1.82).'
observer:
- commande: find /var/log/ -type f -regextype posix-extended -regex '.*\.journal[~]?' -printf '%m %u %g
    %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu systemd-journal ou root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = systemd-journal ou root
  bon: groupe systemd-journal ou root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Les fichiers *.journal de systemd-journald contiennent l'ensemble des journaux du systeme. S'ils
    changent de proprietaire ou de groupe, un compte non autorise peut les lire ou les alterer pour effacer
    ses traces.
  action: chgrp systemd-journal ou root sur les fichiers concernes.
  playbook: infra.fichiers-motif
  parametres:
    dossier: /var/log/
    regex: .*\.journal[~]?
    nature: groupe
    valeur: systemd-journal
    recursif: oui
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - root
    - systemd-journal
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
