id: cac-file-permissions-sudo
titre: Droits de /usr/bin/sudo (4110 au plus)
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: sudo
  type_controle: droits-fichier
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: file_permissions_sudo
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/sudo/file_permissions_sudo
mots_cles:
- chmod
- droits
- fichier
- fichiers
- permissions
- sudo
resume: 'Droits de /usr/bin/sudo : 4110 ou plus strict (aucun droit en plus). (regle file_permissions_sudo,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /usr/bin/sudo 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 4110. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 4110
  bon: 4110 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Restreindre l'execution de sudo a un groupe dedie reduit le nombre de comptes capables de tenter
    une elevation de privileges, par exemple en exploitant une faille de sudo lui-meme.
  action: chmod 4110 sur les fichiers concernes (u-x,go-wx selon le cas).
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '4110'
  sans_playbook: '4110 retire l''execution de sudo a tous sauf au groupe du binaire : a faire seulement
    avec le groupe dedie (sudogrp) deja en place'
pieges:
- 'Appliquer 4110 avec le groupe root interdit sudo a TOUS les administrateurs (verrouillage hors de la
  machine) : creer d''abord le groupe dedie (regle sudo_dedicated_group) et y placer les administrateurs.'
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R38 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
