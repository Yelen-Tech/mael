resume: Le parametre noyau net.ipv4.conf.default.shared_media doit valoir 0, en memoire et de facon persistante.
  (regle sysctl_net_ipv4_conf_default_shared_media, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv4.conf.default.shared_media
  but: Lire la valeur ACTIVE de net.ipv4.conf.default.shared_media
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*net\.ipv4\.conf\.default\.shared_media[[:space:]]*=' /etc/sysctl.conf
    /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv4.conf.default.shared_media = 0 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv4.conf.default.shared_media = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'shared_media l''emporte sur secure_redirects : active, il reautorise les redirections ICMP.
    Il doit donc etre desactive lui aussi.'
  action: Ecrire « net.ipv4.conf.default.shared_media = 0 » dans /etc/sysctl.conf (lu en dernier) puis
    appliquer avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv4.conf.default.shared_media
    valeur: '0'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '0'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv4.conf.default.shared_media
    attendu: '0'
    precedence: sysctl
pieges:
