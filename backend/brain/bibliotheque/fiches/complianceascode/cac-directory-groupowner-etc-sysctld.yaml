id: cac-directory-groupowner-etc-sysctld
titre: 'Groupe de /etc/sysctl.d/ : root'
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: parametres-noyau
  type_controle: groupe-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: directory_groupowner_etc_sysctld
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_within_important_dirs/directory_groupowner_etc_sysctld
mots_cles:
- chgrp
- fichier
- fichiers
- groupe
- sysctl
resume: 'Groupe de /etc/sysctl.d/ : root : groupe root. (regle directory_groupowner_etc_sysctld, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/sysctl.d/ 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = root
  bon: groupe root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/sysctl.d contient les reglages du noyau appliques a chaque demarrage. Qui peut y ecrire
    peut desactiver les protections du noyau (ASLR, filtrage reseau...) : le repertoire doit appartenir
    a root et n''etre modifiable que par lui.'
  action: chgrp root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/sysctl.d/
    groupe: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
