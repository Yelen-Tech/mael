id: cac-apparmor-configured
titre: Service apparmor active et demarre
domaine: systeme
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: controle-acces
  type_controle: service-actif
  niveaux:
    cis: null
    anssi: renforce
source:
  origine: complianceascode
  regle: apparmor_configured
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/apparmor/apparmor_configured
mots_cles:
- apparmor
- demarrage
- service
- services
- systemd
resume: Le service apparmor doit etre active et demarre. (regle apparmor_configured, ComplianceAsCode
  0.1.82).
observer:
- commande: systemctl is-enabled apparmor.service 2>/dev/null; systemctl is-active apparmor.service 2>/dev/null
  but: Lire l'etat de demarrage et d'execution de apparmor
  lecture: 'Attendu : « enabled » puis « active ».'
controles:
- controle: service apparmor enabled/active
  bon: enabled et active
  mauvais: disabled ou inactive
  gravite: moyenne
  risque: 'Sans controle d''acces obligatoire (AppArmor), seuls les droits classiques des fichiers s''appliquent
    : un service compromis dispose de tout ce que son compte peut faire, au lieu du strict necessaire
    prevu par son profil.'
  action: systemctl enable --now apparmor.service
  playbook: infra.service-activer
  parametres:
    service: apparmor
  evaluation:
  - commande: 0
    lecteur: systemctl
    comparateur: actif
pieges:
- 'Un service peut etre demarre par une socket systemd : verifier aussi « systemctl list-sockets ».'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R45 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
