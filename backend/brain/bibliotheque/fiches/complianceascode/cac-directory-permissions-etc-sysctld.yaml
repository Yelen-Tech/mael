id: cac-directory-permissions-etc-sysctld
titre: Droits de /etc/sysctl.d/ (0755 au plus)
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - linux
taxonomie:
  theme: parametres-noyau
  type_controle: droits-fichier
  niveaux:
    cis: null
    anssi: intermediaire
source:
  origine: complianceascode
  regle: directory_permissions_etc_sysctld
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_within_important_dirs/directory_permissions_etc_sysctld
mots_cles:
- chmod
- droits
- fichier
- fichiers
- permissions
- sysctl
resume: 'Droits de /etc/sysctl.d/ : 0755 ou plus strict (aucun droit en plus). (regle directory_permissions_etc_sysctld,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/sysctl.d/ 2>/dev/null
  but: Lire droits, proprietaire et groupe (droits)
  lecture: '1re colonne = droits en octal : aucun bit ne doit depasser 0755. Aucune ligne = fichier absent.'
controles:
- controle: droits <= 0755
  bon: 0755 ou plus strict (aucun droit en plus)
  mauvais: toute autre valeur
  gravite: moyenne
  risque: '/etc/sysctl.d contient les reglages du noyau appliques a chaque demarrage. Qui peut y ecrire
    peut desactiver les protections du noyau (ASLR, filtrage reseau...) : le repertoire doit appartenir
    a root et n''etre modifiable que par lui.'
  action: chmod 0755 sur les fichiers concernes (u-x,go-wx selon le cas).
  playbook: infra.fichier-droits
  parametres:
    chemin: /etc/sysctl.d/
    mode: '0755'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: droits
    comparateur: droits_au_plus
    attendu: '0755'
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R50 (niveau intermediaire)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
