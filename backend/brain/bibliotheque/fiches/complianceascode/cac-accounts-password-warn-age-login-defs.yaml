observer:
- commande: grep -Es '^[[:space:]]*PASS_WARN_AGE[[:space:]]' /etc/login.defs
  but: Lire PASS_WARN_AGE dans /etc/login.defs
  lecture: Valeur de PASS_WARN_AGE ; aucune ligne = non defini.
controles:
- controle: PASS_WARN_AGE au moins 7
  bon: PASS_WARN_AGE 7 ou plus
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: Prevenir l'utilisateur avant l'expiration lui laisse le temps de choisir un bon mot de passe,
    au lieu d'un choix precipite (et faible) au moment du blocage.
  action: Ecrire « PASS_WARN_AGE 7 » dans /etc/login.defs.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/login.defs
    cle: PASS_WARN_AGE
    valeur: '7'
    format: espace
