id: cac-kernel-module-squashfs-disabled
titre: Module noyau squashfs desactive
domaine: noyau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - ubuntu==22.04
taxonomie:
  theme: modules-noyau
  type_controle: module-desactive
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: kernel_module_squashfs_disabled
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/mounting/kernel_module_squashfs_disabled
mots_cles:
- module
- modules
- noyau
- squashfs
resume: Le module noyau squashfs ne doit pas pouvoir etre charge. (regle kernel_module_squashfs_disabled,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Rs 'squashfs' /etc/modprobe.d/ /lib/modprobe.d/ 2>/dev/null
  but: Voir si squashfs est interdit de chargement
  lecture: 'Attendu : « install squashfs /bin/false » (ou /bin/true) et « blacklist squashfs ».'
- commande: lsmod | grep -w 'squashfs'
  but: Voir si squashfs est charge en ce moment
  lecture: Aucune ligne = non charge.
controles:
- controle: module squashfs non chargeable
  bon: install squashfs /bin/false + blacklist, non charge
  mauvais: aucune interdiction, ou module charge
  gravite: faible
  risque: Chaque systeme de fichiers pris en charge est du code du noyau qu'un support piege (cle USB,
    image disque) peut atteindre. Retirer ceux dont on n'a pas besoin reduit la surface d'attaque locale.
  action: Ajouter « install squashfs /bin/false » et « blacklist squashfs » dans /etc/modprobe.d/squashfs.conf,
    puis decharger le module.
  evaluation:
  - commande: 0
    lecteur: modprobe
    comparateur: interdit
    champ: squashfs
  - commande: 1
    lecteur: aucune_ligne
    comparateur: vide
  sans_playbook: 'squashfs est necessaire aux snaps d''Ubuntu : a decider selon l''usage'
pieges:
- 'Desactiver squashfs casse tous les snaps (logiciels installes par snap sur Ubuntu) : verifier « snap
  list » avant.'
- Verifier qu'aucun materiel ou usage (ex. stockage USB) n'a besoin du module avant de l'interdire.
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 1.1.1.6 (niveau 2)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
