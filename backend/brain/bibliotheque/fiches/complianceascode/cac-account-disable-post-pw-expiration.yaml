id: cac-account-disable-post-pw-expiration
titre: Comptes inactifs desactives apres expiration (INACTIVE au plus 45 jours)
domaine: comptes
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: authentification
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: account_disable_post_pw_expiration
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/accounts/accounts-restrictions/account_expiration/account_disable_post_pw_expiration
mots_cles:
- comptes
- expiration
- inactif
- inactive
- inactivite
- useradd
resume: Comptes inactifs desactives apres expiration (INACTIVE au plus 45 jours). (regle account_disable_post_pw_expiration,
  ComplianceAsCode 0.1.82).
observer:
- commande: grep -Es '^[[:space:]]*(export[[:space:]]+|readonly[[:space:]]+)?INACTIVE[[:space:]]*=' /etc/default/useradd
  but: Lire INACTIVE dans /etc/default/useradd
  lecture: Valeur de INACTIVE ; aucune ligne = non defini.
controles:
- controle: INACTIVE entre 0 et 45
  bon: 'INACTIVE=45 ou moins (-1 = jamais : non conforme)'
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: 'Un compte inactif peut etre exploite sans que personne ne le remarque : son titulaire ne se
    connecte plus et ne verra pas un acces frauduleux. Desactiver les comptes inactifs retire aux attaquants
    des comptes oublies dont les identifiants ont pu fuiter.'
  action: useradd -D -f 45 (ecrit INACTIVE dans /etc/default/useradd).
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/default/useradd
    cle: INACTIVE
    valeur: '45'
    format: egal
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: entre
    champ: INACTIVE
    attendu:
    - 0
    - '45'
    defaut: '-1'
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
