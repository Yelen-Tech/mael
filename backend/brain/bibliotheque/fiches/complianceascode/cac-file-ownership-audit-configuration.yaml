id: cac-file-ownership-audit-configuration
titre: 'Proprietaire des fichiers *audit.rules, *auditd.conf de /etc/audit/, des fichiers *.rules de /etc/audit/rules.d/
  : root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: proprietaire-fichier
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: file_ownership_audit_configuration
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/file_ownership_audit_configuration
mots_cles:
- audit
- auditd
- chown
- conf
- fichier
- fichiers
- journalisation
- proprietaire
- rules
resume: 'Proprietaire des fichiers *audit.rules, *auditd.conf de /etc/audit/, des fichiers *.rules de
  /etc/audit/rules.d/ : root : proprietaire root. (regle file_ownership_audit_configuration, ComplianceAsCode
  0.1.82).'
observer:
- commande: find /etc/audit/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*audit(\.rules|d\.conf)$'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
- commande: find /etc/audit/rules.d/ -maxdepth 1 -type f -regextype posix-extended -regex '^.*\.rules$'
    -printf '%m %u %g %p\n' 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Si des personnes non autorisees peuvent modifier la configuration de l'audit, elles peuvent
    desactiver la trace d'evenements critiques ou noyer les journaux pour degrader le systeme et gener
    les enquetes.
  action: chown root sur les fichiers concernes.
  playbook: null
  sans_playbook: 'correction manuelle : voir l''action'
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu: &id001
    - '0'
    - root
  - commande: 1
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu: *id001
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.3.4.6 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.2.4.6 (niveau 2)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.2.4.6 (niveau 2)
verifie_le: '2026-09-18'
relu_par: assistant IA (Claude), par delegation du responsable du projet
