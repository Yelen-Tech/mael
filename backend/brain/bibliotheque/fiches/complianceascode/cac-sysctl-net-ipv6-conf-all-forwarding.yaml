resume: Le parametre noyau net.ipv6.conf.all.forwarding doit valoir 0, en memoire et de facon persistante.
  (regle sysctl_net_ipv6_conf_all_forwarding, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv6.conf.all.forwarding
  but: Lire la valeur ACTIVE de net.ipv6.conf.all.forwarding
  lecture: 'Attendu : 0.'
- commande: grep -Rs '^[[:space:]]*net\.ipv6\.conf\.all\.forwarding[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv6.conf.all.forwarding = 0 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv6.conf.all.forwarding = 0
  bon: 0 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: 'Transmettre les paquets IPv6 d''une interface a l''autre fait de la machine un routeur : un
    attaquant peut s''en servir pour contourner le cloisonnement des reseaux. A reserver aux routeurs.'
  action: Ecrire « net.ipv6.conf.all.forwarding = 0 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv6.conf.all.forwarding
    valeur: '0'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '0'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv6.conf.all.forwarding
    attendu: '0'
    precedence: sysctl
pieges:
- 'Le fichier lu en dernier l''emporte (ordre alphabetique dans /etc/sysctl.d/) : verifier qu''aucun autre
  fichier ne remet une autre valeur.'
