id: cac-audit-rules-privileged-commands-usermod
titre: Audit de l'execution de usermod
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: audit
  type_controle: regle-audit
  niveaux:
    cis: 2
    anssi: null
source:
  origine: complianceascode
  regle: audit_rules_privileged_commands_usermod
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/auditing/auditd_configure_rules/audit_privileged_commands/audit_rules_privileged_commands_usermod
mots_cles:
- audit
- auditctl
- auditd
- commande
- execution
- journalisation
- privilegiee
- tracabilite
- usermod
resume: Chaque execution de /usr/sbin/usermod (commande privilegiee) doit etre tracee par auditd. (regle
  audit_rules_privileged_commands_usermod, ComplianceAsCode 0.1.82).
observer:
- commande: auditctl -l
  but: Lire les regles d'audit CHARGEES dans le noyau
  lecture: Une ligne par regle (-w chemin -p wa, ou -a always,exit -F arch=b64 -S appel...). « No rules
    » = aucune regle.
- commande: grep -hs '^-' /etc/audit/rules.d/*.rules
  but: Lire les regles PERSISTANTES (rechargees au demarrage)
  lecture: Memes regles qu'auditctl -l ; absentes ici = perdues au redemarrage.
controles:
- controle: -a always,exit -F path=/usr/sbin/usermod -F perm=x
  bon: regle d'execution sur /usr/sbin/usermod
  mauvais: regle absente (ou absente au redemarrage)
  gravite: moyenne
  risque: Les commandes privilegiees peuvent etre detournees, volontairement ou non, par des utilisateurs
    autorises ou par un attaquant qui a pris le controle d'un compte, et sont la cible des elevations
    de privileges. Tracer leur execution permet de detecter ces abus.
  action: Ajouter la regle dans un fichier de /etc/audit/rules.d/ (ex. 50-sentinelle.rules), puis « augenrules
    --load ». Si la configuration est immuable (-e 2), redemarrer.
  playbook: infra.audit-regles
  parametres:
    regles: -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k mael
  evaluation:
  - lecteur: audit
    comparateur: execution
    champ: /usr/sbin/usermod
    attendu: x
    commande: 0
  - lecteur: audit
    comparateur: execution
    champ: /usr/sbin/usermod
    attendu: x
    commande: 1
pieges:
- auditctl -l et /etc/audit/rules.d exigent les droits root (sudo).
- 'Une regle chargee a la main (auditctl -w) disparait au redemarrage : elle doit aussi etre dans /etc/audit/rules.d/
  (puis augenrules --load).'
