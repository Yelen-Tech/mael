resume: Le parametre noyau net.ipv6.conf.default.max_addresses doit valoir 1, en memoire et de facon persistante.
  (regle sysctl_net_ipv6_conf_default_max_addresses, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n net.ipv6.conf.default.max_addresses
  but: Lire la valeur ACTIVE de net.ipv6.conf.default.max_addresses
  lecture: 'Attendu : 1.'
- commande: grep -Rs '^[[:space:]]*net\.ipv6\.conf\.default\.max_addresses[[:space:]]*=' /etc/sysctl.conf
    /etc/sysctl.d/ /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « net.ipv6.conf.default.max_addresses = 1 » ; aucune ligne = non persistant.'
controles:
- controle: net.ipv6.conf.default.max_addresses = 1
  bon: 1 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: moyenne
  risque: Limiter le nombre d'adresses IPv6 globales par interface aux adresses configurees empeche l'ajout
    d'adresses non prevues, par exemple via des annonces de routeur forgees.
  action: Ecrire « net.ipv6.conf.default.max_addresses = 1 » dans /etc/sysctl.conf (lu en dernier) puis
    appliquer avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: net.ipv6.conf.default.max_addresses
    valeur: '1'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '1'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: net.ipv6.conf.default.max_addresses
    attendu: '1'
    precedence: sysctl
pieges:
