id: cac-set-ufw-default-rule
titre: 'ufw : politique par defaut en refus (si ufw est l''outil retenu)'
domaine: reseau
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: pare-feu
  type_controle: detection
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: set_ufw_default_rule
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/network/network-ufw/set_ufw_default_rule
mots_cles:
- deny
- par defaut
- politique
- refus
- ufw
resume: 'ufw : politique par defaut en refus. (regle set_ufw_default_rule, ComplianceAsCode 0.1.82).'
observer:
- commande: 'ufw status verbose | grep Default:'
  but: Lire les politiques par defaut d'ufw
  lecture: 'Attendu : deny (ou reject/disabled) pour incoming, outgoing et routed.'
controles:
- controle: politique par defaut deny
  bon: 'Default: deny (incoming), deny (outgoing), disabled (routed)'
  mauvais: au moins une ligne
  gravite: moyenne
  risque: Avec une politique par defaut qui accepte, tout ce qui n'est pas explicitement refuse passe,
    y compris un service ouvert par erreur. Refuser par defaut et n'autoriser que le necessaire est bien
    plus sur.
  action: ufw default deny incoming ; ufw default deny outgoing ; ufw default deny routed (ouvrir ensuite
    le necessaire).
  playbook: null
  sans_playbook: 'la commande liste des elements a examiner un par un (comptes, fichiers, regles) : la
    correction (supprimer, verrouiller, modifier) reste une decision humaine'
  evaluation: []
pieges:
- 'Regle conditionnelle : ne s''applique que si ufw est l''outil retenu (var_network_filtering_service).
  Demander ou constater l''outil en place avant de conclure ; le code ne juge pas cette regle seul.'
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
