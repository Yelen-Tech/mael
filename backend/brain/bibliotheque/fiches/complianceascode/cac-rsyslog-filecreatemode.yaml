id: cac-rsyslog-filecreatemode
titre: 'rsyslog : droits des journaux crees ($FileCreateMode 0640 au plus)'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: configuration
  niveaux:
    cis: 1
    anssi: renforce
source:
  origine: complianceascode
  regle: rsyslog_filecreatemode
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/logging/rsyslog_filecreatemode
mots_cles:
- $filecreatemode
- droits
- filecreatemode
- journaux
- rsyslog
resume: 'rsyslog : droits des journaux crees ($FileCreateMode 0640 au plus). (regle rsyslog_filecreatemode,
  ComplianceAsCode 0.1.82).'
observer:
- commande: grep -Es '^[[:space:]]*\$FileCreateMode[[:space:]]' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
  but: Lire $FileCreateMode dans /etc/rsyslog.conf, /etc/rsyslog.d/*.conf
  lecture: Valeur de $FileCreateMode ; aucune ligne = non defini.
controles:
- controle: $FileCreateMode 0640 ou plus strict
  bon: $FileCreateMode 0640
  mauvais: autre valeur, ou non defini
  gravite: moyenne
  risque: 'Les droits des fichiers de journaux crees par rsyslog doivent etre restreints des leur creation
    (0640 au plus) : sinon ils sont lisibles par tous jusqu''a la prochaine correction.'
  action: Ecrire « $FileCreateMode 0640 » dans /etc/rsyslog.conf, puis redemarrer rsyslog.
  playbook: infra.cle-valeur
  parametres:
    fichier: /etc/rsyslog.conf
    cle: $FileCreateMode
    valeur: '0640'
    format: espace
  evaluation:
  - commande: 0
    lecteur: affectations
    comparateur: droits_au_plus
    champ: $FileCreateMode
    attendu: '0640'
    sep: espace
pieges:
- 'Recette Sentinelle : regle ecrite a la main dans ComplianceAsCode (sans gabarit) ; commande et critere
  rediges d''apres sa description et sa verification (OCIL). A relire en priorite.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.3.4 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.3.4 (niveau 1)
- nom: ANSSI
  document: ANSSI-BP-028 v2.0
  ref: R71 (niveau renforce)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
