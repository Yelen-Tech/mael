resume: Le parametre noyau kernel.perf_event_paranoid doit valoir 2, en memoire et de facon persistante.
  (regle sysctl_kernel_perf_event_paranoid, ComplianceAsCode 0.1.82).
observer:
- commande: sysctl -n kernel.perf_event_paranoid
  but: Lire la valeur ACTIVE de kernel.perf_event_paranoid
  lecture: 'Attendu : 2.'
- commande: grep -Rs '^[[:space:]]*kernel\.perf_event_paranoid[[:space:]]*=' /etc/sysctl.conf /etc/sysctl.d/
    /run/sysctl.d/ /usr/local/lib/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null
  but: Verifier la valeur PERSISTANTE (appliquee au redemarrage)
  lecture: 'Valeur retenue au demarrage = derniere affectation (fichiers tries par nom, /etc/sysctl.conf
    en dernier) : attendu « kernel.perf_event_paranoid = 2 » ; aucune ligne = non persistant.'
controles:
- controle: kernel.perf_event_paranoid = 2
  bon: 2 en memoire et au demarrage
  mauvais: autre valeur, ou valeur non persistante
  gravite: faible
  risque: 'Le profilage du noyau (perf) revele son fonctionnement interne : il doit etre reserve aux administrateurs.'
  action: Ecrire « kernel.perf_event_paranoid = 2 » dans /etc/sysctl.conf (lu en dernier) puis appliquer
    avec sysctl --system.
  playbook: infra.sysctl
  parametres:
    cle: kernel.perf_event_paranoid
    valeur: '2'
  evaluation:
  - commande: 0
    lecteur: valeur
    comparateur: egal
    attendu: '2'
  - commande: 1
    lecteur: affectations
    comparateur: toutes_egales
    champ: kernel.perf_event_paranoid
    attendu: '2'
    precedence: sysctl
pieges:
