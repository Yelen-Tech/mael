id: cac-file-owner-cron-allow
titre: 'Proprietaire de /etc/cron.allow : root'
domaine: services
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: planification
  type_controle: proprietaire-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_owner_cron_allow
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/services/cron_and_at/restrict_at_cron_users/file_owner_cron_allow
mots_cles:
- allow
- chown
- cron
- fichier
- fichiers
- planification
- proprietaire
- taches
resume: 'Proprietaire de /etc/cron.allow : root : proprietaire root. (regle file_owner_cron_allow, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/cron.allow 2>/dev/null
  but: Lire droits, proprietaire et groupe (proprietaire)
  lecture: '2e colonne = proprietaire : attendu root. Aucune ligne = fichier absent.'
controles:
- controle: proprietaire = root
  bon: proprietaire root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: 'Les listes d''acces a cron et at decident qui peut planifier des taches : si un autre compte
    que root peut les modifier, il s''autorise lui-meme (ou autorise un compte compromis).'
  action: chown root sur les fichiers concernes.
  playbook: infra.fichier-proprietaire
  parametres:
    chemin: /etc/cron.allow
    proprietaire: root
  evaluation:
  - commande: 0
    lecteur: stat
    champ: proprietaire
    comparateur: dans
    attendu:
    - '0'
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 2.4.1.8 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 2.4.1.8 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 2.4.1.8 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
