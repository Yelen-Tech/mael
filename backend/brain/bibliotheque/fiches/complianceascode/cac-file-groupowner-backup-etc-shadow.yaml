id: cac-file-groupowner-backup-etc-shadow
titre: 'Groupe de /etc/shadow- : shadow'
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: comptes
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_backup_etc_shadow
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_important_account_files/file_groupowner_backup_etc_shadow
mots_cles:
- chgrp
- comptes
- fichier
- fichiers
- groupe
- mots de passe
- shadow
resume: 'Groupe de /etc/shadow- : shadow : groupe shadow. (regle file_groupowner_backup_etc_shadow, ComplianceAsCode
  0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /etc/shadow- 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu shadow. Aucune ligne = fichier absent.'
controles:
- controle: groupe = shadow
  bon: groupe shadow
  mauvais: toute autre valeur
  gravite: moyenne
  risque: /etc/shadow (et sa copie /etc/shadow-) contient les empreintes des mots de passe. Lisible par
    un autre compte, il permet de les casser hors ligne ; modifiable, il permet de changer le mot de passe
    de root. Il doit appartenir a root, au groupe shadow, en 0640 au plus.
  action: chgrp shadow sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /etc/shadow-
    groupe: shadow
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - '42'
    - shadow
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 7.1.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 7.1.6 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 7.1.6 (niveau 1)
verifie_le: '2026-09-19'
relu_par: assistant IA (Claude), par delegation du responsable du projet
