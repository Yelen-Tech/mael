id: cac-file-groupowner-var-log-auth
titre: 'Groupe de /var/log/auth.log : adm ou root'
domaine: journaux
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: journalisation
  type_controle: groupe-fichier
  niveaux:
    cis: 1
    anssi: null
source:
  origine: complianceascode
  regle: file_groupowner_var_log_auth
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/permissions/files/permissions_var_log_dir/file_groupowner_var_log_auth
mots_cles:
- auth
- chgrp
- fichier
- fichiers
- groupe
resume: 'Groupe de /var/log/auth.log : adm ou root : groupe adm ou root. (regle file_groupowner_var_log_auth,
  ComplianceAsCode 0.1.82).'
observer:
- commande: stat -c '%a %U %G %n' /var/log/auth.log 2>/dev/null
  but: Lire droits, proprietaire et groupe (groupe)
  lecture: '3e colonne = groupe : attendu adm ou root. Aucune ligne = fichier absent.'
controles:
- controle: groupe = adm ou root
  bon: groupe adm ou root
  mauvais: toute autre valeur
  gravite: moyenne
  risque: Le journal d'authentification (/var/log/auth.log, /var/log/secure sur RHEL) trace les connexions
    et les elevations de droits ; il contient parfois un mot de passe tape par erreur a la place de l'identifiant.
    Seul le personnel autorise doit pouvoir le lire, et personne ne doit pouvoir le modifier pour effacer
    ses traces.
  action: chgrp adm ou root sur les fichiers concernes.
  playbook: infra.fichier-groupe
  parametres:
    chemin: /var/log/auth.log
    groupe: adm
  evaluation:
  - commande: 0
    lecteur: stat
    champ: groupe
    comparateur: dans
    attendu:
    - adm
    - root
pieges:
- 'Sans sudo, certains fichiers (ex. /etc/shadow) ne sont pas lisibles par stat/find : relancer avec les
  droits root.'
referentiels:
- nom: CIS
  document: CIS Benchmark for Ubuntu 22.04 LTS v2.0.0
  ref: 6.2.2.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Ubuntu 24.04 LTS v1.0.0
  ref: 6.1.4.1 (niveau 1)
- nom: CIS
  document: CIS Benchmark for Debian 12 v1.1.0
  ref: 6.1.4.1 (niveau 1)
verifie_le: '2026-09-19'
relu_par: Yelen Tech
