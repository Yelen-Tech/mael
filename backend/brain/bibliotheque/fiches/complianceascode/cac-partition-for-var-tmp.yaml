id: cac-partition-for-var-tmp
titre: Partition separee pour /var/tmp
domaine: fichiers
schema: 2
version: 1
etat: verifie
teste_sur: []
applicable:
  os:
  - debian==12
  - ubuntu==22.04
  - ubuntu==24.04
taxonomie:
  theme: montage
  type_controle: partition-separee
  niveaux:
    cis: 2
    anssi: intermediaire
source:
  origine: complianceascode
  regle: partition_for_var_tmp
  version: 0.1.82
  url: https://github.com/ComplianceAsCode/content/tree/v0.1.82/linux_os/guide/system/software/disk_partitioning/partition_for_var_tmp
mots_cles:
- disque
- montage
- partition
- separee
- temporaire
resume: /var/tmp doit etre une partition (ou un montage) separe. (regle partition_for_var_tmp, ComplianceAsCode
  0.1.82).
observer:
- commande: findmnt -kn /var/tmp
  but: Voir si /var/tmp est un montage separe
  lecture: Une ligne = montage separe ; aucune = meme partition que son parent.
controles:
- controle: /var/tmp monte a part
  bon: montage separe
  mauvais: /var/tmp sur la partition de son parent
  gravite: moyenne
  risque: Une partition dediee aux fichiers temporaires permet d'y appliquer noexec, nosuid et nodev,
    et empeche qu'un utilisateur remplisse le disque du systeme en y ecrivant.
  action: 'Prevoir une partition (ou un volume LVM) dedie a /var/tmp et la declarer dans /etc/fstab :
    se planifie, surtout sur un systeme en production.'
  playbook: null
  sans_playbook: 'partition dediee : repartitionnement a planifier, non automatisable'
  evaluation:
  - commande: 0
    lecteur: findmnt
    comparateur: monte
pieges:
- 'Repartitionner un systeme en service est risque : a planifier (ou a appliquer aux prochaines installations).'
