id: electromagnetisme
schema: 1
nom: Électromagnétisme
resume: Théorie des champs électriques et magnétiques unifiée par Maxwell ; elle fonde la radio, les câbles réseau et la compatibilité électromagnétique, et conditionne les attaques par émission dirigée.
famille: physique
version: 1
etat: verifie
verifie_le: 2026-09-20
note: Relu par Kimi (IA) sur délégation du responsable, 20/09/2026
mots_cles:
