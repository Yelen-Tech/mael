id: institutions-internationales
schema: 1
nom: Institutions internationales
resume: "ONU (1945), UIT (1865), ISO (1947), IETF (1986) et ICANN (1998) structurent la coopération et la normalisation mondiales ; leurs standards encadrent directement les protocoles et la cybersécurité."
famille: histoire-geographie
version: 1
etat: verifie
verifie_le: 2026-09-20
note: Relu par Kimi (IA) sur délégation du responsable, 20/09/2026
mots_cles:
