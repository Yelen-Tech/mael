id: histoire-des-telecoms-et-reseaux
schema: 1
nom: Histoire des télécommunications et des réseaux
resume: "Du télégraphe au TCP/IP : ARPANET (1969), la suite TCP/IP (1983) et le Web (1989-1991) ont bâti des réseaux conçus pour la coopération, dont les protocoles historiques restent peu sûrs par défaut."
famille: histoire-geographie
version: 1
etat: verifie
verifie_le: 2026-09-20
note: Relu par Kimi (IA) sur délégation du responsable, 20/09/2026
